<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ============ SEO META TAGS ============ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>AI PDF Editor - Edit, Sign & Extract Text | Bharat24Tools</title>
    <meta name="description" content="Advanced 100% Browser-Based PDF Editor. Add text, images, whiteout, sign documents, and extract text securely. No server upload, works offline.">
    <meta name="keywords" content="pdf editor, edit pdf online, ai pdf editor, extract text from pdf, sign pdf, add text to pdf, free pdf editor">
    <meta name="author" content="Alok">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://aloky7882-sys.github.io/BHARAT24TOOLS/pdf-editor.html">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0f0f1e;
            --bg-panel: #1e1b4b;
            --primary: #a855f7;
            --primary-hover: #9333ea;
            --text-main: #e0e7ff;
            --text-muted: #a5b4fc;
            --border: rgba(168,85,247,0.3);
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        
        body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Toast Notification */
        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #ef4444; color: white; padding: 12px 24px; border-radius: 8px;
            font-weight: 600; z-index: 99999; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #toast.success { background: #10b981; }

        /* Top Navbar */
        .navbar { 
            background: rgba(30, 27, 75, 0.95); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 10; gap: 10px; flex-wrap: wrap;
        }
        .brand { font-weight: 700; font-size: 1rem; color: var(--primary); display: flex; align-items: center; gap: 5px; }
        
        .nav-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        
        .lang-select {
            background: rgba(255,255,255,0.1); border: 1px solid var(--border);
            color: white; padding: 6px 10px; border-radius: 6px;
            font-family: inherit; font-size: 0.8rem; cursor: pointer; outline: none;
        }
        .lang-select option { background: #1e1b4b; color: white; }

        .btn { padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; transition: 0.3s; display: flex; align-items: center; gap: 5px; font-size: 0.8rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--border); }
        .btn-toggle { display: none; background: transparent; color: var(--primary); font-size: 1.2rem; border: none; cursor: pointer; padding: 5px; }

        /* Main Layout */
        .editor-layout { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* Left Sidebar (Tools) */
        .sidebar { width: 250px; background: var(--bg-panel); border-right: 1px solid var(--border); padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; z-index: 5; transition: 0.3s; }
        .section-title { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; font-weight: 600; }
        
        .tool-btn { 
            background: rgba(15,15,30,0.6); color: var(--text-main); border: 1px solid var(--border); 
            padding: 10px 12px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 0.85rem; 
            transition: 0.2s; display: flex; align-items: center; gap: 10px; 
        }
        .tool-btn:hover { background: rgba(168,85,247,0.2); border-color: var(--primary); }
        .tool-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .tool-btn i { width: 18px; text-align: center; }

        /* Center Workspace */
        .workspace { flex: 1; background: #111; display: flex; justify-content: center; align-items: flex-start; padding: 20px; overflow: auto; position: relative; }
        
        /* Upload Zone */
        .upload-zone { 
            width: 100%; max-width: 500px; border: 3px dashed var(--border); border-radius: 15px; 
            padding: 40px 20px; text-align: center; cursor: pointer; transition: 0.3s; margin-top: 40px; display: block; position: relative;
        }
        .upload-zone:hover { border-color: var(--primary); background: rgba(168,85,247,0.05); }
        .upload-zone i { font-size: 3rem; color: var(--primary); margin-bottom: 15px; }
        .upload-zone h2 { margin-bottom: 10px; font-size: 1.2rem; }
        .upload-zone p { color: var(--text-muted); font-size: 0.85rem; }
        
        /* Invisible file input covering the box */
        #fileInput { position: absolute; top:0; left:0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        /* Canvas Wrapper */
        .canvas-wrapper { position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; background: white; }
        #pdfCanvas { display: block; max-width: 100%; height: auto; }
        .canvas-container { position: absolute !important; top: 0; left: 0; }

        /* Right Sidebar (Extract Text) */
        .ai-sidebar { width: 300px; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; z-index: 5; transition: 0.3s; }
        .ai-header { padding: 12px 15px; border-bottom: 1px solid var(--border); font-weight: 600; color: #d8b4fe; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .ai-chat { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { padding: 10px 12px; border-radius: 8px; font-size: 0.8rem; line-height: 1.4; max-width: 90%; word-wrap: break-word; }
        .msg-ai { background: rgba(168,85,247,0.15); border: 1px solid var(--border); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 0; white-space: pre-wrap; user-select: text; }
        
        .ai-input-area { padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-direction: column; }
        .btn-extract { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 0.9rem; }
        .btn-extract:disabled { background: #475569; cursor: not-allowed; }

        /* Loader */
        .loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; gap: 15px; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(168,85,247,0.3); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Mobile Responsive */
        @media (max-width: 900px) {
            .btn-toggle { display: block; }
            .sidebar { position: absolute; left: -260px; height: 100%; }
            .sidebar.show { left: 0; }
            .ai-sidebar { position: absolute; right: -320px; height: 100%; }
            .ai-sidebar.show { right: 0; }
            .workspace { padding: 10px; justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="toast">Error message</div>

    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <h3 id="loaderText" style="color: white; font-size: 1rem;">Processing...</h3>
    </div>

    <!-- Navbar -->
    <div class="navbar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <button class="btn-toggle" id="toggleTools"><i class="fas fa-bars"></i></button>
            <div class="brand"><i class="fas fa-bolt"></i> PDF Editor</div>
        </div>
        
        <div class="nav-actions">
            <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
                <option value="en">EN</option>
                <option value="hi">HI</option>
            </select>
            <button class="btn btn-secondary" id="resetBtn" style="display: none;"><i class="fas fa-times"></i> Close</button>
            <button class="btn btn-primary" id="downloadBtn" style="display: none;"><i class="fas fa-download"></i> Save PDF</button>
            <button class="btn-toggle" id="toggleAI"><i class="fas fa-file-alt"></i></button>
        </div>
    </div>

    <div class="editor-layout">
        
        <!-- Left Tools -->
        <div class="sidebar" id="toolSidebar">
            <div class="section-title" data-i18n="toolsTitle">Editing Tools</div>
            <button class="tool-btn active" id="toolSelect" data-i18n="toolSelect"><i class="fas fa-mouse-pointer"></i> Select / Move</button>
            <button class="tool-btn" id="toolText" data-i18n="toolText"><i class="fas fa-font"></i> Add Text</button>
            <button class="tool-btn" id="toolImage" data-i18n="toolImage"><i class="fas fa-image"></i> Add Image</button>
            <button class="tool-btn" id="toolWhiteout" data-i18n="toolWhiteout"><i class="fas fa-eraser"></i> Whiteout (Hide)</button>
            <button class="tool-btn" id="toolDraw" data-i18n="toolDraw"><i class="fas fa-pen"></i> Draw / Sign</button>
            
            <div class="section-title" style="margin-top: 15px;" data-i18n="actionsTitle">Actions</div>
            <button class="tool-btn" id="toolUndo" data-i18n="toolUndo"><i class="fas fa-undo"></i> Undo</button>
        </div>

        <!-- Center Workspace -->
        <div class="workspace" id="workspace">
            <!-- Upload State -->
            <div class="upload-zone" id="uploadZone">
                <input type="file" id="fileInput" accept="application/pdf">
                <i class="fas fa-file-pdf"></i>
                <h2 data-i18n="uploadTitle">Upload PDF to Edit</h2>
                <p data-i18n="uploadSubtitle">Click here to select your PDF file</p>
            </div>

            <!-- Edit State -->
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="pdfCanvas"></canvas>
                <canvas id="editorCanvas"></canvas>
            </div>
        </div>

        <!-- Right Sidebar (Text Extraction) -->
        <div class="ai-sidebar" id="aiSidebar">
            <div class="ai-header"><i class="fas fa-file-alt"></i> <span data-i18n="aiHeader">Extract Text</span></div>
            <div class="ai-chat" id="aiChat">
                <div class="msg msg-ai" data-i18n="aiWelcome">Upload a PDF to extract its text securely in your browser.</div>
            </div>
            <div class="ai-input-area">
                <button class="btn-extract" id="extractBtn" disabled><i class="fas fa-copy"></i> Extract Text</button>
            </div>
        </div>

    </div>

    <script>
        // ============ 1. TRANSLATIONS ============
        const translations = {
            en: {
                toolsTitle: "Editing Tools", toolSelect: "Select / Move", toolText: "Add Text",
                toolImage: "Add Image", toolWhiteout: "Whiteout (Hide)", toolDraw: "Draw / Sign",
                actionsTitle: "Actions", toolUndo: "Undo",
                uploadTitle: "Upload PDF to Edit", uploadSubtitle: "Click here to select your PDF file",
                aiHeader: "Extract Text", aiWelcome: "Upload a PDF to extract its text securely in your browser.",
                loadingPdf: "Loading PDF...", errorPdf: "Please upload a valid PDF file.",
                merging: "Merging Edits & Saving...", errorSave: "Error Saving: ",
                analyzing: "Extracting Text...", 
                typeHere: "Type here...", copied: "Text copied to clipboard!"
            },
            hi: {
                toolsTitle: "एडिटिंग टूल्स", toolSelect: "सेलेक्ट / मूव", toolText: "टेक्स्ट जोड़ें",
                toolImage: "इमेज जोड़ें", toolWhiteout: "व्हाइटआउट (छिपाएं)", toolDraw: "ड्रॉ / साइन",
                actionsTitle: "एक्शन", toolUndo: "अनडू",
                uploadTitle: "एडिट करने के लिए PDF अपलोड करें", uploadSubtitle: "अपनी PDF फ़ाइल चुनने के लिए यहां क्लिक करें",
                aiHeader: "टेक्स्ट निकालें", aiWelcome: "अपने ब्राउज़र में सुरक्षित रूप से टेक्स्ट निकालने के लिए PDF अपलोड करें।",
                loadingPdf: "PDF लोड हो रही है...", errorPdf: "कृपया एक वैध PDF फ़ाइल अपलोड करें।",
                merging: "बदलाव मर्ज और सेव हो रहे हैं...", errorSave: "PDF सेव करने में त्रुटि: ",
                analyzing: "टेक्स्ट निकाला जा रहा है...", 
                typeHere: "यहाँ टाइप करें...", copied: "टेक्स्ट कॉपी हो गया!"
            }
        };

        let currentLang = 'en';
        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerHTML = t[key];
            });
        }

        // ============ 2. SMART LIBRARY LOADER ============
        function loadScript(url) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = url;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        async function initApp() {
            try {
                try { await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"); } 
                catch(e) { await loadScript("https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"); }
                
                try { await loadScript("https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"); } 
                catch(e) { await loadScript("https://unpkg.com/fabric@5.3.1/dist/fabric.min.js"); }

                try { await loadScript("https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"); } 
                catch(e) { await loadScript("https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"); }

                startApp();
            } catch (error) {
                showToast("Network Error: Could not load tools. Disable AdBlocker.", "error");
            }
        }

        function startApp() {
            pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

            let fabricCanvas = null;
            let originalPdfBytes = null;
            let pdfWidth = 0;
            let pdfHeight = 0;
            let currentPdfDoc = null;
            const RENDER_SCALE = 1.5; 
            let activeUrls = new Set();

            // Cleanup
            function trackUrl(url) { activeUrls.add(url); return url; }
            function revokeAllUrls() {
                activeUrls.forEach(u => { try { URL.revokeObjectURL(u); } catch(e){} });
                activeUrls.clear();
            }

            const fileInput = document.getElementById('fileInput');
            const uploadZone = document.getElementById('uploadZone');
            const canvasWrapper = document.getElementById('canvasWrapper');
            const pdfCanvas = document.getElementById('pdfCanvas');
            const downloadBtn = document.getElementById('downloadBtn');
            const resetBtn = document.getElementById('resetBtn');
            const extractBtn = document.getElementById('extractBtn');
            const loader = document.getElementById('loader');

            const toggleTools = document.getElementById('toggleTools');
            const toggleAI = document.getElementById('toggleAI');
            const toolSidebar = document.getElementById('toolSidebar');
            const aiSidebar = document.getElementById('aiSidebar');

            toggleTools.addEventListener('click', () => {
                toolSidebar.classList.toggle('show');
                aiSidebar.classList.remove('show');
            });
            toggleAI.addEventListener('click', () => {
                aiSidebar.classList.toggle('show');
                toolSidebar.classList.remove('show');
            });

            // Handle File Upload
            fileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file || file.type !== 'application/pdf') {
                    showToast(translations[currentLang].errorPdf, "error");
                    return;
                }

                showLoader(translations[currentLang].loadingPdf);

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    originalPdfBytes = arrayBuffer.slice(0); 
                    
                    currentPdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    const page = await currentPdfDoc.getPage(1); 
                    const viewport = page.getViewport({ scale: RENDER_SCALE });

                    pdfWidth = viewport.width;
                    pdfHeight = viewport.height;

                    pdfCanvas.width = pdfWidth;
                    pdfCanvas.height = pdfHeight;
                    const ctx = pdfCanvas.getContext('2d');
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                    uploadZone.style.display = 'none';
                    canvasWrapper.style.display = 'block';
                    downloadBtn.style.display = 'flex';
                    resetBtn.style.display = 'flex';
                    extractBtn.disabled = false;
                    
                    document.getElementById('aiChat').innerHTML = `<div class="msg msg-ai">✅ PDF Loaded! You can now edit it or extract its text.</div>`;

                    initFabricCanvas();

                } catch (err) {
                    console.error(err);
                    showToast("Error loading PDF. File might be corrupted.", "error");
                } finally {
                    hideLoader();
                }
            });

            function initFabricCanvas() {
                if (fabricCanvas) fabricCanvas.dispose();
                fabricCanvas = new fabric.Canvas('editorCanvas', {
                    width: pdfWidth, height: pdfHeight, backgroundColor: 'transparent'
                });
                fabricCanvas.freeDrawingBrush.width = 3;
                fabricCanvas.freeDrawingBrush.color = '#a855f7';
            }

            // Tool Logics
            const tools = ['toolSelect', 'toolText', 'toolImage', 'toolWhiteout', 'toolDraw'];
            
            function setActiveTool(toolId) {
                tools.forEach(id => document.getElementById(id).classList.remove('active'));
                document.getElementById(toolId).classList.add('active');
                if (!fabricCanvas) return;
                fabricCanvas.isDrawingMode = false;
                fabricCanvas.selection = false;
                fabricCanvas.forEachObject(obj => obj.selectable = false);
            }

            document.getElementById('toolSelect').addEventListener('click', () => {
                setActiveTool('toolSelect');
                if (!fabricCanvas) return;
                fabricCanvas.selection = true;
                fabricCanvas.forEachObject(obj => obj.selectable = true);
            });

            document.getElementById('toolText').addEventListener('click', () => {
                if (!fabricCanvas) return showToast("Upload PDF first!", "error");
                setActiveTool('toolText');
                const text = new fabric.IText(translations[currentLang].typeHere, { left: 50, top: 50, fontFamily: 'Helvetica', fontSize: 20, fill: '#000000' });
                fabricCanvas.add(text);
                fabricCanvas.setActiveObject(text);
                document.getElementById('toolSelect').click(); 
                if(window.innerWidth <= 900) toolSidebar.classList.remove('show');
            });

            document.getElementById('toolWhiteout').addEventListener('click', () => {
                if (!fabricCanvas) return showToast("Upload PDF first!", "error");
                setActiveTool('toolWhiteout');
                const rect = new fabric.Rect({ 
                    left: 50, top: 50, fill: '#ffffff', width: 150, height: 40,
                    stroke: '#e2e8f0', strokeWidth: 1
                });
                fabricCanvas.add(rect);
                fabricCanvas.setActiveObject(rect);
                document.getElementById('toolSelect').click();
                if(window.innerWidth <= 900) toolSidebar.classList.remove('show');
            });

            document.getElementById('toolImage').addEventListener('click', () => {
                if (!fabricCanvas) return showToast("Upload PDF first!", "error");
                const input = document.createElement('input');
                input.type = 'file'; input.accept = 'image/*';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (f) => {
                        fabric.Image.fromURL(f.target.result, (img) => {
                            img.scaleToWidth(200);
                            img.set({ left: 50, top: 50 });
                            fabricCanvas.add(img);
                            fabricCanvas.setActiveObject(img);
                        });
                    };
                    reader.readAsDataURL(file);
                };
                input.click();
            });

            document.getElementById('toolDraw').addEventListener('click', () => {
                if (!fabricCanvas) return showToast("Upload PDF first!", "error");
                setActiveTool('toolDraw');
                fabricCanvas.isDrawingMode = true;
                if(window.innerWidth <= 900) toolSidebar.classList.remove('show');
            });

            document.getElementById('toolUndo').addEventListener('click', () => {
                if (!fabricCanvas) return;
                const activeObj = fabricCanvas.getActiveObject();
                if (activeObj) fabricCanvas.remove(activeObj);
                else {
                    const objects = fabricCanvas.getObjects();
                    if (objects.length > 0) fabricCanvas.remove(objects[objects.length - 1]);
                }
            });

            // Save & Download
            downloadBtn.addEventListener('click', async () => {
                if (!originalPdfBytes) return;
                showLoader(translations[currentLang].merging);

                try {
                    const pdfDoc = await PDFLib.PDFDocument.load(originalPdfBytes);
                    const pages = pdfDoc.getPages();
                    const firstPage = pages[0];
                    const objects = fabricCanvas.getObjects();

                    for (const obj of objects) {
                        const scale = RENDER_SCALE;
                        const objWidth = obj.width * obj.scaleX;
                        const objHeight = obj.height * obj.scaleY;
                        const pdfX = obj.left / scale;
                        const pdfY = (pdfHeight / scale) - (obj.top / scale) - (objHeight / scale);

                        if (obj.type === 'i-text' || obj.type === 'text') {
                            const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
                            firstPage.drawText(obj.text, { x: pdfX, y: pdfY, size: obj.fontSize / scale, font: font, color: PDFLib.rgb(0, 0, 0) });
                        } else if (obj.type === 'rect') {
                            firstPage.drawRectangle({ x: pdfX, y: pdfY, width: objWidth / scale, height: objHeight / scale, color: PDFLib.rgb(1, 1, 1) });
                        } else if (obj.type === 'image') {
                            const imgData = obj.toDataURL({ format: 'png' });
                            const imgBytes = await fetch(imgData).then(res => res.arrayBuffer());
                            const pdfImage = await pdfDoc.embedPng(imgBytes);
                            firstPage.drawImage(pdfImage, { x: pdfX, y: pdfY, width: objWidth / scale, height: objHeight / scale });
                        }
                    }

                    const pdfBytes = await pdfDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const url = trackUrl(URL.createObjectURL(blob));
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Edited-Bharat24Tools.pdf';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                    
                    showToast("PDF Saved Successfully!", "success");

                } catch (err) {
                    console.error(err);
                    showToast(translations[currentLang].errorSave + err.message, "error");
                } finally {
                    hideLoader();
                }
            });

            // Extract Text (100% Client Side)
            extractBtn.addEventListener('click', async () => {
                if (!currentPdfDoc) return;
                extractBtn.disabled = true;
                const aiChat = document.getElementById('aiChat');
                aiChat.innerHTML = `<div class="msg msg-ai"><i class="fas fa-spinner fa-spin"></i> ${translations[currentLang].analyzing}</div>`;
                
                try {
                    let fullText = "";
                    const numPages = Math.min(currentPdfDoc.numPages, 5); // Limit to first 5 pages for speed
                    
                    for (let i = 1; i <= numPages; i++) {
                        const page = await currentPdfDoc.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(' ');
                        fullText += pageText + "\n\n";
                    }
                    
                    if (!fullText.trim()) {
                        aiChat.innerHTML = `<div class="msg msg-ai">❌ No text found. This PDF might be a scanned image.</div>`;
                    } else {
                        aiChat.innerHTML = `<div class="msg msg-ai">${fullText}</div>`;
                        showToast(translations[currentLang].copied, "success");
                    }
                } catch (err) {
                    console.error(err);
                    aiChat.innerHTML = `<div class="msg msg-ai">❌ Error extracting text.</div>`;
                } finally {
                    extractBtn.disabled = false;
                }
            });

            // Reset
            resetBtn.addEventListener('click', () => {
                if (fabricCanvas) { fabricCanvas.dispose(); fabricCanvas = null; }
                revokeAllUrls();
                originalPdfBytes = null;
                currentPdfDoc = null;
                fileInput.value = '';
                uploadZone.style.display = 'block';
                canvasWrapper.style.display = 'none';
                downloadBtn.style.display = 'none';
                resetBtn.style.display = 'none';
                extractBtn.disabled = true;
                document.getElementById('aiChat').innerHTML = `<div class="msg msg-ai">${translations[currentLang].aiWelcome}</div>`;
            });

            function showLoader(text) { document.getElementById('loaderText').innerText = text; loader.style.display = 'flex'; }
            function hideLoader() { loader.style.display = 'none'; }
            window.addEventListener('beforeunload', revokeAllUrls);
        }

        // Toast Helper
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = type === 'success' ? 'success' : '';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 4000);
        }

        // Start
        initApp();
    </script>
</body>
</html>
