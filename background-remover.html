<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Remover AI - BharatOS-Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f1e 0%, #16213e 50%, #533483 100%);
            background-attachment: fixed;
        }
        header {
            background: rgba(15, 15, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid rgba(168, 85, 247, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            padding: 8px 12px;
            border-radius: 6px;
        }
        header a:hover { color: #a855f7; background: rgba(168, 85, 247, 0.1); }
        .brand {
            color: #fff;
            font-weight: 800;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            flex: 1;
        }
        main { max-width: 1000px; margin: 0 auto; padding: 40px 20px 60px; }
        h1 { font-size: 2rem; color: #e0e7ff; text-align: center; margin-bottom: 8px; font-weight: 800; }
        .subtitle { text-align: center; color: #a5b4fc; margin-bottom: 40px; }
        .card {
            background: rgba(30, 27, 75, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            margin-bottom: 24px;
        }
        .upload-zone {
            border: 3px dashed rgba(168, 85, 247, 0.6);
            border-radius: 16px;
            padding: 60px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(99, 102, 241, 0.05);
        }
        .upload-zone:hover, .upload-zone.active {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.15);
        }
        .upload-icon { font-size: 3rem; color: #a855f7; margin-bottom: 16px; }
        .upload-zone p { color: #cbd5e1; margin: 8px 0; }
        .upload-zone .highlight { color: #e0e7ff; font-weight: 700; }
        input[type="file"] { display: none; }
        .preview-section {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: rgba(20, 20, 40, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.2);
            text-align: center;
        }
        .canvas-container {
            position: relative;
            display: inline-block;
            margin: 20px 0;
            cursor: crosshair;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 2px solid rgba(168, 85, 247, 0.3);
            display: block;
        }
        .controls {
            display: none;
            margin-top: 30px;
            padding: 24px;
            background: rgba(20, 20, 40, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }
        .control-group { margin-bottom: 16px; }
        .control-group label { display: block; color: #e0e7ff; font-weight: 700; margin-bottom: 8px; }
        .control-group select, .control-group input[type="range"] {
            width: 100%;
            padding: 12px;
            background: rgba(15, 15, 30, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 8px;
            color: #e0e7ff;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        .brush-controls {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .brush-controls button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid rgba(168, 85, 247, 0.4);
            background: rgba(15, 15, 30, 0.8);
            color: #e0e7ff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .brush-controls button.active {
            background: #a855f7;
            border-color: #a855f7;
            color: #fff;
        }
        button.action-btn {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            font-family: inherit;
        }
        button.action-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
        }
        button.action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
        }
        .status.loading { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; }
        .status.success { background: rgba(34, 197, 94, 0.2); color: #86efac; }
        .status.error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .button-group { display: flex; gap: 12px; flex-wrap: wrap; }
        .button-group button { flex: 1; min-width: 150px; }
        @media (max-width: 768px) {
            .card { padding: 24px; }
            h1 { font-size: 1.5rem; }
            .upload-zone { padding: 40px 20px; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
        <div class="brand"><i class="fas fa-microchip"></i> BharatOS-Tools</div>
    </header>
    <main>
        <h1>🎭 Background Remover AI</h1>
        <p class="subtitle">Touch करके background remove करो — Advanced AI with Brush Tool!</p>
        <div class="card">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon"><i class="fas fa-image"></i></div>
                <p><span class="highlight">Click करो या Drag करो</span></p>
                <p>Image file (.jpg, .png, .webp)</p>
            </div>
            <input type="file" id="fileInput" accept="image/*">

            <div class="preview-section" id="previewSection">
                <div class="canvas-container" id="canvasContainer">
                    <canvas id="outputCanvas"></canvas>
                </div>
            </div>

            <div class="controls" id="controls">
                <div class="control-group">
                    <label>Brush Mode:</label>
                    <div class="brush-controls">
                        <button class="active" id="eraseBtn"><i class="fas fa-eraser"></i> Erase</button>
                        <button id="restoreBtn"><i class="fas fa-paint-brush"></i> Restore</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>Brush Size: <span id="brushSizeLabel">30px</span></label>
                    <input type="range" id="brushSize" min="5" max="100" value="30">
                </div>
                <div class="control-group">
                    <label>Output Format:</label>
                    <select id="formatSelect">
                        <option value="png">📸 PNG (Transparent)</option>
                        <option value="jpg">📷 JPG (White Background)</option>
                    </select>
                </div>
                <div class="button-group">
                    <button class="action-btn" id="removeBtn"><i class="fas fa-magic"></i> Auto Remove Background</button>
                    <button class="action-btn" id="downloadBtn" style="display:none;"><i class="fas fa-download"></i> Download Image</button>
                </div>
            </div>

            <div class="status" id="status"></div>
        </div>
    </main>

    <!-- TensorFlow.js and BodyPix -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2"></script>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const outputCanvas = document.getElementById('outputCanvas');
        const controls = document.getElementById('controls');
        const removeBtn = document.getElementById('removeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const formatSelect = document.getElementById('formatSelect');
        const status = document.getElementById('status');
        const eraseBtn = document.getElementById('eraseBtn');
        const restoreBtn = document.getElementById('restoreBtn');
        const brushSize = document.getElementById('brushSize');
        const brushSizeLabel = document.getElementById('brushSizeLabel');
        const canvasContainer = document.getElementById('canvasContainer');

        let net = null;
        let originalImage = null;
        let isDrawing = false;
        let brushMode = 'erase'; // erase or restore
        let lastX = 0;
        let lastY = 0;
        let scaleX = 1;
        let scaleY = 1;

        // Load BodyPix Model
        async function loadModel() {
            try {
                net = await bodyPix.load({
                    architecture: 'MobileNetV1',
                    outputStride: 16,
                    multiplier: 0.75,
                    quantBytes: 2
                });
                showStatus('✅ AI Model loaded. Upload an image to start.', 'success');
            } catch (error) {
                showStatus('❌ Cannot load AI model. Check internet connection.', 'error');
                console.error(error);
            }
        }
        loadModel();

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('active'); });
        uploadZone.addEventListener('dragleave', () => { uploadZone.classList.remove('active'); });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('active');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                showStatus('❌ Please upload an image file', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    outputCanvas.width = img.width;
                    outputCanvas.height = img.height;
                    const ctx = outputCanvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    previewSection.style.display = 'block';
                    controls.style.display = 'block';
                    downloadBtn.style.display = 'none';
                    setupCanvasScaling();
                    showStatus(`✅ Image loaded: ${file.name}`, 'success');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function setupCanvasScaling() {
            const rect = outputCanvas.getBoundingClientRect();
            scaleX = outputCanvas.width / rect.width;
            scaleY = outputCanvas.height / rect.height;
        }

        window.addEventListener('resize', setupCanvasScaling);

        // Brush mode toggle
        eraseBtn.addEventListener('click', () => {
            brushMode = 'erase';
            eraseBtn.classList.add('active');
            restoreBtn.classList.remove('active');
        });
        restoreBtn.addEventListener('click', () => {
            brushMode = 'restore';
            restoreBtn.classList.add('active');
            eraseBtn.classList.remove('active');
        });
        brushSize.addEventListener('input', () => {
            brushSizeLabel.innerText = brushSize.value + 'px';
        });

        // Auto Background Removal
        removeBtn.addEventListener('click', async () => {
            if (!originalImage || !net) {
                showStatus('❌ Image or model not ready', 'error');
                return;
            }
            removeBtn.disabled = true;
            showStatus('⏳ Processing with AI... Please wait', 'loading');
            try {
                const segmentation = await net.segmentPerson(originalImage, {
                    flipHorizontal: false,
                    internalResolution: 'medium',
                    segmentationThreshold: 0.5
                });
                const ctx = outputCanvas.getContext('2d');
                const imageData = ctx.getImageData(0, 0, outputCanvas.width, outputCanvas.height);
                const data = imageData.data;
                for (let i = 0; i < segmentation.data.length; i++) {
                    if (segmentation.data[i] === 0) {
                        data[i * 4 + 3] = 0;
                    }
                }
                ctx.putImageData(imageData, 0, 0);
                downloadBtn.style.display = 'block';
                showStatus('🎉 Background removed! Now touch/click on the image to fine-tune.', 'success');
            } catch (error) {
                showStatus('❌ Error processing image', 'error');
                console.error(error);
            }
            removeBtn.disabled = false;
        });

        // Touch / Click to Erase or Restore
        function getCanvasCoords(e) {
            const rect = outputCanvas.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: (clientX - rect.left) * (outputCanvas.width / rect.width),
                y: (clientY - rect.top) * (outputCanvas.height / rect.height)
            };
        }

        function drawOnCanvas(e) {
            if (!originalImage) return;
            const coords = getCanvasCoords(e);
            const ctx = outputCanvas.getContext('2d');
            const size = parseInt(brushSize.value);
            ctx.beginPath();
            if (brushMode === 'erase') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.arc(coords.x, coords.y, size / 2, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Restore: draw original image portion
                ctx.globalCompositeOperation = 'source-over';
                ctx.save();
                ctx.beginPath();
                ctx.arc(coords.x, coords.y, size / 2, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(originalImage, 0, 0, outputCanvas.width, outputCanvas.height);
                ctx.restore();
            }
        }

        canvasContainer.addEventListener('mousedown', (e) => {
            isDrawing = true;
            drawOnCanvas(e);
        });
        canvasContainer.addEventListener('mousemove', (e) => {
            if (isDrawing) drawOnCanvas(e);
        });
        canvasContainer.addEventListener('mouseup', () => { isDrawing = false; });
        canvasContainer.addEventListener('mouseleave', () => { isDrawing = false; });

        canvasContainer.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDrawing = true;
            drawOnCanvas(e);
        }, { passive: false });
        canvasContainer.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isDrawing) drawOnCanvas(e);
        }, { passive: false });
        canvasContainer.addEventListener('touchend', () => { isDrawing = false; });

        // Download
        downloadBtn.addEventListener('click', () => {
            if (!outputCanvas || outputCanvas.width === 0) {
                showStatus('❌ No processed image', 'error');
                return;
            }
            const format = formatSelect.value;
            const link = document.createElement('a');
            if (format === 'png') {
                link.href = outputCanvas.toDataURL('image/png');
                link.download = `background-removed-${Date.now()}.png`;
            } else {
                const jpgCanvas = document.createElement('canvas');
                jpgCanvas.width = outputCanvas.width;
                jpgCanvas.height = outputCanvas.height;
                const jpgCtx = jpgCanvas.getContext('2d');
                jpgCtx.fillStyle = '#ffffff';
                jpgCtx.fillRect(0, 0, jpgCanvas.width, jpgCanvas.height);
                jpgCtx.drawImage(outputCanvas, 0, 0);
                link.href = jpgCanvas.toDataURL('image/jpeg', 0.95);
                link.download = `background-removed-${Date.now()}.jpg`;
            }
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showStatus('✅ Image downloaded!', 'success');
        });

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }
    </script>
</body>
</html>
