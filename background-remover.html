<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Remover - BharatOS-Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f1e 0%, #16213e 50%, #533483 100%);
            background-attachment: fixed;
        }

        header {
            background: rgba(15, 15, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid rgba(168, 85, 247, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            padding: 8px 12px;
            border-radius: 6px;
        }

        header a:hover {
            color: #a855f7;
            background: rgba(168, 85, 247, 0.1);
        }

        .brand {
            color: #fff;
            font-weight: 800;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            flex: 1;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        h1 {
            font-size: 2rem;
            color: #e0e7ff;
            text-align: center;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #a5b4fc;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(30, 27, 75, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            margin-bottom: 24px;
        }

        .upload-zone {
            border: 3px dashed rgba(168, 85, 247, 0.6);
            border-radius: 16px;
            padding: 60px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-zone:hover {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.1);
        }

        .upload-zone.active {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.15);
        }

        .upload-icon {
            font-size: 3rem;
            color: #a855f7;
            margin-bottom: 16px;
        }

        .upload-zone p {
            color: #cbd5e1;
            margin: 8px 0;
        }

        .upload-zone .highlight {
            color: #e0e7ff;
            font-weight: 700;
        }

        input[type="file"] { display: none; }

        .preview-section {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: rgba(20, 20, 40, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.2);
            text-align: center;
        }

        .canvas-container {
            position: relative;
            display: inline-block;
            margin: 20px 0;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 2px solid rgba(168, 85, 247, 0.3);
        }

        .controls {
            display: none;
            margin-top: 30px;
            padding: 24px;
            background: rgba(20, 20, 40, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        .control-group {
            margin-bottom: 16px;
        }

        .control-group label {
            display: block;
            color: #e0e7ff;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .control-group select {
            width: 100%;
            padding: 12px;
            background: rgba(15, 15, 30, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 8px;
            color: #e0e7ff;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
        }

        .status.loading {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
        }

        .status.success {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button-group button {
            flex: 1;
            min-width: 150px;
        }

        @media (max-width: 768px) {
            .card { padding: 24px; }
            h1 { font-size: 1.5rem; }
            .upload-zone { padding: 40px 20px; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
        <div class="brand"><i class="fas fa-microchip"></i> BharatOS-Tools</div>
    </header>

    <main>
        <h1>🎭 Background Remover AI</h1>
        <p class="subtitle">Advanced AI से background को instantly remove करो!</p>

        <div class="card">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon"><i class="fas fa-image"></i></div>
                <p><span class="highlight">Click करो या Drag करो</span></p>
                <p>Image file (.jpg, .png, .webp)</p>
            </div>
            <input type="file" id="fileInput" accept="image/*">

            <div class="preview-section" id="previewSection">
                <div class="canvas-container">
                    <canvas id="outputCanvas"></canvas>
                </div>
            </div>

            <div class="controls" id="controls">
                <div class="control-group">
                    <label>Output Format:</label>
                    <select id="formatSelect">
                        <option value="png">📸 PNG (Transparent)</option>
                        <option value="jpg">📷 JPG (White Background)</option>
                    </select>
                </div>
                <div class="button-group">
                    <button id="removeBtn"><i class="fas fa-magic"></i> Remove Background</button>
                    <button id="downloadBtn" style="display:none;"><i class="fas fa-download"></i> Download Image</button>
                </div>
            </div>

            <div class="status" id="status"></div>
        </div>
    </main>

    <!-- TensorFlow.js and BodyPix -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2"></script>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const outputCanvas = document.getElementById('outputCanvas');
        const controls = document.getElementById('controls');
        const removeBtn = document.getElementById('removeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const formatSelect = document.getElementById('formatSelect');
        const status = document.getElementById('status');

        let net = null;
        let originalImage = null;
        let processedCanvas = null;

        // Load BodyPix model
        async function loadModel() {
            try {
                net = await bodyPix.load({
                    architecture: 'MobileNetV1',
                    outputStride: 16,
                    multiplier: 0.75,
                    quantBytes: 2
                });
            } catch (error) {
                showStatus('❌ Cannot load AI model', 'error');
                console.error(error);
            }
        }

        loadModel();

        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('active');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('active');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('active');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                showStatus('❌ Please upload an image file', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    outputCanvas.width = img.width;
                    outputCanvas.height = img.height;
                    
                    const ctx = outputCanvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    
                    previewSection.style.display = 'block';
                    controls.style.display = 'block';
                    downloadBtn.style.display = 'none';
                    showStatus(`✅ Image loaded: ${file.name}`, 'success');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        removeBtn.addEventListener('click', async () => {
            if (!originalImage || !net) {
                showStatus('❌ Image or model not ready', 'error');
                return;
            }

            removeBtn.disabled = true;
            showStatus('⏳ Processing with AI... Please wait', 'loading');

            try {
                // Segment the image
                const segmentation = await net.segmentPerson(originalImage, {
                    flipHorizontal: false,
                    internalResolution: 'medium',
                    segmentationThreshold: 0.5
                });

                // Create output image
                const ctx = outputCanvas.getContext('2d');
                ctx.drawImage(originalImage, 0, 0);
                
                const imageData = ctx.getImageData(0, 0, outputCanvas.width, outputCanvas.height);
                const data = imageData.data;

                // Remove background
                for (let i = 0; i < segmentation.data.length; i++) {
                    if (segmentation.data[i] === 0) { // Background
                        data[i * 4 + 3] = 0; // Set alpha to 0 (transparent)
                    }
                }

                ctx.putImageData(imageData, 0, 0);
                processedCanvas = outputCanvas;
                
                downloadBtn.style.display = 'block';
                showStatus('🎉 Background removed successfully!', 'success');
            } catch (error) {
                showStatus('❌ Error processing image', 'error');
                console.error(error);
            }

            removeBtn.disabled = false;
        });

        downloadBtn.addEventListener('click', () => {
            if (!processedCanvas) {
                showStatus('❌ No processed image', 'error');
                return;
            }

            const format = formatSelect.value;
            const link = document.createElement('a');
            
            if (format === 'png') {
                link.href = processedCanvas.toDataURL('image/png');
                link.download = `background-removed-${Date.now()}.png`;
            } else {
                // For JPG, we need to add white background first
                const jpgCanvas = document.createElement('canvas');
                jpgCanvas.width = processedCanvas.width;
                jpgCanvas.height = processedCanvas.height;
                const jpgCtx = jpgCanvas.getContext('2d');
                
                jpgCtx.fillStyle = '#ffffff';
                jpgCtx.fillRect(0, 0, jpgCanvas.width, jpgCanvas.height);
                jpgCtx.drawImage(processedCanvas, 0, 0);
                
                link.href = jpgCanvas.toDataURL('image/jpeg', 0.95);
                link.download = `background-removed-${Date.now()}.jpg`;
            }

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showStatus('✅ Image downloaded!', 'success');
        });

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }
    </script>
</body>
</html>
