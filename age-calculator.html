<body>

<div class="container">
    <h1><i class="fa-solid fa-cake-candles"></i> Age Calculator</h1>
    <p class="subtitle">Enter your Date of Birth to calculate your exact age</p>

    <div class="input-group">
        <label>Date of Birth</label>
        <input type="date" id="dob">
    </div>

    <label class="toggle-adv">
        <input type="checkbox" id="advToggle">
        Add exact birth time (for hours, minutes, seconds precision)
    </label>

    <div class="input-group" id="timeGroup" style="display:none;">
        <label>Time of Birth (optional)</label>
        <input type="time" id="tob" value="00:00">
    </div>

    <button onclick="calculateAge()">
        <i class="fa-solid fa-calculator"></i> Calculate Age
    </button>

    <div id="result"></div>

    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
</div>

<script>
    // ============ AUTO CLEANUP TRACKERS ============
    let liveInterval = null;

    function clearLiveTimer() {
        if (liveInterval !== null) {
            clearInterval(liveInterval);
            liveInterval = null;
        }
    }

    function fullCleanup() {
        clearLiveTimer();
    }

    // Page unload pe timers clean
    window.addEventListener('beforeunload', fullCleanup);
    window.addEventListener('pagehide', fullCleanup);

    // ============ TOGGLE ============
    const advToggle = document.getElementById('advToggle');
    const timeGroup = document.getElementById('timeGroup');
    advToggle.addEventListener('change', () => {
        timeGroup.style.display = advToggle.checked ? 'block' : 'none';
    });

    // ============ INPUT AUTO-CLEANUP ============
    // Jab bhi user input change kare, purana result auto-clean ho jaye
    document.getElementById('dob').addEventListener('input', () => {
        clearResult();
    });
    document.getElementById('tob').addEventListener('input', () => {
        clearResult();
    });

    function clearResult() {
        const resultBox = document.getElementById('result');
        resultBox.className = '';
        resultBox.innerHTML = '';
        clearLiveTimer();
    }

    // ============ ZODIAC & DAY ============
    function getZodiac(d, m) {
        const signs = [
            ["Capricorn ♑", 19], ["Aquarius ♒", 18], ["Pisces ♓", 20],
            ["Aries ♈", 19], ["Taurus ♉", 20], ["Gemini ♊", 20],
            ["Cancer ♋", 22], ["Leo ♌", 22], ["Virgo ♍", 22],
            ["Libra ♎", 22], ["Scorpio ♏", 21], ["Sagittarius ♐", 21],
            ["Capricorn ♑", 31]
        ];
        return (d > signs[m - 1][1]) ? signs[m][0] : signs[m - 1][0];
    }

    // ============ MAIN CALCULATION ============
    function calculateAge() {
        const dobInput = document.getElementById('dob').value;
        const tobInput = document.getElementById('tob').value || '00:00';
        const resultBox = document.getElementById('result');

        clearLiveTimer();

        if (dobInput === '') {
            resultBox.className = 'show error';
            resultBox.innerHTML = '❌ Please select your date of birth.';
            return;
        }

        const [y, m, d] = dobInput.split('-').map(Number);
        const [hh, mm] = tobInput.split(':').map(Number);
        const birthDate = new Date(y, m - 1, d, hh, mm, 0);
        const today = new Date();

        if (birthDate > today) {
            resultBox.className = 'show error';
            resultBox.innerHTML = '❌ Date of birth cannot be in the future.';
            return;
        }

        // Years / months / days
        let years = today.getFullYear() - birthDate.getFullYear();
        let months = today.getMonth() - birthDate.getMonth();
        let days = today.getDate() - birthDate.getDate();

        if (days < 0) {
            months--;
            const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
            days += prevMonth.getDate();
        }
        if (months < 0) {
            years--;
            months += 12;
        }

        // Total breakdowns
        const diffMs = today.getTime() - birthDate.getTime();
        const totalSeconds = Math.floor(diffMs / 1000);
        const totalMinutes = Math.floor(totalSeconds / 60);
        const totalHours = Math.floor(totalMinutes / 60);
        const totalDays = Math.floor(totalHours / 24);
        const totalWeeks = Math.floor(totalDays / 7);
        const totalMonths = (years * 12) + months;

        // Next birthday
        const nextBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate(), hh, mm, 0);
        if (nextBirthday < today) nextBirthday.setFullYear(today.getFullYear() + 1);

        // Zodiac + born day
        const zodiac = getZodiac(d, m);
        const bornDay = birthDate.toLocaleDateString('en-IN', { weekday: 'long' });

        resultBox.className = 'show';
        resultBox.innerHTML = `
            <span class="big">🎂 ${years} years, ${months} months, ${days} days</span>
            <span class="small">🕰️ Born on a <b>${bornDay}</b></span>
            <span class="small">♈ Zodiac sign: <b>${zodiac}</b></span>

            <div class="grid">
                <div class="tile"><span class="v">${totalMonths.toLocaleString('en-IN')}</span><span class="l">Total Months</span></div>
                <div class="tile"><span class="v">${totalWeeks.toLocaleString('en-IN')}</span><span class="l">Total Weeks</span></div>
                <div class="tile"><span class="v">${totalDays.toLocaleString('en-IN')}</span><span class="l">Total Days</span></div>
                <div class="tile"><span class="v">${totalHours.toLocaleString('en-IN')}</span><span class="l">Total Hours</span></div>
                <div class="tile"><span class="v">${totalMinutes.toLocaleString('en-IN')}</span><span class="l">Total Minutes</span></div>
                <div class="tile"><span class="v">${totalSeconds.toLocaleString('en-IN')}</span><span class="l">Total Seconds</span></div>
            </div>

            <div id="liveCountdown" class="countdown-live" style="margin-top:14px;">
                🎉 Calculating next birthday...
            </div>
        `;

        // Live countdown
        function updateCountdown() {
            const now = new Date();
            let next = new Date(now.getFullYear(), birthDate.getMonth(), birthDate.getDate(), hh, mm, 0);
            if (next < now) next.setFullYear(now.getFullYear() + 1);
            const diff = next.getTime() - now.getTime();

            const cd = document.getElementById('liveCountdown');
            if (!cd) { clearLiveTimer(); return; }

            if (diff <= 0) {
                cd.textContent = '🎉 Happy Birthday!';
                clearLiveTimer();
                return;
            }

            const dd = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hhr = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const mmr = Math.floor((diff / (1000 * 60)) % 60);
            const ssr = Math.floor((diff / 1000) % 60);
            cd.textContent = `🎉 Next birthday in: ${dd}d ${hhr}h ${mmr}m ${ssr}s`;
        }

        updateCountdown();
        liveInterval = setInterval(updateCountdown, 1000);
    }
</script>
