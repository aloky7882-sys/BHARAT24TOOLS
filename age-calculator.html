<div class="container">
    <h1><i class="fa-solid fa-cake-candles"></i> Age Calculator</h1>
    <p class="subtitle">Enter your Date of Birth to calculate your exact age</p>

    <div class="input-group">
        <label>Date of Birth</label>
        <input type="date" id="dob">
    </div>

    <button onclick="calculateAge()">
        <i class="fa-solid fa-calculator"></i> Calculate Age
    </button>

    <div id="result"></div>

    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
</div>

<script>
    function calculateAge(){
        const dobInput = document.getElementById("dob").value;
        const resultBox = document.getElementById("result");

        if(dobInput === ""){
            resultBox.className = "show error";
            resultBox.innerHTML = "❌ Please select your date of birth.";
            return;
        }

        const birthDate = new Date(dobInput);
        const today = new Date();

        if(birthDate > today){
            resultBox.className = "show error";
            resultBox.innerHTML = "❌ Date of birth cannot be in the future.";
            return;
        }

        let years = today.getFullYear() - birthDate.getFullYear();
        let months = today.getMonth() - birthDate.getMonth();
        let days = today.getDate() - birthDate.getDate();

        if(days < 0){
            months--;
            const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
            days += prevMonth.getDate();
        }
        if(months < 0){
            years--;
            months += 12;
        }

        // Total days lived
        const diffTime = today.getTime() - birthDate.getTime();
        const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        const totalMonths = (years * 12) + months;

        // Next birthday countdown
        const nextBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
        if(nextBirthday < today){
            nextBirthday.setFullYear(today.getFullYear() + 1);
        }
        const daysToBirthday = Math.ceil((nextBirthday.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));

        resultBox.className = "show";
        resultBox.innerHTML = `
            <span class="big">🎂 ${years} years, ${months} months, ${days} days</span>
            <span class="small">📅 Total months: ${totalMonths}</span>
            <span class="small">📆 Total days lived: ${totalDays.toLocaleString('en-IN')}</span>
            <span class="small">🎉 Next birthday in: ${daysToBirthday} day${daysToBirthday === 1 ? '' : 's'}</span>
        `;
    }
</script>
