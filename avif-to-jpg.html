<script>
    const translations = {

        hi: { back: "वापस", title: "🎨 AVIF से JPG", subtitle: "AVIF images को JPG में बदलो — browser में", clickOrDrag: "Click करो या Drag करो", formatInfo: "AVIF files — max 15MB", convertBtn: "JPG में बदलो", downloadBtn: "डाउनलोड", resetBtn: "दूसरी file try करो", infoTitle: "कैसे:", infoText: "तुम्हारी AVIF image browser में ही JPG में convert होती है — कोई server नहीं।", loading: "कन्वर्ट हो रहा है...", success: "कन्वर्ट हो गया!", error: "एरर: ", noFiles: "कृपया AVIF files चुनें", tooBig: "File 15MB से बड़ी", notSupported: "आपका browser AVIF support नहीं करता। Chrome, Edge या Firefox use करें।" },
        es: { back: "Atrás", title: "🎨 AVIF a JPG", subtitle: "Convierte AVIF a JPG — en navegador", clickOrDrag: "Clic o arrastra", formatInfo: "AVIF — máx 15MB", convertBtn: "Convertir a JPG", downloadBtn: "Descargar", resetBtn: "Otra Imagen", infoTitle: "Cómo:", infoText: "Tu imagen AVIF se convierte en JPG en el navegador. 100% privado.", loading: "Convirtiendo...", success: "¡Convertido!", error: "Error: ", noFiles: "Selecciona AVIF", tooBig: "Archivo muy grande", notSupported: "Navegador no soporta AVIF." },
        pt: { back: "Voltar", title: "🎨 AVIF para JPG", subtitle: "Converta AVIF para JPG — no navegador", clickOrDrag: "Clique ou arraste", formatInfo: "AVIF — máx 15MB", convertBtn: "Converter para JPG", downloadBtn: "Baixar", resetBtn: "Outra Imagem", infoTitle: "Como:", infoText: "Sua imagem AVIF é convertida no navegador. 100% privado.", loading: "Convertendo...", success: "Convertido!", error: "Erro: ", noFiles: "Selecione AVIF", tooBig: "Arquivo grande", notSupported: "Navegador não suporta AVIF." },
        fr: { back: "Retour", title: "🎨 AVIF vers JPG", subtitle: "Convertissez AVIF en JPG — dans le navigateur", clickOrDrag: "Cliquez ou glissez", formatInfo: "AVIF — max 15MB", convertBtn: "Convertir en JPG", downloadBtn: "Télécharger", resetBtn: "Autre Fichier", infoTitle: "Comment:", infoText: "Votre image AVIF est convertie dans le navigateur. 100% privé.", loading: "Conversion...", success: "Converti!", error: "Erreur: ", noFiles: "Sélectionnez AVIF", tooBig: "Fichier trop grand", notSupported: "Navigateur ne supporte pas AVIF." },
        de: { back: "Zurück", title: "🎨 AVIF zu JPG", subtitle: "AVIF in JPG umwandeln — im Browser", clickOrDrag: "Klick oder ziehe", formatInfo: "AVIF — max 15MB", convertBtn: "In JPG umwandeln", downloadBtn: "Herunterladen", resetBtn: "Andere Datei", infoTitle: "Wie:", infoText: "Ihr AVIF-Bild wird im Browser konvertiert. 100% privat.", loading: "Konvertierung...", success: "Konvertiert!", error: "Fehler: ", noFiles: "AVIF wählen", tooBig: "Datei zu groß", notSupported: "Browser unterstützt AVIF nicht." },
        ar: { back: "رجوع", title: "🎨 AVIF إلى JPG", subtitle: "تحويل AVIF إلى JPG — في المتصفح", clickOrDrag: "انقر أو اسحب", formatInfo: "AVIF — 15MB", convertBtn: "تحويل إلى JPG", downloadBtn: "تحميل", resetBtn: "ملف آخر", infoTitle: "كيف:", infoText: "الصورة تُحول في المتصفح. 100% خاص.", loading: "جاري التحويل...", success: "تم!", error: "خطأ: ", noFiles: "اختر AVIF", tooBig: "الملف كبير", notSupported: "المتصفح لا يدعم AVIF." },
        ru: { back: "Назад", title: "🎨 AVIF в JPG", subtitle: "Преобразуйте AVIF в JPG — в браузере", clickOrDrag: "Нажмите или перетащите", formatInfo: "AVIF — макс 15MB", convertBtn: "В JPG", downloadBtn: "Скачать", resetBtn: "Другой файл", infoTitle: "Как:", infoText: "Изображение конвертируется в браузере. 100% приватно.", loading: "Конвертация...", success: "Готово!", error: "Ошибка: ", noFiles: "Выберите AVIF", tooBig: "Файл слишком большой", notSupported: "Браузер не поддерживает AVIF." },
        id: { back: "Kembali", title: "🎨 AVIF ke JPG", subtitle: "Konversi AVIF ke JPG — di browser", clickOrDrag: "Klik atau seret", formatInfo: "AVIF — maks 15MB", convertBtn: "Konversi ke JPG", downloadBtn: "Unduh", resetBtn: "File Lain", infoTitle: "Cara:", infoText: "Gambar AVIF dikonversi di browser. 100% pribadi.", loading: "Mengkonversi...", success: "Berhasil!", error: "Kesalahan: ", noFiles: "Pilih AVIF", tooBig: "File besar", notSupported: "Browser tidak mendukung AVIF." },
        "zh-CN": { back: "返回", title: "🎨 AVIF 转 JPG", subtitle: "在浏览器中转换 AVIF 为 JPG", clickOrDrag: "点击或拖拽", formatInfo: "AVIF — 最大 15MB", convertBtn: "转换为 JPG", downloadBtn: "下载", resetBtn: "换一批", infoTitle: "原理:", infoText: "您的 AVIF 图片在浏览器中转换。100% 私密。", loading: "转换中...", success: "成功!", error: "错误: ", noFiles: "请选择 AVIF 文件", tooBig: "文件太大", notSupported: "浏览器不支持 AVIF。" }
    };

    let currentLang = localStorage.getItem('lang') || 'en';

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('lang', lang);
        applyTranslations();
    }
    function applyTranslations() {
        const t = translations[currentLang] || translations.en;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.textContent = t[key];
        });
        document.getElementById('languageSelect').value = currentLang;
    }
    function t(key) {
        const tr = translations[currentLang] || translations.en;
        return tr[key] || key;
    }

    // ============ CLIENT-SIDE AVIF CONVERTER ============
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const controls = document.getElementById('controls');
    const convertBtn = document.getElementById('convertBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const status = document.getElementById('status');

    let selectedFiles = [];
    let resultBlob = null;
    let resultFileName = 'converted.jpg';

    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('active'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('active'));
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('active');
        if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFiles(e.target.files);
    });

    function handleFiles(files) {
        const valid = Array.from(files).filter(f => {
            const name = f.name.toLowerCase();
            return name.endsWith('.avif') || f.type.includes('avif');
        });
        if (valid.length === 0) {
            showStatus('❌ ' + t('noFiles'), 'error');
            return;
        }
        const tooBig = valid.filter(f => f.size > 15 * 1024 * 1024);
        if (tooBig.length > 0) {
            showStatus('❌ ' + t('tooBig'), 'error');
            return;
        }
        selectedFiles = valid;
        controls.style.display = 'block';
        convertBtn.style.display = 'flex';
        downloadBtn.style.display = 'none';
        resetBtn.style.display = 'none';
        showStatus(`✅ ${valid.length} file(s) selected`, 'success');
    }

    // Convert AVIF blob to JPG using browser's native decoder
    function convertAvifToJpg(file) {
        return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
                canvas.toBlob((blob) => {
                    if (blob) resolve(blob);
                    else reject(new Error('Canvas toBlob failed'));
                }, 'image/jpeg', 0.92);
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                reject(new Error(t('notSupported')));
            };
            img.src = url;
        });
    }

    convertBtn.addEventListener('click', async () => {
        if (selectedFiles.length === 0) return;

        convertBtn.disabled = true;
        convertBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('loading');
        showStatus('⏳ ' + t('loading'), 'loading');

        try {
            if (selectedFiles.length === 1) {
                // Single file
                const blob = await convertAvifToJpg(selectedFiles[0]);
                resultBlob = blob;
                resultFileName = selectedFiles[0].name.replace(/\.avif$/i, '') + '.jpg';
            } else {
                // Multiple files - ZIP
                const zip = new JSZip();
                for (let i = 0; i < selectedFiles.length; i++) {
                    showStatus(`⏳ ${i + 1}/${selectedFiles.length}`, 'loading');
                    const blob = await convertAvifToJpg(selectedFiles[i]);
                    const name = selectedFiles[i].name.replace(/\.avif$/i, '') + '.jpg';
                    zip.file(name, blob);
                }
                resultBlob = await zip.generateAsync({ type: 'blob' });
                resultFileName = 'converted-avif.zip';
            }

            showStatus('🎉 ' + t('success'), 'success');
            downloadBtn.style.display = 'flex';
            resetBtn.style.display = 'flex';
            convertBtn.style.display = 'none';
        } catch (err) {
            console.error(err);
            showStatus('❌ ' + t('error') + err.message, 'error');
        }

        convertBtn.disabled = false;
        convertBtn.innerHTML = '<i class="fas fa-exchange-alt"></i> ' + t('convertBtn');
    });

    downloadBtn.addEventListener('click', () => {
        if (!resultBlob) return;
        const url = URL.createObjectURL(resultBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = resultFileName;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
    });

    resetBtn.addEventListener('click', () => {
        selectedFiles = [];
        resultBlob = null;
        fileInput.value = '';
        controls.style.display = 'none';
        status.style.display = 'none';
    });

    function showStatus(msg, type) {
        status.textContent = msg;
        status.className = 'status ' + type;
        status.style.display = 'block';
    }

    applyTranslations();
</script>
