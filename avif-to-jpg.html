<body>

<main>

            </button>

            <strong>💡 <span data-i18n="infoTitle">How it works:</span></strong>

</main>

<script>
    const API_URL = 'https://bharat24tools-api.onrender.com';

    const translations = {
        en: { back: "Back", title: "🎨 AVIF to JPG", subtitle: "Convert AVIF images to JPG — batch", clickOrDrag: "Click or Drag", formatInfo: "AVIF files — max 15MB each", convertBtn: "Convert to JPG", downloadBtn: "Download", resetBtn: "Try Another File", infoTitle: "How it works:", infoText: "Server converts AVIF to JPG at 92% quality.", loading: "Converting...", success: "Converted successfully!", error: "Error: ", noFiles: "Please select AVIF files", tooBig: "File too large (max 15MB)" },
        hi: { back: "वापस", title: "🎨 AVIF से JPG", subtitle: "AVIF images को JPG में बदलो", clickOrDrag: "Click करो या Drag करो", formatInfo: "AVIF files — max 15MB", convertBtn: "JPG में बदलो", downloadBtn: "डाउनलोड", resetBtn: "दूसरी file try करो", infoTitle: "कैसे:", infoText: "Server AVIF को JPG में 92% quality पर convert करता है।", loading: "कन्वर्ट हो रहा है...", success: "कन्वर्ट हो गया!", error: "एरर: ", noFiles: "कृपया AVIF files चुनें", tooBig: "File 15MB से बड़ी है" },
        es: { back: "Atrás", title: "🎨 AVIF a JPG", subtitle: "Convierte AVIF a JPG — lote", clickOrDrag: "Clic o arrastra", formatInfo: "AVIF — máx 15MB", convertBtn: "Convertir a JPG", downloadBtn: "Descargar", resetBtn: "Otra Imagen", infoTitle: "Cómo:", infoText: "Servidor convierte AVIF a JPG al 92%.", loading: "Convirtiendo...", success: "¡Convertido!", error: "Error: ", noFiles: "Selecciona AVIF", tooBig: "Archivo muy grande" },
        pt: { back: "Voltar", title: "🎨 AVIF para JPG", subtitle: "Converta AVIF para JPG — lote", clickOrDrag: "Clique ou arraste", formatInfo: "AVIF — máx 15MB", convertBtn: "Converter para JPG", downloadBtn: "Baixar", resetBtn: "Outra Imagem", infoTitle: "Como:", infoText: "Servidor converte AVIF para JPG a 92%.", loading: "Convertendo...", success: "Convertido!", error: "Erro: ", noFiles: "Selecione AVIF", tooBig: "Arquivo muito grande" },
        fr: { back: "Retour", title: "🎨 AVIF vers JPG", subtitle: "Convertissez AVIF en JPG — lot", clickOrDrag: "Cliquez ou glissez", formatInfo: "AVIF — max 15MB", convertBtn: "Convertir en JPG", downloadBtn: "Télécharger", resetBtn: "Autre Fichier", infoTitle: "Comment:", infoText: "Serveur convertit AVIF en JPG à 92%.", loading: "Conversion...", success: "Converti!", error: "Erreur: ", noFiles: "Sélectionnez AVIF", tooBig: "Fichier trop grand" },
        de: { back: "Zurück", title: "🎨 AVIF zu JPG", subtitle: "AVIF in JPG umwandeln", clickOrDrag: "Klick oder ziehe", formatInfo: "AVIF — max 15MB", convertBtn: "In JPG umwandeln", downloadBtn: "Herunterladen", resetBtn: "Andere Datei", infoTitle: "Wie:", infoText: "Server konvertiert AVIF in JPG bei 92%.", loading: "Konvertierung...", success: "Konvertiert!", error: "Fehler: ", noFiles: "AVIF wählen", tooBig: "Datei zu groß" },
        ar: { back: "رجوع", title: "🎨 AVIF إلى JPG", subtitle: "تحويل AVIF إلى JPG", clickOrDrag: "انقر أو اسحب", formatInfo: "AVIF — 15MB", convertBtn: "تحويل إلى JPG", downloadBtn: "تحميل", resetBtn: "ملف آخر", infoTitle: "كيف:", infoText: "السيرفر يحول AVIF إلى JPG بجودة 92%.", loading: "جاري التحويل...", success: "تم!", error: "خطأ: ", noFiles: "اختر AVIF", tooBig: "الملف كبير" },
        ru: { back: "Назад", title: "🎨 AVIF в JPG", subtitle: "Преобразуйте AVIF в JPG", clickOrDrag: "Нажмите или перетащите", formatInfo: "AVIF — макс 15MB", convertBtn: "В JPG", downloadBtn: "Скачать", resetBtn: "Другой файл", infoTitle: "Как:", infoText: "Сервер конвертирует AVIF в JPG на 92%.", loading: "Конвертация...", success: "Готово!", error: "Ошибка: ", noFiles: "Выберите AVIF", tooBig: "Файл слишком большой" },
        id: { back: "Kembali", title: "🎨 AVIF ke JPG", subtitle: "Konversi AVIF ke JPG", clickOrDrag: "Klik atau seret", formatInfo: "AVIF — maks 15MB", convertBtn: "Konversi ke JPG", downloadBtn: "Unduh", resetBtn: "File Lain", infoTitle: "Cara:", infoText: "Server konversi AVIF ke JPG 92%.", loading: "Mengkonversi...", success: "Berhasil!", error: "Kesalahan: ", noFiles: "Pilih AVIF", tooBig: "File besar" },
        "zh-CN": { back: "返回", title: "🎨 AVIF 转 JPG", subtitle: "将 AVIF 转换为 JPG", clickOrDrag: "点击或拖拽", formatInfo: "AVIF — 最大 15MB", convertBtn: "转换为 JPG", downloadBtn: "下载", resetBtn: "换一张", infoTitle: "原理:", infoText: "服务器以 92% 质量将 AVIF 转为 JPG。", loading: "转换中...", success: "成功!", error: "错误: ", noFiles: "请选择 AVIF 文件", tooBig: "文件太大" }
    };

    let currentLang = localStorage.getItem('lang') || 'en';

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('lang', lang);
        applyTranslations();
    }
    function applyTranslations() {
        const t = translations[currentLang] || translations.en;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.textContent = t[key];
        });
        document.getElementById('languageSelect').value = currentLang;
    }
    function t(key) {
        const tr = translations[currentLang] || translations.en;
        return tr[key] || key;
    }

    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const controls = document.getElementById('controls');
    const convertBtn = document.getElementById('convertBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const status = document.getElementById('status');

    let selectedFiles = [];
    let resultBlob = null;
    let resultFileName = 'converted.jpg';

    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('active'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('active'));
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('active');
        if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFiles(e.target.files);
    });

    function handleFiles(files) {
        const valid = Array.from(files).filter(f => {
            const name = f.name.toLowerCase();
            return name.endsWith('.avif') || f.type.includes('avif');
        });
        if (valid.length === 0) {
            showStatus('❌ ' + t('noFiles'), 'error');
            return;
        }
        const tooBig = valid.filter(f => f.size > 15 * 1024 * 1024);
        if (tooBig.length > 0) {
            showStatus('❌ ' + t('tooBig'), 'error');
            return;
        }
        selectedFiles = valid;
        controls.style.display = 'block';
        convertBtn.style.display = 'flex';
        downloadBtn.style.display = 'none';
        resetBtn.style.display = 'none';
        showStatus(`✅ ${valid.length} file(s) selected`, 'success');
    }

    convertBtn.addEventListener('click', async () => {
        if (selectedFiles.length === 0) return;
        if (selectedFiles.length === 1) {
            await convertSingle(selectedFiles[0]);
        } else {
            await convertMultiple();
        }
    });

    async function convertSingle(file) {
        convertBtn.disabled = true;
        convertBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('loading');
        showStatus('⏳ ' + t('loading'), 'loading');

        try {
            const formData = new FormData();
            formData.append('file', file);
            const res = await fetch(API_URL + '/avif-to-jpg', { method: 'POST', body: formData });
            if (!res.ok) throw new Error(await res.text() || 'Server error');
            resultBlob = await res.blob();
            resultFileName = file.name.replace(/\.avif$/i, '') + '.jpg';
            showStatus('🎉 ' + t('success'), 'success');
            downloadBtn.style.display = 'flex';
            resetBtn.style.display = 'flex';
            convertBtn.style.display = 'none';
        } catch (err) {
            showStatus('❌ ' + t('error') + err.message, 'error');
        }
        convertBtn.disabled = false;
        convertBtn.innerHTML = '<i class="fas fa-exchange-alt"></i> ' + t('convertBtn');
    }

    async function convertMultiple() {
        convertBtn.disabled = true;
        convertBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('loading');
        showStatus('⏳ ' + t('loading'), 'loading');

        try {
            const zip = new JSZip();
            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                showStatus(`⏳ ${i + 1}/${selectedFiles.length}`, 'loading');
                const formData = new FormData();
                formData.append('file', file);
                const res = await fetch(API_URL + '/avif-to-jpg', { method: 'POST', body: formData });
                if (res.ok) {
                    const blob = await res.blob();
                    const name = file.name.replace(/\.avif$/i, '') + '.jpg';
                    zip.file(name, blob);
                }
            }
            resultBlob = await zip.generateAsync({ type: 'blob' });
            resultFileName = 'converted-avif.zip';
            showStatus('🎉 ' + t('success'), 'success');
            downloadBtn.style.display = 'flex';
            resetBtn.style.display = 'flex';
            convertBtn.style.display = 'none';
        } catch (err) {
            showStatus('❌ ' + t('error') + err.message, 'error');
        }
        convertBtn.disabled = false;
        convertBtn.innerHTML = '<i class="fas fa-exchange-alt"></i> ' + t('convertBtn');
    }

    downloadBtn.addEventListener('click', () => {
        if (!resultBlob) return;
        const url = URL.createObjectURL(resultBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = resultFileName;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
    });

    resetBtn.addEventListener('click', () => {
        selectedFiles = [];
        resultBlob = null;
        fileInput.value = '';
        controls.style.display = 'none';
        status.style.display = 'none';
    });

    function showStatus(msg, type) {
        status.textContent = msg;
        status.className = 'status ' + type;
        status.style.display = 'block';
    }

    applyTranslations();
</script>
