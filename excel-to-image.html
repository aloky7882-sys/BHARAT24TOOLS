<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel to Image - BharatOS-Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f1e 0%, #16213e 50%, #533483 100%);
            background-attachment: fixed;
        }

        header {
            background: rgba(15, 15, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid rgba(168, 85, 247, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            padding: 8px 12px;
            border-radius: 6px;
        }

        header a:hover {
            color: #a855f7;
            background: rgba(168, 85, 247, 0.1);
        }

        .brand {
            color: #fff;
            font-weight: 800;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            flex: 1;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        h1 {
            font-size: 2rem;
            color: #e0e7ff;
            text-align: center;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #a5b4fc;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(30, 27, 75, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            margin-bottom: 24px;
        }

        .upload-zone {
            border: 3px dashed rgba(168, 85, 247, 0.6);
            border-radius: 16px;
            padding: 60px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-zone:hover, .upload-zone.active {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.15);
        }

        .upload-icon {
            font-size: 3rem;
            color: #a855f7;
            margin-bottom: 16px;
        }

        .upload-zone p {
            color: #cbd5e1;
            margin: 8px 0;
        }

        .upload-zone .highlight {
            color: #e0e7ff;
            font-weight: 700;
        }

        input[type="file"] { display: none; }

        .preview-section {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.2);
            max-height: 500px;
            overflow: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            font-family: 'Arial', sans-serif;
            color: #1a1a1a;
        }

        th, td {
            border: 1px solid #bbb;
            padding: 10px;
            text-align: left;
            word-break: break-word;
            max-width: 100px;
        }

        th {
            background: #4a7ba7;
            color: white;
            font-weight: 700;
        }

        tr:nth-child(even) {
            background: #f5f5f5;
        }

        tr:hover {
            background: #e8e8e8;
        }

        .controls {
            display: none;
            margin-top: 30px;
            padding: 24px;
            background: rgba(20, 20, 40, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        .control-group {
            margin-bottom: 16px;
        }

        .control-group label {
            display: block;
            color: #e0e7ff;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .control-group select {
            width: 100%;
            padding: 12px;
            background: rgba(15, 15, 30, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 8px;
            color: #e0e7ff;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
        }

        .status.loading {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
        }

        .status.success {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        @media (max-width: 768px) {
            .card { padding: 24px; }
            h1 { font-size: 1.5rem; }
            .upload-zone { padding: 40px 20px; }
            table { font-size: 12px; }
            th, td { padding: 6px; max-width: 80px; }
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
        <div class="brand"><i class="fas fa-microchip"></i> BharatOS-Tools</div>
    </header>

    <main>
        <h1>📊 Excel to Image</h1>
        <p class="subtitle">Excel file को high-quality image में convert करो!</p>

        <div class="card">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon"><i class="fas fa-file-excel"></i></div>
                <p><span class="highlight">Click करो या Drag करो</span></p>
                <p>Excel file (.xlsx, .xls, .csv)</p>
            </div>
            <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">

            <div class="preview-section" id="previewSection">
                <table id="previewTable"></table>
            </div>

            <div class="controls" id="controls">
                <div class="control-group">
                    <label>Image Format चुनो:</label>
                    <select id="formatSelect">
                        <option value="png">📸 PNG (Best Quality)</option>
                        <option value="jpg">📷 JPG (Smaller Size)</option>
                        <option value="webp">🖼️ WebP (Modern)</option>
                    </select>
                </div>
                <button id="convertBtn"><i class="fas fa-wand-magic-sparkles"></i> Image बनाओ</button>
            </div>

            <div class="status" id="status"></div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const previewTable = document.getElementById('previewTable');
        const controls = document.getElementById('controls');
        const convertBtn = document.getElementById('convertBtn');
        const formatSelect = document.getElementById('formatSelect');
        const status = document.getElementById('status');

        let excelData = null;

        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('active');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('active');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('active');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file) return;

            showStatus('⏳ Reading Excel file...', 'loading');
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    if (workbook.SheetNames.length === 0) {
                        showStatus('❌ No sheets found', 'error');
                        return;
                    }

                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    excelData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false });
                    
                    if (!excelData || excelData.length === 0) {
                        showStatus('❌ No data found in Excel', 'error');
                        return;
                    }

                    displayPreview(excelData);
                    previewSection.style.display = 'block';
                    controls.style.display = 'block';
                    showStatus(`✅ Excel loaded: ${file.name}`, 'success');
                } catch (error) {
                    showStatus('❌ Error reading Excel file', 'error');
                }
            };

            reader.onerror = () => {
                showStatus('❌ File read error', 'error');
            };

            reader.readAsArrayBuffer(file);
        }

        function displayPreview(data) {
            previewTable.innerHTML = '';
            if (!data || data.length === 0) return;

            const maxRows = Math.min(data.length, 20);
            const maxCols = Math.min(data[0] ? data[0].length : 0, 12);

            // Header row
            const headerRow = document.createElement('tr');
            for (let i = 0; i < maxCols; i++) {
                const th = document.createElement('th');
                th.textContent = (data[0] && data[0][i] !== undefined && data[0][i] !== null && data[0][i] !== '') 
                    ? String(data[0][i]).substring(0, 20)
                    : `Col ${i + 1}`;
                headerRow.appendChild(th);
            }
            previewTable.appendChild(headerRow);

            // Data rows
            for (let i = 1; i < maxRows; i++) {
                const row = document.createElement('tr');
                for (let j = 0; j < maxCols; j++) {
                    const td = document.createElement('td');
                    const cellValue = data[i] && data[i][j] !== undefined && data[i][j] !== null ? String(data[i][j]) : '';
                    td.textContent = cellValue.substring(0, 50);
                    row.appendChild(td);
                }
                previewTable.appendChild(row);
            }
        }

        convertBtn.addEventListener('click', async () => {
            if (!excelData || previewTable.rows.length === 0) {
                showStatus('❌ No data to convert', 'error');
                return;
            }

            convertBtn.disabled = true;
            showStatus('⏳ Converting to image...', 'loading');

            try {
                const clonedContainer = document.createElement('div');
                clonedContainer.style.cssText = 'position: absolute; left: -9999px; background: white; padding: 15px;';
                
                const clonedTable = previewTable.cloneNode(true);
                clonedContainer.appendChild(clonedTable);
                document.body.appendChild(clonedContainer);

                const canvas = await html2canvas(clonedContainer, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    logging: false,
                    useCORS: true
                });

                document.body.removeChild(clonedContainer);

                const format = formatSelect.value;
                let mimeType = 'image/png';
                let quality = 0.95;

                if (format === 'jpg') {
                    mimeType = 'image/jpeg';
                    quality = 0.92;
                } else if (format === 'webp') {
                    mimeType = 'image/webp';
                }

                canvas.toBlob((blob) => {
                    if (blob && blob.size > 0) {
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `excel-table-${Date.now()}.${format}`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);

                        showStatus('🎉 Download successful!', 'success');
                    } else {
                        showStatus('❌ Failed to create image', 'error');
                    }
                    convertBtn.disabled = false;
                }, mimeType, quality);

            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
                convertBtn.disabled = false;
            }
        });

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }
    </script>
</body>
</html>
