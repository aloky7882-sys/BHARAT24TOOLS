<div class="container">
    <h1>🔐 Password Generator</h1>
    <p class="subtitle">Create strong and secure passwords instantly</p>

    <div class="password-box">
        <input type="text" id="password" readonly>
        <button class="copy-icon" id="copyBtn" title="Copy"><i class="fa-solid fa-copy"></i></button>
    </div>

    <div class="strength-meter">
        <div class="fill" id="strengthFill"></div>
    </div>
    <div class="strength-text" id="strengthText">Strength: —</div>

    <div class="length-control">
        <label>Password Length: <span id="lengthValue">16</span></label>
        <input type="range" id="lengthSlider" min="6" max="32" value="16">
    </div>

    <div class="options">
        <label class="option-item">
            <input type="checkbox" id="optUpper" checked> Uppercase (A-Z)
        </label>
        <label class="option-item">
            <input type="checkbox" id="optLower" checked> Lowercase (a-z)
        </label>
        <label class="option-item">
            <input type="checkbox" id="optNumbers" checked> Numbers (0-9)
        </label>
        <label class="option-item">
            <input type="checkbox" id="optSymbols" checked> Symbols (@#$)
        </label>
    </div>

    <button class="btn" onclick="generatePassword()">
        <i class="fa-solid fa-rotate"></i> Generate New Password
    </button>

    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
</div>

<script>
    const passwordEl = document.getElementById("password");
    const copyBtn = document.getElementById("copyBtn");
    const lengthSlider = document.getElementById("lengthSlider");
    const lengthValue = document.getElementById("lengthValue");
    const optUpper = document.getElementById("optUpper");
    const optLower = document.getElementById("optLower");
    const optNumbers = document.getElementById("optNumbers");
    const optSymbols = document.getElementById("optSymbols");
    const strengthFill = document.getElementById("strengthFill");
    const strengthText = document.getElementById("strengthText");

    const CHAR_SETS = {
        upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
        lower: "abcdefghijklmnopqrstuvwxyz",
        numbers: "0123456789",
        symbols: "!@#$%^&*()_+-=[]{}|;:,.<>?"
    };

    lengthSlider.addEventListener("input", function () {
        lengthValue.textContent = this.value;
    });

    [optUpper, optLower, optNumbers, optSymbols].forEach(cb => {
        cb.addEventListener("change", function () {
            if (!optUpper.checked && !optLower.checked && !optNumbers.checked && !optSymbols.checked) {
                this.checked = true;
            }
        });
    });

    function generatePassword() {
        let chars = "";
        if (optUpper.checked) chars += CHAR_SETS.upper;
        if (optLower.checked) chars += CHAR_SETS.lower;
        if (optNumbers.checked) chars += CHAR_SETS.numbers;
        if (optSymbols.checked) chars += CHAR_SETS.symbols;

        if (chars === "") {
            alert("Please select at least one character type.");
            return;
        }

        const length = parseInt(lengthSlider.value);
        let password = "";

        // Cryptographically secure random
        const randomValues = new Uint32Array(length);
        if (window.crypto && window.crypto.getRandomValues) {
            window.crypto.getRandomValues(randomValues);
            for (let i = 0; i < length; i++) {
                password += chars.charAt(randomValues[i] % chars.length);
            }
        } else {
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
        }

        passwordEl.value = password;
        updateStrength(password);
    }

    function updateStrength(pwd) {
        let score = 0;
        if (pwd.length >= 8) score++;
        if (pwd.length >= 12) score++;
        if (pwd.length >= 16) score++;
        if (/[a-z]/.test(pwd)) score++;
        if (/[A-Z]/.test(pwd)) score++;
        if (/[0-9]/.test(pwd)) score++;
        if (/[^a-zA-Z0-9]/.test(pwd)) score++;

        let percent, label, color;
        if (score <= 3) { percent = 30; label = "Weak"; color = "#dc3545"; }
        else if (score <= 5) { percent = 60; label = "Medium"; color = "#fbbf24"; }
        else { percent = 100; label = "Strong"; color = "#22c55e"; }

        strengthFill.style.width = percent + "%";
        strengthFill.style.background = color;
        strengthText.textContent = "Strength: " + label;
        strengthText.style.color = color;
    }

    copyBtn.addEventListener("click", function () {
        if (!passwordEl.value) return;
        navigator.clipboard.writeText(passwordEl.value).then(() => {
            copyBtn.classList.add("copied");
            copyBtn.innerHTML = '<i class="fa-solid fa-check"></i>';
            setTimeout(() => {
                copyBtn.classList.remove("copied");
                copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i>';
            }, 1500);
        }).catch(() => {
            passwordEl.select();
            document.execCommand("copy");
            copyBtn.classList.add("copied");
            copyBtn.innerHTML = '<i class="fa-solid fa-check"></i>';
            setTimeout(() => {
                copyBtn.classList.remove("copied");
                copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i>';
            }, 1500);
        });
    });

    // Auto-generate on load
    generatePassword();
</script>
