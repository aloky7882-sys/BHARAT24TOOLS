<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Advanced QR Code Generator - Bharat24Tools</title>
    
    <!-- ✅ Advanced QR Library -->
    <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body { min-height:100vh; background: linear-gradient(135deg, #0f0f1e 0%, #16213e 50%, #533483 100%); padding:30px 16px 60px; color:#e0e7ff; }
        header { background:rgba(15,15,30,0.95); padding:16px 24px; display:flex; align-items:center; gap:20px; border-bottom:2px solid rgba(168,85,247,0.3); position:sticky; top:0; z-index:100; margin:-30px -16px 30px; }
        header a { color:#cbd5e1; text-decoration:none; font-weight:600; padding:8px 12px; border-radius:6px; transition:all 0.3s; }
        header a:hover { color:#a855f7; background:rgba(168,85,247,0.1); }
        .brand { font-weight:800; font-size:1.3rem; background:linear-gradient(135deg, #a855f7, #ec4899); -webkit-background-clip:text; -webkit-text-fill-color:transparent; flex:1; }
        
        main { max-width:1000px; margin:0 auto; display:flex; flex-wrap:wrap; gap:24px; }
        h1 { font-size:2rem; text-align:center; margin-bottom:8px; font-weight:800; width:100%; }
        .subtitle { text-align:center; color:#a5b4fc; margin-bottom:30px; font-size:0.95rem; width:100%; }

        /* Left Side Controls */
        .controls-card { background:rgba(30,27,75,0.9); border-radius:20px; padding:24px; border:1px solid rgba(168,85,247,0.3); flex:1; min-width:300px; }
        /* Right Side Preview */
        .preview-card { background:rgba(30,27,75,0.9); border-radius:20px; padding:24px; border:1px solid rgba(168,85,247,0.3); flex:1; min-width:300px; display:flex; flex-direction:column; align-items:center; justify-content:center; }

        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:0.8rem; font-weight:600; color:#cbd5e1; margin-bottom:6px; }
        .form-group input[type="text"], .form-group select { width:100%; padding:12px; background:rgba(15,15,30,0.8); border:2px solid rgba(168,85,247,0.3); border-radius:10px; color:#e0e7ff; font-family:inherit; font-size:0.9rem; }
        .form-group input[type="text"]:focus, .form-group select:focus { outline:none; border-color:#a855f7; }
        
        .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        
        /* Color Pickers */
        .color-wrap { display:flex; align-items:center; gap:8px; background:rgba(15,15,30,0.8); padding:6px; border-radius:10px; border:2px solid rgba(168,85,247,0.3); }
        .color-wrap input[type="color"] { border:none; background:transparent; width:30px; height:30px; cursor:pointer; border-radius:5px; }
        .color-wrap span { font-size:0.75rem; color:#cbd5e1; }

        /* Drag & Drop Upload */
        .upload-zone { border:2px dashed rgba(168,85,247,0.5); border-radius:10px; padding:16px; text-align:center; cursor:pointer; transition:all 0.3s; background:rgba(99,102,241,0.05); position:relative; }
        .upload-zone:hover { background:rgba(168,85,247,0.15); border-color:#a855f7; }
        .upload-zone input { position:absolute; inset:0; opacity:0; cursor:pointer; }
        .upload-zone i { font-size:1.5rem; color:#a855f7; margin-bottom:6px; }
        .upload-zone p { font-size:0.75rem; color:#a5b4fc; margin:0; }
        #logoPreview { display:none; max-width:50px; max-height:50px; margin:0 auto; border-radius:6px; }

        /* Buttons */
        .btn { width:100%; padding:14px; border:none; border-radius:10px; font-weight:700; font-size:0.95rem; cursor:pointer; font-family:inherit; transition:all 0.3s; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px; }
        .btn-download { background:linear-gradient(135deg,#a855f7,#ec4899); color:#fff; }
        .btn-download:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(168,85,247,0.4); }
        .btn-reset { background:rgba(220,53,69,0.8); color:#fff; margin-top:8px; font-size:0.85rem; padding:10px; }
        .btn-reset:hover { background:rgba(220,53,69,1); }

        /* Canvas Container */
        #qr-canvas-container { background:#fff; padding:16px; border-radius:16px; margin-bottom:16px; box-shadow:0 10px 30px rgba(0,0,0,0.3); transition:all 0.3s; display:flex; justify-content:center; }
        
        @media(max-width:768px) {
            main { flex-direction:column-reverse; }
            .preview-card { position:sticky; top:70px; z-index:10; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html">← Back</a>
    <div class="brand">⚡ Bharat24Tools</div>
</header>

<main>
    <h1>✨ Advanced AI QR Code</h1>
    <p class="subtitle">Design premium QR codes with logos, gradients, and custom shapes.</p>

    <!-- Controls Side -->
    <div class="controls-card">
        
        <div class="form-group">
            <label>Content (URL, Text, WiFi, etc.)</label>
            <input type="text" id="qr-content" value="https://aloky7882-sys.github.io/BHARAT24TOOLS/" placeholder="Enter URL or text">
        </div>

        <div class="row">
            <div class="form-group">
                <label>Dot Style</label>
                <select id="dot-style">
                    <option value="rounded">Rounded (AI Look)</option>
                    <option value="dots">Dots (Modern)</option>
                    <option value="square">Square (Classic)</option>
                    <option value="classy">Classy</option>
                </select>
            </div>
            <div class="form-group">
                <label>Corner Style</label>
                <select id="corner-style">
                    <option value="extra-rounded">Extra Rounded</option>
                    <option value="leaf">Leaf</option>
                    <option value="dot">Circle</option>
                    <option value="square">Square</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Gradient Color 1</label>
                <div class="color-wrap">
                    <input type="color" id="color1" value="#a855f7">
                    <span id="hex1">#a855f7</span>
                </div>
            </div>
            <div class="form-group">
                <label>Gradient Color 2</label>
                <div class="color-wrap">
                    <input type="color" id="color2" value="#ec4899">
                    <span id="hex2">#ec4899</span>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Logo (Drag & Drop or Click)</label>
            <div class="upload-zone" id="drop-zone">
                <input type="file" id="logo-upload" accept="image/png, image/jpeg, image/jpg">
                <i class="fas fa-cloud-upload-alt" id="upload-icon"></i>
                <p id="upload-text">Upload Logo (PNG/JPG)</p>
                <img id="logoPreview" alt="Logo Preview">
            </div>
        </div>

        <button class="btn btn-download" id="download-btn">
            <i class="fas fa-download"></i> Download HD PNG
        </button>
        <button class="btn btn-reset" id="reset-btn">
            <i class="fas fa-redo"></i> Reset to Default
        </button>
    </div>

    <!-- Preview Side -->
    <div class="preview-card">
        <div id="qr-canvas-container"></div>
        <p style="font-size:0.8rem; color:#a5b4fc; text-align:center;">
            <i class="fas fa-magic" style="color:#fbbf24;"></i> Live Preview updates instantly
        </p>
    </div>

</main>

<script>
    // Default values
    const defaultContent = "https://aloky7882-sys.github.io/BHARAT24TOOLS/";
    const defaultLogo = "https://aloky7882-sys.github.io/BHARAT24TOOLS/favicon-32x32.png"; 
    
    // Initialize QR Code
    const qrCode = new QRCodeStyling({
        width: 300,
        height: 300,
        type: "canvas",
        data: defaultContent,
        image: defaultLogo,
        dotsOptions: {
            color: "#a855f7",
            gradient: {
                type: "linear",
                rotation: Math.PI / 4,
                colorStops: [
                    { offset: 0, color: "#a855f7" },
                    { offset: 1, color: "#ec4899" }
                ]
            },
            type: "rounded"
        },
        backgroundOptions: {
            color: "#ffffff",
        },
        imageOptions: {
            crossOrigin: "anonymous",
            margin: 5,
            imageSize: 0.4 // Logo size relative to QR
        },
        cornersSquareOptions: {
            type: "extra-rounded"
        }
    });

    // Append to container
    qrCode.append(document.getElementById("qr-canvas-container"));

    // Elements
    const contentInput = document.getElementById('qr-content');
    const dotStyle = document.getElementById('dot-style');
    const cornerStyle = document.getElementById('corner-style');
    const color1 = document.getElementById('color1');
    const color2 = document.getElementById('color2');
    const hex1 = document.getElementById('hex1');
    const hex2 = document.getElementById('hex2');
    const logoUpload = document.getElementById('logo-upload');
    const logoPreview = document.getElementById('logoPreview');
    const uploadIcon = document.getElementById('upload-icon');
    const uploadText = document.getElementById('upload-text');

    // Function to update QR code
    function updateQR() {
        qrCode.update({
            data: contentInput.value || defaultContent,
            dotsOptions: {
                type: dotStyle.value,
                gradient: {
                    type: "linear",
                    rotation: Math.PI / 4,
                    colorStops: [
                        { offset: 0, color: color1.value },
                        { offset: 1, color: color2.value }
                    ]
                }
            },
            cornersSquareOptions: {
                type: cornerStyle.value,
                color: color1.value
            },
            cornersDotOptions: {
                color: color2.value
            }
        });
    }

    // Event Listeners for Live Updates
    contentInput.addEventListener('input', updateQR);
    dotStyle.addEventListener('change', updateQR);
    cornerStyle.addEventListener('change', updateQR);
    
    color1.addEventListener('input', (e) => {
        hex1.textContent = e.target.value;
        updateQR();
    });
    color2.addEventListener('input', (e) => {
        hex2.textContent = e.target.value;
        updateQR();
    });

    // Handle Logo Upload
    logoUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const base64Image = event.target.result;
                qrCode.update({ image: base64Image });
                
                // Show preview
                logoPreview.src = base64Image;
                logoPreview.style.display = 'block';
                uploadIcon.style.display = 'none';
                uploadText.textContent = 'Logo Uploaded Successfully!';
                uploadText.style.color = '#86efac';
            };
            reader.readAsDataURL(file);
        }
    });

    // Handle Drag & Drop
    const dropZone = document.getElementById('drop-zone');
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.background = 'rgba(168,85,247,0.3)';
    });
    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.style.background = 'rgba(99,102,241,0.05)';
    });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.background = 'rgba(99,102,241,0.05)';
        if (e.dataTransfer.files.length > 0) {
            logoUpload.files = e.dataTransfer.files;
            logoUpload.dispatchEvent(new Event('change'));
        }
    });

    // Download Button
    document.getElementById('download-btn').addEventListener('click', () => {
        qrCode.download({
            name: "bharat24tools-qr",
            extension: "png"
        });
    });

    // Reset Button
    document.getElementById('reset-btn').addEventListener('click', () => {
        contentInput.value = defaultContent;
        dotStyle.value = "rounded";
        cornerStyle.value = "extra-rounded";
        color1.value = "#a855f7";
        color2.value = "#ec4899";
        hex1.textContent = "#a855f7";
        hex2.textContent = "#ec4899";
        
        // Reset Logo UI
        logoUpload.value = "";
        logoPreview.style.display = 'none';
        uploadIcon.style.display = 'block';
        uploadText.textContent = 'Upload Logo (PNG/JPG)';
        uploadText.style.color = '#a5b4fc';

        // Update QR
        qrCode.update({
            data: defaultContent,
            image: defaultLogo,
            dotsOptions: {
                type: "rounded",
                gradient: {
                    type: "linear",
                    rotation: Math.PI / 4,
                    colorStops: [
                        { offset: 0, color: "#a855f7" },
                        { offset: 1, color: "#ec4899" }
                    ]
                }
            },
            cornersSquareOptions: { type: "extra-rounded" }
        });
    });

</script>
</body>
</html>
