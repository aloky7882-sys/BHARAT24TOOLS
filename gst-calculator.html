<body>

    <header>
        <a href="index.html" class="back">&larr; Back</a>

    </header>

    <main>
        <h1>🧾 GST Calculator</h1>
        <p class="subtitle">GST add ya remove karo, seconds me. Free aur bina signup ke.</p>
        <div class="badge-row">
            <span class="badge">🇮🇳 India Ready</span>
            <span class="badge">⚡ Instant</span>
            <span class="badge">🧾 CGST + SGST</span>
        </div>

        <div class="card">
            <div class="mode-toggle">
                <button type="button" id="mode-add" class="active">Add GST</button>
                <button type="button" id="mode-remove">Remove GST</button>
            </div>

            <label for="amount" id="amount-label">Amount (bina GST ke)</label>
            <input type="number" id="amount" inputmode="decimal" placeholder="Jaise: 10000" min="0">

            <label>GST Rate</label>
            <div class="rate-grid">
                <button type="button" class="rate-btn" data-rate="5">5%</button>
                <button type="button" class="rate-btn active" data-rate="12">12%</button>
                <button type="button" class="rate-btn" data-rate="18">18%</button>
                <button type="button" class="rate-btn" data-rate="28">28%</button>
                <button type="button" class="rate-btn" data-rate="3">3%</button>
                <button type="button" class="rate-btn" data-rate="0.25">0.25%</button>
            </div>

            <div class="results">
                <div class="result-row">
                    <span id="base-label">Base amount</span>
                    <span id="base-value">₹0</span>
                </div>
                <div class="result-row">
                    <span id="gst-label">GST (12%)</span>
                    <span id="gst-value">₹0</span>
                </div>
                <div class="result-row sub">
                    <span>↳ CGST (half)</span>
                    <span id="cgst-value">₹0</span>
                </div>
                <div class="result-row sub">
                    <span>↳ SGST (half)</span>
                    <span id="sgst-value">₹0</span>
                </div>
                <div class="result-row total">
                    <span id="total-label">Total amount</span>
                    <span id="total-value">₹0</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Bharat24Tools. All rights reserved.
    </footer>

    <script>
        (function () {
            var amountInput = document.getElementById('amount');
            var modeAddBtn = document.getElementById('mode-add');
            var modeRemoveBtn = document.getElementById('mode-remove');
            var rateButtons = document.querySelectorAll('.rate-btn');
            var amountLabel = document.getElementById('amount-label');
            var baseLabel = document.getElementById('base-label');
            var gstLabel = document.getElementById('gst-label');
            var totalLabel = document.getElementById('total-label');
            var baseValue = document.getElementById('base-value');
            var gstValue = document.getElementById('gst-value');
            var cgstValue = document.getElementById('cgst-value');
            var sgstValue = document.getElementById('sgst-value');
            var totalValue = document.getElementById('total-value');

            var mode = 'add';
            var rate = 12;

            function formatINR(num) {
                return '₹' + num.toLocaleString('en-IN', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
            }

            function calculate() {
                var amount = parseFloat(amountInput.value) || 0;
                var base, gst, total;

                if (mode === 'add') {
                    base = amount;
                    gst = base * rate / 100;
                    total = base + gst;
                } else {
                    total = amount;
                    base = total / (1 + rate / 100);
                    gst = total - base;
                }

                var cgst = gst / 2;
                var sgst = gst / 2;

                baseValue.textContent = formatINR(base);
                gstValue.textContent = formatINR(gst);
                cgstValue.textContent = formatINR(cgst);
                sgstValue.textContent = formatINR(sgst);
                totalValue.textContent = formatINR(total);
                gstLabel.textContent = 'GST (' + rate + '%)';
            }

            function setMode(newMode) {
                mode = newMode;
                if (mode === 'add') {
                    modeAddBtn.classList.add('active');
                    modeRemoveBtn.classList.remove('active');
                    amountLabel.textContent = 'Amount (bina GST ke)';
                    baseLabel.textContent = 'Base amount';
                    totalLabel.textContent = 'Total amount (GST included)';
                } else {
                    modeRemoveBtn.classList.add('active');
                    modeAddBtn.classList.remove('active');
                    amountLabel.textContent = 'Amount (GST included)';
                    baseLabel.textContent = 'Amount before GST';
                    totalLabel.textContent = 'Total amount';
                }
                calculate();
            }

            modeAddBtn.addEventListener('click', function () { setMode('add'); });
            modeRemoveBtn.addEventListener('click', function () { setMode('remove'); });

            rateButtons.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    rateButtons.forEach(function (b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    rate = parseFloat(btn.getAttribute('data-rate'));
                    calculate();
                });
            });

            amountInput.addEventListener('input', calculate);

            calculate();
        })();
    </script>

</body>
