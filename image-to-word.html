<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Word - BharatOS-Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f1e 0%, #16213e 50%, #533483 100%);
            background-attachment: fixed;
        }

        header {
            background: rgba(15, 15, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid rgba(168, 85, 247, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            padding: 8px 12px;
            border-radius: 6px;
        }

        header a:hover {
            color: #a855f7;
            background: rgba(168, 85, 247, 0.1);
        }

        .brand {
            color: #fff;
            font-weight: 800;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            flex: 1;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        h1 {
            font-size: 2rem;
            color: #e0e7ff;
            text-align: center;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #a5b4fc;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(30, 27, 75, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            margin-bottom: 24px;
        }

        .upload-zone {
            border: 3px dashed rgba(168, 85, 247, 0.6);
            border-radius: 16px;
            padding: 60px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-zone:hover, .upload-zone.active {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.15);
        }

        .upload-icon {
            font-size: 3rem;
            color: #a855f7;
            margin-bottom: 16px;
        }

        .upload-zone p {
            color: #cbd5e1;
            margin: 8px 0;
        }

        .upload-zone .highlight {
            color: #e0e7ff;
            font-weight: 700;
        }

        input[type="file"] { display: none; }

        .preview-img {
            display: none;
            max-width: 100%;
            height: auto;
            margin: 20px 0;
            border-radius: 12px;
        }

        .controls {
            display: none;
            margin-top: 30px;
            padding: 24px;
            background: rgba(20, 20, 40, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        .control-group {
            margin-bottom: 16px;
        }

        .control-group label {
            display: block;
            color: #e0e7ff;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .control-group input {
            width: 100%;
            padding: 12px;
            background: rgba(15, 15, 30, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 8px;
            color: #e0e7ff;
            font-family: inherit;
            font-weight: 600;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
        }

        .status.loading {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
        }

        .status.success {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        @media (max-width: 768px) {
            .card { padding: 24px; }
            h1 { font-size: 1.5rem; }
            .upload-zone { padding: 40px 20px; }
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
        <div class="brand"><i class="fas fa-microchip"></i> BharatOS-Tools</div>
    </header>

    <main>
        <h1>🖼️ Image to Word</h1>
        <p class="subtitle">Image को Word document (.docx) में embed करो!</p>

        <div class="card">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon"><i class="fas fa-file-word"></i></div>
                <p><span class="highlight">Click करो या Drag करो</span></p>
                <p>Image file (JPG, PNG, WebP)</p>
            </div>
            <input type="file" id="fileInput" accept="image/*">
            
            <img id="previewImg" class="preview-img">

            <div class="controls" id="controls">
                <div class="control-group">
                    <label>Document Title:</label>
                    <input type="text" id="docTitle" value="My Document" placeholder="Enter title">
                </div>
                <div class="control-group">
                    <label>File Name:</label>
                    <input type="text" id="fileName" value="image-to-word" placeholder="Enter file name">
                </div>
                <button id="convertBtn"><i class="fas fa-wand-magic-sparkles"></i> Word Document बनाओ</button>
            </div>

            <div class="status" id="status"></div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js"></script>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const controls = document.getElementById('controls');
        const convertBtn = document.getElementById('convertBtn');
        const docTitleInput = document.getElementById('docTitle');
        const fileNameInput = document.getElementById('fileName');
        const status = document.getElementById('status');

        let imageData = null;

        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('active');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('active');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('active');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showStatus('❌ कृपया एक image file चुनें', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                imageData = e.target.result;
                previewImg.src = imageData;
                previewImg.style.display = 'block';
                controls.style.display = 'block';
                showStatus(`✅ Image loaded: ${file.name}`, 'success');
            };
            reader.onerror = () => showStatus('❌ File read error', 'error');
            reader.readAsDataURL(file);
        }

        convertBtn.addEventListener('click', () => {
            if (!imageData) {
                showStatus('❌ कृपया पहले image चुनें', 'error');
                return;
            }

            convertBtn.disabled = true;
            showStatus('⏳ Word document बन रहा है...', 'loading');

            try {
                const { Document, Packer, Paragraph, TextRun, AlignmentType, ImageRun } = window.docx;

                // Extract base64
                const base64 = imageData.split(',')[1];

                const doc = new Document({
                    sections: [{
                        children: [
                            new Paragraph({
                                text: docTitleInput.value,
                                heading: 'Heading1',
                                alignment: AlignmentType.CENTER,
                                spacing: { after: 200 }
                            }),
                            new Paragraph({
                                text: new Date().toLocaleDateString('en-IN'),
                                alignment: AlignmentType.CENTER,
                                spacing: { after: 400 }
                            }),
                            new Paragraph({
                                text: ' '
                            }),
                            new Paragraph({
                                children: [new ImageRun({
                                    data: base64,
                                    transformation: { width: 500, height: 400, type: 'picture' }
                                })],
                                alignment: AlignmentType.CENTER,
                                spacing: { after: 400 }
                            }),
                            new Paragraph({
                                children: [new TextRun({
                                    text: 'Created with BharatOS-Tools',
                                    italic: true,
                                    size: 18,
                                    color: '808080'
                                })],
                                alignment: AlignmentType.CENTER
                            })
                        ]
                    }]
                });

                Packer.toBlob(doc).then(blob => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = fileNameInput.value + '.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    showStatus('🎉 Document download successful!', 'success');
                    convertBtn.disabled = false;
                });
            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
                convertBtn.disabled = false;
            }
        });

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }
    </script>
</body>
</html>
