<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Word (OCR) - Bharat24Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f1e 0%, #16213e 50%, #533483 100%);
            background-attachment: fixed;
        }
        header {
            background: rgba(15, 15, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid rgba(168, 85, 247, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            padding: 8px 12px;
            border-radius: 6px;
        }
        header a:hover {
            color: #a855f7;
            background: rgba(168, 85, 247, 0.1);
        }
        .brand {
            color: #fff;
            font-weight: 800;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            flex: 1;
        }
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }
        h1 {
            font-size: 2rem;
            color: #e0e7ff;
            text-align: center;
            margin-bottom: 8px;
            font-weight: 800;
        }
        .subtitle {
            text-align: center;
            color: #a5b4fc;
            margin-bottom: 40px;
        }
        .card {
            background: rgba(30, 27, 75, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            margin-bottom: 24px;
        }
        .upload-zone {
            border: 3px dashed rgba(168, 85, 247, 0.6);
            border-radius: 16px;
            padding: 60px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(99, 102, 241, 0.05);
        }
        .upload-zone:hover, .upload-zone.active {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.15);
        }
        .upload-icon {
            font-size: 3rem;
            color: #a855f7;
            margin-bottom: 16px;
        }
        .upload-zone p {
            color: #cbd5e1;
            margin: 8px 0;
        }
        .upload-zone .highlight {
            color: #e0e7ff;
            font-weight: 700;
        }
        input[type="file"] { display: none; }
        .preview-img {
            display: none;
            max-width: 100%;
            height: auto;
            margin: 20px 0;
            border-radius: 12px;
        }
        .controls {
            display: none;
            margin-top: 30px;
            padding: 24px;
            background: rgba(20, 20, 40, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }
        .control-group {
            margin-bottom: 16px;
        }
        .control-group label {
            display: block;
            color: #e0e7ff;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .control-group input, .control-group select {
            width: 100%;
            padding: 12px;
            background: rgba(15, 15, 30, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 8px;
            color: #e0e7ff;
            font-family: inherit;
            font-weight: 600;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
        }
        .status.loading {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
        }
        .status.success {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }
        .status.error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }
        .progress-bar {
            display: none;
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            margin-top: 15px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            transition: width 0.3s;
        }
        .preview-text {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: #fff;
            color: #1a1a1a;
            border-radius: 10px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        @media (max-width: 768px) {
            .card { padding: 24px; }
            h1 { font-size: 1.5rem; }
            .upload-zone { padding: 40px 20px; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
        <div class="brand"><i class="fas fa-microchip"></i> Bharat24Tools</div>
    </header>
    <main>
        <h1>🖼️ Image to Word (OCR)</h1>
        <p class="subtitle">Image के अंदर के टेक्स्ट को पढ़कर Word में टाइप करो!</p>
        <div class="card">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon"><i class="fas fa-file-word"></i></div>
                <p><span class="highlight">Click करो या Drag करो</span></p>
                <p>Image file (JPG, PNG, WebP)</p>
            </div>
            <input type="file" id="fileInput" accept="image/*">
            <img id="previewImg" class="preview-img">
            <div class="controls" id="controls">
                <div class="control-group">
                    <label>Document Title:</label>
                    <input type="text" id="docTitle" value="My Document" placeholder="Enter title">
                </div>
                <div class="control-group">
                    <label>File Name:</label>
                    <input type="text" id="fileName" value="image-to-word" placeholder="Enter file name">
                </div>
                <div class="control-group">
                    <label>Language (OCR):</label>
                    <select id="ocrLang">
                        <option value="eng">English</option>
                        <option value="hin">Hindi</option>
                        <option value="eng+hin">English + Hindi</option>
                    </select>
                </div>
                <button id="convertBtn"><i class="fas fa-wand-magic-sparkles"></i> Word Document बनाओ</button>
                <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
            </div>
            <div class="status" id="status"></div>
            <div class="preview-text" id="previewText"></div>
        </div>
    </main>

    <!-- OCR Library -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- Docx Library -->
    <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
    <!-- File Saver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const controls = document.getElementById('controls');
        const convertBtn = document.getElementById('convertBtn');
        const docTitleInput = document.getElementById('docTitle');
        const fileNameInput = document.getElementById('fileName');
        const ocrLang = document.getElementById('ocrLang');
        const status = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const previewText = document.getElementById('previewText');

        let imageData = null;

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('active'); });
        uploadZone.addEventListener('dragleave', () => { uploadZone.classList.remove('active'); });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('active');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showStatus('❌ कृपया एक image file चुनें', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                imageData = e.target.result;
                previewImg.src = imageData;
                previewImg.style.display = 'block';
                controls.style.display = 'block';
                showStatus(`✅ Image loaded: ${file.name}`, 'success');
            };
            reader.onerror = () => showStatus('❌ File read error', 'error');
            reader.readAsDataURL(file);
        }

        convertBtn.addEventListener('click', async () => {
            if (!imageData) {
                showStatus('❌ कृपया पहले image चुनें', 'error');
                return;
            }

            convertBtn.disabled = true;
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';
            showStatus('⏳ Reading text from image (OCR)...', 'loading');

            try {
                // ================== OCR PROCESS ==================
                const worker = await Tesseract.createWorker(ocrLang.value);

                const { data: { text } } = await worker.recognize(imageData);

                await worker.terminate();

                progressFill.style.width = '70%';

                if (!text || text.trim().length === 0) {
                    throw new Error("Image में कोई टेक्स्ट नहीं मिला। कृपया साफ इमेज डालें।");
                }

                // Preview text
                previewText.textContent = text;
                previewText.style.display = 'block';

                showStatus('⏳ Creating Word document...', 'loading');

                // ================== DOCX CREATE ==================
                if (typeof window.docx === 'undefined' || !window.docx.Document) {
                    throw new Error("Docx library load नहीं हुई। Page refresh करें।");
                }

                const { Document, Packer, Paragraph, TextRun, AlignmentType } = window.docx;

                // Split text into lines
                const lines = text.split('\n');

                const paragraphs = lines.map(line => 
                    new Paragraph({
                        children: [
                            new TextRun({
                                text: line,
                                size: 22,
                                font: "Calibri"
                            })
                        ],
                        spacing: { after: 120 }
                    })
                );

                const doc = new Document({
                    sections: [{
                        children: [
                            new Paragraph({
                                alignment: AlignmentType.CENTER,
                                children: [
                                    new TextRun({
                                        text: docTitleInput.value,
                                        bold: true,
                                        size: 32,
                                        color: '2f6fed'
                                    })
                                ],
                                spacing: { after: 200 }
                            }),
                            new Paragraph({
                                alignment: AlignmentType.CENTER,
                                children: [
                                    new TextRun({
                                        text: new Date().toLocaleDateString('en-IN'),
                                        italics: true,
                                        size: 22,
                                        color: '666666'
                                    })
                                ],
                                spacing: { after: 300 }
                            }),
                            ...paragraphs,
                            new Paragraph({
                                alignment: AlignmentType.CENTER,
                                children: [
                                    new TextRun({
                                        text: 'Created with Bharat24Tools',
                                        italics: true,
                                        size: 18,
                                        color: '808080'
                                    })
                                ],
                                spacing: { before: 400 }
                            })
                        ]
                    }]
                });

                const blob = await Packer.toBlob(doc);
                saveAs(blob, fileNameInput.value + '.docx');

                progressFill.style.width = '100%';
                showStatus('🎉 Word document download successful!', 'success');

            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
            }

            convertBtn.disabled = false;
        });

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }
    </script>
</body>
</html>
