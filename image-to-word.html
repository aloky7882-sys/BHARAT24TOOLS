<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Word - HARI TOOLS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f4f7fb 0%, #e8f1f9 100%);
            min-height: 100vh;
        }
        
        header {
            background: linear-gradient(135deg, #2f6fed, #1a4fd6);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header a { color: #fff; text-decoration: none; }
        header .brand { color: #fff; font-weight: 700; }
        
        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        
        h1 { font-size: 1.8rem; text-align: center; margin-bottom: 8px; color: #1a2b45; }
        .subtitle { text-align: center; color: #5c6b82; margin-bottom: 24px; }
        
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 6px 24px rgba(26, 43, 69, 0.07);
            margin-bottom: 20px;
        }
        
        .upload-zone {
            border: 2px dashed #c3cfe4;
            border-radius: 14px;
            padding: 50px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #2f6fed;
            background: #eef4ff;
        }
        
        .upload-zone .icon { font-size: 2.5rem; margin-bottom: 12px; color: #2f6fed; }
        input[type="file"] { display: none; }
        
        .preview {
            display: none;
            margin-top: 20px;
        }
        
        .preview img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .controls {
            display: none;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a2b45;
        }
        
        .control-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #c3cfe4;
            border-radius: 8px;
            font-family: inherit;
        }
        
        button {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .convert-btn {
            background: linear-gradient(135deg, #2f6fed, #1a4fd6);
            color: #fff;
            width: 100%;
            margin-top: 15px;
        }
        
        .convert-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(47, 111, 237, 0.3);
        }
        
        #status {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }
        
        #status.loading { background: #eef4ff; color: #1a4fd6; display: block; }
        #status.success { background: #d4edda; color: #155724; display: block; }
        #status.error { background: #f8d7da; color: #721c24; display: block; }
    </style>
</head>

<body>

    <header>
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
        <span class="brand"><i class="fas fa-file-word"></i> HARI TOOLS</span>
    </header>

    <main>
        <h1>🖼️ Image to Word</h1>
        <p class="subtitle">Image को Word document (.docx) में embed करो!</p>

        <div class="card">
            <div class="upload-zone" id="upload-zone">
                <span class="icon">📄</span>
                <p><strong>Click या drag करो</strong> image यहाँ</p>
            </div>
            <input type="file" id="file-input" accept="image/*">
            
            <div class="preview" id="preview">
                <img id="preview-img" src="" alt="Preview">
            </div>
            
            <div class="controls" id="controls">
                <div class="control-group">
                    <label>Document Title</label>
                    <input type="text" id="title" value="Document" placeholder="Enter document title">
                </div>
                
                <div class="control-group">
                    <label>File Name</label>
                    <input type="text" id="filename" value="image-to-word" placeholder="Enter file name">
                </div>
                
                <button class="convert-btn" id="convert-btn"><i class="fas fa-magic"></i> Create Word Document</button>
            </div>
            
            <p id="status"></p>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js"></script>

    <script>
        class ImageToWord {
            constructor() {
                this.uploadZone = document.getElementById('upload-zone');
                this.fileInput = document.getElementById('file-input');
                this.preview = document.getElementById('preview');
                this.previewImg = document.getElementById('preview-img');
                this.controls = document.getElementById('controls');
                this.convertBtn = document.getElementById('convert-btn');
                this.titleInput = document.getElementById('title');
                this.filenameInput = document.getElementById('filename');
                this.statusEl = document.getElementById('status');
                
                this.imageData = null;
                this.init();
            }

            init() {
                this.uploadZone.addEventListener('click', () => this.fileInput.click());
                
                this.uploadZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    this.uploadZone.classList.add('dragover');
                });
                
                this.uploadZone.addEventListener('dragleave', () => {
                    this.uploadZone.classList.remove('dragover');
                });
                
                this.uploadZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.uploadZone.classList.remove('dragover');
                    if (e.dataTransfer.files[0]) {
                        this.loadImage(e.dataTransfer.files[0]);
                    }
                });

                this.fileInput.addEventListener('change', (e) => {
                    if (e.target.files[0]) {
                        this.loadImage(e.target.files[0]);
                    }
                });

                this.convertBtn.addEventListener('click', () => this.convertToWord());
            }

            loadImage(file) {
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    this.imageData = e.target.result;
                    this.previewImg.src = this.imageData;
                    this.preview.style.display = 'block';
                    this.controls.style.display = 'block';
                    this.showStatus(`✅ Image loaded: ${file.name}`, 'success');
                };
                
                reader.readAsDataURL(file);
            }

            async convertToWord() {
                if (!this.imageData) return;

                this.convertBtn.disabled = true;
                this.showStatus('⏳ Creating Word document...', 'loading');

                try {
                    const { Document, Packer, Paragraph, TextRun, AlignmentType, PageBreak } = window.docx;

                    const doc = new Document({
                        sections: [{
                            children: [
                                new Paragraph({
                                    text: this.titleInput.value,
                                    heading: 'Heading1',
                                    alignment: AlignmentType.CENTER,
                                    spacing: { after: 200 }
                                }),
                                
                                new Paragraph({
                                    text: new Date().toLocaleDateString(),
                                    alignment: AlignmentType.CENTER,
                                    spacing: { after: 400 }
                                }),
                                
                                new Paragraph({
                                    children: [
                                        new TextRun({
                                            text: 'Image inserted from HARI TOOLS',
                                            italic: true,
                                            size: 20
                                        })
                                    ],
                                    spacing: { after: 200 }
                                }),
                                
                                new Paragraph({
                                    text: ' ',
                                    spacing: { after: 200 }
                                })
                            ]
                        }]
                    });

                    // Create image paragraph using HTML
                    const htmlString = `<img src="${this.imageData}" style="max-width: 600px; height: auto;">`;
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = htmlString;
                    
                    const docElement = document.createElement('div');
                    docElement.style.display = 'none';
                    docElement.innerHTML = `
                        <!DOCTYPE html>
                        <html>
                        <body>
                            <h1>${this.titleInput.value}</h1>
                            <p>${new Date().toLocaleDateString()}</p>
                            <p><em>Image inserted from HARI TOOLS</em></p>
                            <img src="${this.imageData}" style="max-width: 600px; height: auto;">
                        </body>
                        </html>
                    `;

                    // Use a simpler approach - create the docx manually
                    const zip = new window.JSZip();
                    
                    // For simplicity, we'll create a basic Word document with the image
                    const xmlContent = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <w:body>
    <w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:t>${this.titleInput.value}</w:t></w:r></w:p>
    <w:p><w:r><w:t></w:t></w:r></w:p>
  </w:body>
</w:document>`;

                    // Fallback: Download as simple HTML that can be opened in Word
                    const htmlContent = `
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        h1 { text-align: center; color: #2f6fed; }
        .date { text-align: center; color: #666; margin: 20px 0; }
        .content { text-align: center; }
        img { max-width: 100%; height: auto; margin: 30px 0; }
    </style>
</head>
<body>
    <h1>${this.titleInput.value}</h1>
    <p class="date">${new Date().toLocaleDateString()}</p>
    <div class="content">
        <img src="${this.imageData}" alt="Image">
    </div>
    <p style="text-align: center; margin-top: 40px; color: #999; font-size: 12px;">
        Created with HARI TOOLS
    </p>
</body>
</html>
                    `;

                    // Create blob and download
                    const blob = new Blob([htmlContent], { type: 'application/msword' });
                    const link = document.createElement('a');
                    link.download = this.filenameInput.value + '.doc';
                    link.href = URL.createObjectURL(blob);
                    link.click();
                    
                    this.showStatus('🎉 Word document created successfully!', 'success');
                } catch (e) {
                    console.error(e);
                    this.showStatus('❌ Error creating Word document', 'error');
                } finally {
                    this.convertBtn.disabled = false;
                }
            }

            showStatus(msg, type) {
                this.statusEl.textContent = msg;
                this.statusEl.className = type;
            }
        }

        window.addEventListener('load', () => {
            new ImageToWord();
        });
    </script>

</body>
</html>
