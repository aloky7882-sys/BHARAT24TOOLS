<div class="container">

    <h1>📱 QR Code Generator</h1>
    <p style="color:#6c757d;font-size:14px;">Enter text or URL to create a QR code</p>

    <input type="text" id="text" placeholder="Enter text or URL" value="https://aloky7882-sys.github.io/BHARAT24TOOLS/">

    <button onclick="generateQR()">Generate QR</button>

    <br>

    <img id="qr" alt="QR Code">

    <button class="download-btn" id="downloadBtn" onclick="downloadQR()">⬇ Download PNG</button>

    <a href="index.html" class="back-link">← Back to Home</a>

</div>

<script>

    function generateQR(){
        let text = document.getElementById("text").value;
        let qr = document.getElementById("qr");
        let downloadBtn = document.getElementById("downloadBtn");

        if(text == ""){
            alert("Please enter some text or URL");
            return;
        }

        qr.src = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(text);
        qr.style.display = "block";
        downloadBtn.style.display = "inline-block";
    }

    function downloadQR(){
        let qr = document.getElementById("qr");
        if(!qr.src) return;
        let a = document.createElement("a");
        a.href = qr.src;
        a.download = "qr-code.png";
        a.target = "_blank";
        a.click();
    }

    // Auto-generate on load
    window.addEventListener("load", generateQR);

</script>
