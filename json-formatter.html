<body>
<div class="wrapper">
    <div class="page-header">
        <h1><i class="fa-solid fa-brackets-curly"></i> JSON Formatter & Validator</h1>
        <p>Paste JSON, format it beautifully, minify it, or catch syntax errors instantly.</p>
    </div>

    <div class="toolbar">
        <button class="btn-primary" id="formatBtn"><i class="fa-solid fa-align-left"></i> Format / Beautify</button>
        <button class="btn-secondary" id="minifyBtn"><i class="fa-solid fa-compress"></i> Minify</button>
        <button class="btn-secondary" id="sampleBtn"><i class="fa-solid fa-file-code"></i> Load Sample</button>
        <button class="btn-secondary" id="clearBtn"><i class="fa-solid fa-trash"></i> Clear</button>
    </div>

    <div class="editor-grid">
        <div class="panel">
            <h3>Input</h3>
            <textarea id="inputBox" placeholder='Paste your JSON here, e.g. {"name":"Bharat Tools","free":true}'></textarea>
            <div class="status-box" id="statusBox"></div>
        </div>

        <div class="panel">
            <h3>Output <button class="copy-mini" id="copyBtn">Copy</button></h3>
            <pre id="outputBox"></pre>
        </div>
    </div>

    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
</div>

<script>
    const inputBox = document.getElementById("inputBox");
    const outputBox = document.getElementById("outputBox");
    const statusBox = document.getElementById("statusBox");
    const formatBtn = document.getElementById("formatBtn");
    const minifyBtn = document.getElementById("minifyBtn");
    const sampleBtn = document.getElementById("sampleBtn");
    const clearBtn = document.getElementById("clearBtn");
    const copyBtn = document.getElementById("copyBtn");

    let lastFormatted = "";

    function escapeHTML(str){
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function syntaxHighlight(json){
        const escaped = escapeHTML(json);
        return escaped.replace(
            /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g,
            function(match){
                let cls = "json-number";
                if(/^"/.test(match)){
                    cls = /:$/.test(match) ? "json-key" : "json-string";
                } else if(/true|false/.test(match)){
                    cls = "json-boolean";
                } else if(/null/.test(match)){
                    cls = "json-null";
                }
                return `<span class="${cls}">${match}</span>`;
            }
        );
    }

    function getErrorPosition(str, err){
        const match = err.message.match(/position (\d+)/);
        if(!match) return "";
        const pos = parseInt(match[1]);
        const before = str.substring(0, pos);
        const line = before.split("\n").length;
        const col = pos - before.lastIndexOf("\n");
        return ` (line ${line}, column ${col})`;
    }

    function formatJSON(){
        const raw = inputBox.value.trim();
        if(!raw){
            statusBox.className = "status-box";
            outputBox.innerHTML = "";
            return;
        }
        try{
            const parsed = JSON.parse(raw);
            const pretty = JSON.stringify(parsed, null, 4);
            lastFormatted = pretty;
            outputBox.innerHTML = syntaxHighlight(pretty);
            statusBox.className = "status-box status-valid";
            statusBox.innerText = "✅ Valid JSON";
        } catch(err){
            outputBox.innerHTML = "";
            lastFormatted = "";
            statusBox.className = "status-box status-invalid";
            statusBox.innerText = "❌ Invalid JSON: " + err.message + getErrorPosition(raw, err);
        }
    }

    function minifyJSON(){
        const raw = inputBox.value.trim();
        if(!raw) return;
        try{
            const parsed = JSON.parse(raw);
            const minified = JSON.stringify(parsed);
            lastFormatted = minified;
            outputBox.innerHTML = syntaxHighlight(minified);
            statusBox.className = "status-box status-valid";
            statusBox.innerText = "✅ Valid JSON — minified";
        } catch(err){
            outputBox.innerHTML = "";
            lastFormatted = "";
            statusBox.className = "status-box status-invalid";
            statusBox.innerText = "❌ Invalid JSON: " + err.message + getErrorPosition(raw, err);
        }
    }

    formatBtn.addEventListener("click", formatJSON);
    minifyBtn.addEventListener("click", minifyJSON);

    sampleBtn.addEventListener("click", function(){
        inputBox.value = JSON.stringify({
            name: "Bharat Tools",
            free: true,
            tools: ["PDF", "Image", "QR", "Calculators"],
            rating: 4.8,
            contact: null,
            stats: { users: 100000, uptime: "24x7" }
        }, null, 4);
        formatJSON();
    });

    clearBtn.addEventListener("click", function(){
        inputBox.value = "";
        outputBox.innerHTML = "";
        statusBox.className = "status-box";
    });

    copyBtn.addEventListener("click", function(){
        if(!lastFormatted) return;
        navigator.clipboard.writeText(lastFormatted).then(() => {
            copyBtn.innerText = "Copied!";
            setTimeout(() => { copyBtn.innerText = "Copy"; }, 1500);
        });
    });

    inputBox.addEventListener("input", function(){
        if(inputBox.value.trim() === ""){
            outputBox.innerHTML = "";
            statusBox.className = "status-box";
        }
    });
</script>
