    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }

        /* ✅ Editor Layout (I Love IMG Style) */
        .editor-area { display:none; margin-top:10px; }
        .editor-area.show { display:block; }

            background: #1a1a2e;

        .cropper-line { background-color: #a855f7; }

        /* Toolbar (Below Image) */
        .toolbar { display: flex; flex-direction: column; gap: 15px; }

        .btn-tool {

        /* Action Buttons */

        .btn-reset:hover { background: rgba(220,53,69,1); }

        .status { display: none; margin-top: 16px; padding: 12px; border-radius: 8px; text-align: center; font-weight: 600; font-size: 0.85rem; }

            .action-row { flex-direction: column; }

<body>

<header>
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
    <div class="brand"><i class="fas fa-bolt"></i> Bharat24Tools</div>
</header>

<main>
    <div class="header-title">
        <h1>✂️ Image Cropper</h1>
        <p>Crop, rotate, and flip your images quickly.</p>
    </div>

    <div class="card">
        <!-- Upload Section -->
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon"><i class="fas fa-crop-alt"></i></div>
            <h2>Select Image to Crop</h2>
            <p>JPG, PNG, WebP (max 20MB)</p>
            <div class="badge-row">
                <span class="badge">⚡ Visual Crop</span>
                <span class="badge">🔒 100% Private</span>
            </div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="status" id="status"></div>

        <!-- Editor Section -->
        <div class="editor-area" id="editorArea">
            
            <!-- Image Workspace -->
            <div class="workspace">
                <img id="imageToCrop" src="" alt="To Crop">
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <!-- Rotate & Flip -->
                <div class="tool-group">
                    <button type="button" class="btn-tool" onclick="rotateImage(90)"><i class="fas fa-undo"></i> Rotate L</button>
                    <button type="button" class="btn-tool" onclick="rotateImage(-90)"><i class="fas fa-redo"></i> Rotate R</button>
                    <button type="button" class="btn-tool" onclick="flipImage('h')"><i class="fas fa-arrows-alt-h"></i> Flip H</button>
                    <button type="button" class="btn-tool" onclick="flipImage('v')"><i class="fas fa-arrows-alt-v"></i> Flip V</button>
                </div>
                
                <!-- Aspect Ratios -->
                <div class="tool-group">
                    <button type="button" class="btn-tool active" data-ratio="NaN"><i class="fas fa-expand"></i> Free</button>
                    <button type="button" class="btn-tool" data-ratio="1"><i class="fas fa-square"></i> 1:1</button>
                    <button type="button" class="btn-tool" data-ratio="1.777"><i class="fas fa-tv"></i> 16:9</button>
                    <button type="button" class="btn-tool" data-ratio="1.333"><i class="fas fa-image"></i> 4:3</button>
                    <button type="button" class="btn-tool" data-ratio="0.562"><i class="fas fa-mobile-alt"></i> 9:16</button>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-row">
                <button type="button" class="btn-action btn-download" id="downloadBtn">
                    <i class="fas fa-check"></i> Crop & Download
                </button>
                <button type="button" class="btn-action btn-reset" id="resetBtn">
                    <i class="fas fa-times"></i> Reset
                </button>
            </div>
        </div>

    </div>
</main>

<!-- ✅ Cropper.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

<script>
    const MAX_SIZE = 20 * 1024 * 1024;
    let cropper = null;
    let activeUrls = new Set();
    let activeReader = null;

    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const editorArea = document.getElementById('editorArea');
    const imageToCrop = document.getElementById('imageToCrop');
    const status = document.getElementById('status');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const ratioBtns = document.querySelectorAll('[data-ratio]');

    function trackUrl(url) { activeUrls.add(url); return url; }
    function revokeAllUrls() { activeUrls.forEach(u => { try { URL.revokeObjectURL(u); } catch(e){} }); activeUrls.clear(); }
    function abortReader() { if (activeReader) { try { activeReader.abort(); } catch(e){} activeReader = null; } }
    
    function fullCleanup() {
        revokeAllUrls();
        abortReader();
        if (cropper) { try { cropper.destroy(); } catch(e) {} cropper = null; }
        imageToCrop.src = '';
    }
    window.addEventListener('beforeunload', fullCleanup);

    function showStatus(msg, type) {
        status.className = 'status ' + type;
        status.textContent = msg;
        if(!msg) status.className = 'status';
    }

    // Upload Triggers
    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('active'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('active'));
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('active');
        if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    // Main File Handler
    function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            showStatus('❌ Please select a valid image file.', 'error'); return;
        }
        if (file.size > MAX_SIZE) {
            showStatus('❌ File exceeds 20MB limit.', 'error'); return;
        }

        fullCleanup();
        showStatus('⏳ Loading image...', 'success');

        const reader = new FileReader();
        activeReader = reader;
        
        reader.onload = (e) => {
            activeReader = null;
            
            // Step 1: Change the image source
            imageToCrop.src = e.target.result; 
            
            // Step 2: When image is fully loaded by the browser
            imageToCrop.onload = () => {
                
                // Step 3: Hide upload zone, show editor
                uploadZone.style.display = 'none';
                editorArea.classList.add('show');
                showStatus('✅ Drag the box to crop.', 'success');

                // Step 4: Destroy old instance if any
                if (cropper) {
                    try { cropper.destroy(); } catch(err) {}
                }

                // Step 5: The Foolproof Initialization
                // Wait for browser to calculate layout (especially on Desktop)
                setTimeout(() => {
                    cropper = new Cropper(imageToCrop, {
                        viewMode: 1, // Restrict crop box to not exceed canvas
                        dragMode: 'move', // Image moves, box stays (like iloveimg)
                        aspectRatio: NaN, 
                        autoCropArea: 0.8,
                        restore: false, 
                        guides: true, 
                        center: true, 
                        highlight: false,
                        cropBoxMovable: true, 
                        cropBoxResizable: true, 
                        toggleDragModeOnDblclick: false,
                        ready: function () {
                            // Force resize one more time to ensure it fits the PC screen perfectly
                            cropper.resize();
                        }
                    });
                }, 100); // 100ms delay guarantees DOM is ready
            };
        };
        reader.readAsDataURL(file);
    }

    // Toolbar - Ratios
    ratioBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            if (!cropper) return; 
            
            ratioBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const ratio = parseFloat(btn.dataset.ratio);
            cropper.setAspectRatio(isNaN(ratio) ? NaN : ratio);
        });
    });

    // Toolbar - Rotate & Flip
    window.rotateImage = function(degree) {
        if (!cropper) return;
        cropper.rotate(degree);
    };

    window.flipImage = function(direction) {
        if (!cropper) return;
        if (direction === 'h') {
            cropper.scaleX(cropper.getData().scaleX === -1 ? 1 : -1);
        } else {
            cropper.scaleY(cropper.getData().scaleY === -1 ? 1 : -1);
        }
    };

    // Download Crop
    downloadBtn.addEventListener('click', () => {
        if (!cropper) return;
        
        const canvas = cropper.getCroppedCanvas({
            maxWidth: 4096, maxHeight: 4096, fillColor: '#fff',
            imageSmoothingEnabled: true, imageSmoothingQuality: 'high',
        });

        if (!canvas) {
            showStatus('❌ Crop failed. Try again.', 'error'); return;
        }

        canvas.toBlob((blob) => {
            const url = trackUrl(URL.createObjectURL(blob));
            const a = document.createElement('a');
            a.href = url;
            a.download = `cropped-Bharat24Tools-${Date.now()}.jpg`;
            a.click();
            showStatus('🎉 Image cropped & downloaded!', 'success');
        }, 'image/jpeg', 0.95); 
    });

    // Reset Tool
    resetBtn.addEventListener('click', () => {
        fullCleanup();
        fileInput.value = '';
        uploadZone.style.display = 'block';
        editorArea.classList.remove('show');
        showStatus('', '');
        ratioBtns.forEach(b => b.classList.remove('active'));
        ratioBtns[0].classList.add('active');
    });

</script>
</body>
</html>
