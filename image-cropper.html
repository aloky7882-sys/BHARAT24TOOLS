<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Image Cropper - Bharat24Tools</title>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Cropper.js CSS (Reliable CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css">

    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        
        body { 
            min-height: 100vh; 
            background: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
        }
        
        /* Header */
        header { 
            width: 100%; 
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        header a { color: var(--text-muted); text-decoration: none; font-weight: 500; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        header a:hover { color: var(--primary); }
        .brand { font-weight: 700; font-size: 1.2rem; color: var(--primary); display:flex; align-items:center; gap:8px; }
        
        /* Main Layout */
        main { 
            width: 100%; 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 30px 20px; 
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Upload Area */
        .upload-container {
            max-width: 800px;
            margin: 50px auto;
            width: 100%;
        }
        .upload-zone { 
            border: 2px dashed var(--primary); 
            border-radius: 16px; 
            padding: 60px 20px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.3s; 
            background: rgba(59, 130, 246, 0.05); 
        }
        .upload-zone.dragover { background: rgba(59, 130, 246, 0.2); transform: scale(1.02); }
        .upload-zone input { display: none; }
        .upload-zone i { font-size: 3.5rem; color: var(--primary); margin-bottom: 20px; }
        .upload-zone h2 { font-size: 1.8rem; margin-bottom: 10px; }
        .upload-zone p { color: var(--text-muted); font-size: 1rem; }
        .upload-btn {
            margin-top: 20px;
            background: var(--primary);
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            display: inline-block;
            transition: 0.2s;
        }
        .upload-zone:hover .upload-btn { background: var(--primary-hover); }

        /* Editor Layout (Grid for Desktop, Stack for Mobile) */
        .editor-wrapper { display: none; width: 100%; }
        .editor-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            align-items: start;
        }

        /* Image Workspace (CRITICAL: No display flex here to avoid Cropper bugs) */
        .workspace {
            background: #000;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            width: 100%;
            height: 65vh; /* Fixed height for desktop */
        }
        
        #imageToCrop {
            display: block;
            max-width: 100%;
        }

        /* Toolbar Panel */
        .tool-panel {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-section h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        /* Buttons */
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-tool {
            background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main);
            padding: 10px; border-radius: 8px; cursor: pointer; flex: 1; min-width: 60px;
            font-size: 0.9rem; font-weight: 500; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-tool:hover, .btn-tool.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        
        .btn-icon-only { flex: none; width: 45px; height: 45px; padding: 0; }

        /* Zoom Slider */
        .slider-container {
            display: flex; align-items: center; gap: 15px;
        }
        input[type=range] {
            flex: 1; -webkit-appearance: none; background: transparent; height: 6px; border-radius: 5px;
            background: var(--border); outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
            background: var(--primary); cursor: pointer; transition: 0.2s;
        }

        /* Select Dropdown */
        select {
            width: 100%; padding: 12px; border-radius: 8px; background: var(--bg-dark);
            border: 1px solid var(--border); color: white; font-family: inherit; font-size: 0.9rem;
            outline: none; cursor: pointer;
        }

        /* Action Buttons */
        .action-row { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .btn-action {
            width: 100%; padding: 15px; border-radius: 8px; border: none;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s;
        }
        .btn-download { background: var(--primary); color: #fff; }
        .btn-download:hover { background: var(--primary-hover); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        .btn-reset { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
        .btn-reset:hover { background: #ef4444; color: white; }

        /* Cropper Overrides */
        .cropper-view-box { outline: 2px solid var(--primary); outline-color: var(--primary); }
        .cropper-point { background-color: var(--primary); width: 12px; height: 12px; }
        .cropper-line { background-color: var(--primary); }

        /* Responsive */
        @media (max-width: 900px) {
            .editor-layout { grid-template-columns: 1fr; }
            .workspace { height: 50vh; }
            .tool-panel { padding: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
        <div class="brand"><i class="fas fa-bolt"></i> Bharat24Tools</div>
    </header>

    <main>
        <!-- Upload Section -->
        <div class="upload-container" id="uploadContainer">
            <div class="upload-zone" id="uploadZone">
                <i class="fas fa-cloud-upload-alt"></i>
                <h2>Drag & Drop Image Here</h2>
                <p>or click to browse from your device (Max 20MB)</p>
                <div class="upload-btn">Select Image</div>
                <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp">
            </div>
        </div>

        <!-- Editor Section -->
        <div class="editor-wrapper" id="editorWrapper">
            <div class="editor-layout">
                
                <!-- Image Area -->
                <div class="workspace">
                    <img id="imageToCrop" src="" alt="To Crop">
                </div>

                <!-- Tool Panel -->
                <div class="tool-panel">
                    
                    <!-- Aspect Ratio -->
                    <div class="panel-section">
                        <h3>Aspect Ratio</h3>
                        <div class="btn-group">
                            <button class="btn-tool active" data-ratio="NaN">Free</button>
                            <button class="btn-tool" data-ratio="1">1:1</button>
                            <button class="btn-tool" data-ratio="1.777">16:9</button>
                            <button class="btn-tool" data-ratio="1.333">4:3</button>
                            <button class="btn-tool" data-ratio="0.562">9:16</button>
                        </div>
                    </div>

                    <!-- Rotate & Flip -->
                    <div class="panel-section">
                        <h3>Transform</h3>
                        <div class="btn-group">
                            <button class="btn-tool" onclick="rotateImage(90)"><i class="fas fa-undo"></i> L</button>
                            <button class="btn-tool" onclick="rotateImage(-90)"><i class="fas fa-redo"></i> R</button>
                            <button class="btn-tool btn-icon-only" onclick="flipImage('h')" title="Flip Horizontal"><i class="fas fa-arrows-alt-h"></i></button>
                            <button class="btn-tool btn-icon-only" onclick="flipImage('v')" title="Flip Vertical"><i class="fas fa-arrows-alt-v"></i></button>
                        </div>
                    </div>

                    <!-- Zoom -->
                    <div class="panel-section">
                        <h3>Zoom</h3>
                        <div class="slider-container">
                            <i class="fas fa-search-minus" style="color:var(--text-muted);"></i>
                            <input type="range" id="zoomSlider" min="0.1" max="3" step="0.01" value="1">
                            <i class="fas fa-search-plus" style="color:var(--text-muted);"></i>
                        </div>
                    </div>

                    <!-- Download Format -->
                    <div class="panel-section">
                        <h3>Download Format</h3>
                        <select id="formatSelect">
                            <option value="image/jpeg">JPEG (Smaller Size)</option>
                            <option value="image/png">PNG (Transparent/Lossless)</option>
                            <option value="image/webp">WEBP (Best Quality)</option>
                        </select>
                    </div>

                    <!-- Actions -->
                    <div class="action-row">
                        <button class="btn-action btn-download" id="downloadBtn"><i class="fas fa-download"></i> Crop & Download</button>
                        <button class="btn-action btn-reset" id="resetBtn"><i class="fas fa-times"></i> Start Over</button>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Cropper.js Script -->
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js"></script>

    <script>
        const uploadContainer = document.getElementById('uploadContainer');
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const editorWrapper = document.getElementById('editorWrapper');
        const imageToCrop = document.getElementById('imageToCrop');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const ratioBtns = document.querySelectorAll('[data-ratio]');
        const zoomSlider = document.getElementById('zoomSlider');
        const formatSelect = document.getElementById('formatSelect');

        let cropper = null;
        const MAX_SIZE = 20 * 1024 * 1024;

        // --- 1. Upload Logic ---
        uploadZone.addEventListener('click', () => fileInput.click());
        
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        // --- 2. File Processing ---
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please select a valid image file (JPEG, PNG, WEBP).');
                return;
            }
            if (file.size > MAX_SIZE) {
                alert('File is too large. Max limit is 20MB.');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                imageToCrop.src = e.target.result;

                imageToCrop.onload = () => {
                    // Show Editor, Hide Upload
                    uploadContainer.style.display = 'none';
                    editorWrapper.style.display = 'block';

                    // Destroy old cropper
                    if (cropper) cropper.destroy();

                    // CRITICAL FIX FOR DESKTOP: 100ms delay before initializing Cropper
                    setTimeout(() => {
                        cropper = new Cropper(imageToCrop, {
                            viewMode: 1,
                            dragMode: 'move', // Move image, not crop box
                            autoCropArea: 0.8,
                            restore: false,
                            guides: false,
                            center: true,
                            highlight: false,
                            cropBoxMovable: true,
                            cropBoxResizable: true,
                            toggleDragModeOnDblclick: false,
                            ready: function () {
                                cropper.resize(); // Force recalculate for Desktop screens
                                updateZoomSlider();
                            },
                            zoom: function() {
                                updateZoomSlider();
                            }
                        });
                    }, 100); 
                };
            };
            reader.readAsDataURL(file);
        }

        // --- 3. Toolbar Logic ---
        
        // Aspect Ratios
        ratioBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (!cropper) return;
                ratioBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const ratio = parseFloat(btn.dataset.ratio);
                cropper.setAspectRatio(isNaN(ratio) ? NaN : ratio);
            });
        });

        // Rotate & Flip
        window.rotateImage = function(degree) {
            if (cropper) cropper.rotate(degree);
        };

        window.flipImage = function(direction) {
            if (!cropper) return;
            if (direction === 'h') {
                cropper.scaleX(cropper.getData().scaleX === -1 ? 1 : -1);
            } else {
                cropper.scaleY(cropper.getData().scaleY === -1 ? 1 : -1);
            }
        };

        // Zoom Slider
        zoomSlider.addEventListener('input', (e) => {
            if (cropper) cropper.zoomTo(parseFloat(e.target.value));
        });

        function updateZoomSlider() {
            if (cropper) {
                const data = cropper.getData();
                const imageData = cropper.getImageData();
                // Calculate approximate zoom ratio
                const zoomRatio = (data.width / imageData.naturalWidth).toFixed(2);
                zoomSlider.value = zoomRatio > 3 ? 3 : (zoomRatio < 0.1 ? 0.1 : zoomRatio);
            }
        }

        // --- 4. Download Logic ---
        downloadBtn.addEventListener('click', () => {
            if (!cropper) return;

            // Get format
            const format = formatSelect.value;
            const extension = format.split('/')[1];

            // Get cropped canvas
            const canvas = cropper.getCroppedCanvas({
                maxWidth: 4096,
                maxHeight: 4096,
                fillColor: format === 'image/jpeg' ? '#fff' : 'transparent', // White bg for jpeg
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            });

            // Download
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `cropped-Bharat24Tools-${Date.now()}.${extension}`;
                a.click();
                URL.revokeObjectURL(url);
            }, format, 0.95); // 0.95 quality for JPEG/WEBP
        });

        // --- 5. Reset Logic ---
        resetBtn.addEventListener('click', () => {
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            imageToCrop.src = '';
            fileInput.value = '';
            
            // Show upload, hide editor
            uploadContainer.style.display = 'block';
            editorWrapper.style.display = 'none';
            
            // Reset buttons
            ratioBtns.forEach(b => b.classList.remove('active'));
            ratioBtns[0].classList.add('active');
            zoomSlider.value = 1;
        });
    </script>
</body>
</html>
