<body>
<div class="wrapper">
    <div class="page-header">
        <h1><i class="fa-solid fa-code-compare"></i> Text Diff Checker</h1>
        <p>Compare two blocks of text and instantly see what changed.</p>
    </div>

    <div class="controls-row">
        <div class="mode-toggle">
            <button id="modeWords" class="active">Words</button>
            <button id="modeChars">Characters</button>
            <button id="modeLines">Lines</button>
        </div>
    </div>

    <div class="input-grid">
        <div class="panel">
            <h3>Original Text <span class="badge original">Before</span></h3>
            <textarea id="textA" placeholder="Paste the original text here..."></textarea>
        </div>
        <div class="panel">
            <h3>Changed Text <span class="badge changed">After</span></h3>
            <textarea id="textB" placeholder="Paste the modified text here..."></textarea>
        </div>
    </div>

    <div class="action-row">
        <button class="btn" id="compareBtn"><i class="fa-solid fa-magnifying-glass"></i> Compare Text</button>
    </div>

    <div class="result-panel" id="resultPanel">
        <h3>Differences</h3>
        <div class="stats">
            <span class="stat added" id="addedStat">+0 added</span>
            <span class="stat removed" id="removedStat">-0 removed</span>
        </div>
        <div class="diff-output" id="diffOutput"></div>
    </div>

    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
</div>

<script>
    const textA = document.getElementById("textA");
    const textB = document.getElementById("textB");
    const compareBtn = document.getElementById("compareBtn");
    const resultPanel = document.getElementById("resultPanel");
    const diffOutput = document.getElementById("diffOutput");
    const addedStat = document.getElementById("addedStat");
    const removedStat = document.getElementById("removedStat");

    const modeWordsBtn = document.getElementById("modeWords");
    const modeCharsBtn = document.getElementById("modeChars");
    const modeLinesBtn = document.getElementById("modeLines");

    let mode = "words";

    function setMode(newMode, activeBtn){
        mode = newMode;
        [modeWordsBtn, modeCharsBtn, modeLinesBtn].forEach(b => b.classList.remove("active"));
        activeBtn.classList.add("active");
    }

    modeWordsBtn.addEventListener("click", () => setMode("words", modeWordsBtn));
    modeCharsBtn.addEventListener("click", () => setMode("chars", modeCharsBtn));
    modeLinesBtn.addEventListener("click", () => setMode("lines", modeLinesBtn));

    function escapeHTML(str){
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function runDiff(){
        const a = textA.value;
        const b = textB.value;
        if(!a.trim() && !b.trim()) return;

        let parts;
        if(mode === "words"){
            parts = Diff.diffWords(a, b);
        } else if(mode === "chars"){
            parts = Diff.diffChars(a, b);
        } else {
            parts = Diff.diffLines(a, b);
        }

        let html = "";
        let addedCount = 0;
        let removedCount = 0;

        parts.forEach(part => {
            const safeValue = escapeHTML(part.value);
            if(part.added){
                html += `<ins>${safeValue}</ins>`;
                addedCount += mode === "chars" ? part.value.length : part.value.trim().split(/\s+/).filter(Boolean).length;
            } else if(part.removed){
                html += `<del>${safeValue}</del>`;
                removedCount += mode === "chars" ? part.value.length : part.value.trim().split(/\s+/).filter(Boolean).length;
            } else {
                html += safeValue;
            }
        });

        diffOutput.innerHTML = html;
        addedStat.innerText = `+${addedCount} added`;
        removedStat.innerText = `-${removedCount} removed`;
        resultPanel.style.display = "block";
    }

    compareBtn.addEventListener("click", runDiff);
</script>
</body>
