<script>
    const API_URL = 'https://bharat24tools-api.onrender.com';

    const translations = {
        en: { back: "Back", title: "💧 PDF Watermark", subtitle: "Add text watermark to PDF — opacity control", clickOrDrag: "Click or Drag", formatInfo: "PDF file — max 15MB", textLabel: "Watermark Text:", opacityLabel: "Opacity:", watermarkBtn: "Add Watermark", downloadBtn: "Download PDF", resetBtn: "Try Another PDF", infoTitle: "How it works:", infoText: "Server adds 45° rotated text watermark to every page.", loading: "Adding watermark...", success: "Watermark added successfully!", error: "Error: ", selectFile: "Please select a PDF", tooBig: "File too large (max 15MB)" },
        hi: { back: "वापस", title: "💧 PDF Watermark", subtitle: "PDF पर text watermark लगाओ", clickOrDrag: "Click करो या Drag करो", formatInfo: "PDF file — max 15MB", textLabel: "Watermark Text:", opacityLabel: "Opacity:", watermarkBtn: "Watermark लगाओ", downloadBtn: "PDF Download", resetBtn: "दूसरी PDF try करो", infoTitle: "कैसे:", infoText: "Server हर page पर 45° rotated watermark लगाता है।", loading: "Watermark लग रहा है...", success: "Watermark लग गया!", error: "एरर: ", selectFile: "कृपया PDF चुनें", tooBig: "File 15MB से बड़ी" },
        es: { back: "Atrás", title: "💧 Marca de Agua PDF", subtitle: "Añade marca de agua", clickOrDrag: "Clic o arrastra", formatInfo: "PDF — máx 15MB", textLabel: "Texto:", opacityLabel: "Opacidad:", watermarkBtn: "Añadir", downloadBtn: "Descargar PDF", resetBtn: "Otro PDF", infoTitle: "Cómo:", infoText: "Servidor añade marca de agua 45°.", loading: "Añadiendo...", success: "¡Añadida!", error: "Error: ", selectFile: "Selecciona PDF", tooBig: "Archivo grande" },
        pt: { back: "Voltar", title: "💧 Marca d'Água PDF", subtitle: "Adicione marca d'água", clickOrDrag: "Clique ou arraste", formatInfo: "PDF — máx 15MB", textLabel: "Texto:", opacityLabel: "Opacidade:", watermarkBtn: "Adicionar", downloadBtn: "Baixar PDF", resetBtn: "Outro PDF", infoTitle: "Como:", infoText: "Servidor adiciona marca 45°.", loading: "Adicionando...", success: "Adicionada!", error: "Erro: ", selectFile: "Selecione PDF", tooBig: "Arquivo grande" },
        fr: { back: "Retour", title: "💧 Filigrane PDF", subtitle: "Ajoutez un filigrane", clickOrDrag: "Cliquez ou glissez", formatInfo: "PDF — max 15MB", textLabel: "Texte:", opacityLabel: "Opacité:", watermarkBtn: "Ajouter", downloadBtn: "Télécharger PDF", resetBtn: "Autre PDF", infoTitle: "Comment:", infoText: "Serveur ajoute filigrane 45°.", loading: "Ajout...", success: "Ajouté!", error: "Erreur: ", selectFile: "Sélectionnez PDF", tooBig: "Fichier trop grand" },
        de: { back: "Zurück", title: "💧 PDF Wasserzeichen", subtitle: "Text-Wasserzeichen hinzufügen", clickOrDrag: "Klick oder ziehe", formatInfo: "PDF — max 15MB", textLabel: "Text:", opacityLabel: "Deckkraft:", watermarkBtn: "Hinzufügen", downloadBtn: "PDF herunterladen", resetBtn: "Andere PDF", infoTitle: "Wie:", infoText: "Server fügt 45° Wasserzeichen hinzu.", loading: "Hinzufügen...", success: "Hinzugefügt!", error: "Fehler: ", selectFile: "PDF wählen", tooBig: "Datei zu groß" },
        ar: { back: "رجوع", title: "💧 علامة مائية PDF", subtitle: "أضف علامة مائية نصية", clickOrDrag: "انقر أو اسحب", formatInfo: "PDF — 15MB", textLabel: "النص:", opacityLabel: "الشفافية:", watermarkBtn: "إضافة", downloadBtn: "تحميل PDF", resetBtn: "ملف آخر", infoTitle: "كيف:", infoText: "السيرفر يضيف علامة مائية بزاوية 45°.", loading: "جاري الإضافة...", success: "تم!", error: "خطأ: ", selectFile: "اختر PDF", tooBig: "الملف كبير" },
        ru: { back: "Назад", title: "💧 Водяной Знак PDF", subtitle: "Добавьте водяной знак", clickOrDrag: "Нажмите или перетащите", formatInfo: "PDF — макс 15MB", textLabel: "Текст:", opacityLabel: "Прозрачность:", watermarkBtn: "Добавить", downloadBtn: "Скачать PDF", resetBtn: "Другой PDF", infoTitle: "Как:", infoText: "Сервер добавляет водяной знак 45°.", loading: "Добавление...", success: "Добавлено!", error: "Ошибка: ", selectFile: "Выберите PDF", tooBig: "Файл слишком большой" },
        id: { back: "Kembali", title: "💧 Watermark PDF", subtitle: "Tambah watermark teks", clickOrDrag: "Klik atau seret", formatInfo: "PDF — maks 15MB", textLabel: "Teks:", opacityLabel: "Opasitas:", watermarkBtn: "Tambah", downloadBtn: "Unduh PDF", resetBtn: "PDF Lain", infoTitle: "Cara:", infoText: "Server tambah watermark 45°.", loading: "Menambah...", success: "Berhasil!", error: "Kesalahan: ", selectFile: "Pilih PDF", tooBig: "File besar" },
        "zh-CN": { back: "返回", title: "💧 PDF 水印", subtitle: "添加文本水印", clickOrDrag: "点击或拖拽", formatInfo: "PDF — 最大 15MB", textLabel: "水印文字:", opacityLabel: "透明度:", watermarkBtn: "添加水印", downloadBtn: "下载 PDF", resetBtn: "换一份", infoTitle: "原理:", infoText: "服务器在每页添加 45° 水印。", loading: "添加中...", success: "成功!", error: "错误: ", selectFile: "请选择 PDF", tooBig: "文件太大" }
    };

    let currentLang = localStorage.getItem('lang') || 'en';

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('lang', lang);
        applyTranslations();
    }
    function applyTranslations() {
        const t = translations[currentLang] || translations.en;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.textContent = t[key];
        });
        document.getElementById('languageSelect').value = currentLang;
    }
    function t(key) {
        const tr = translations[currentLang] || translations.en;
        return tr[key] || key;
    }

    // App Logic
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const controls = document.getElementById('controls');
    const watermarkText = document.getElementById('watermarkText');
    const opacityRange = document.getElementById('opacityRange');
    const opacityValue = document.getElementById('opacityValue');
    const watermarkBtn = document.getElementById('watermarkBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const status = document.getElementById('status');

    let selectedFile = null;
    let resultBlob = null;

    opacityRange.addEventListener('input', () => {
        opacityValue.textContent = opacityRange.value + '%';
    });

    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('active'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('active'));
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('active');
        if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        if (!file.name.toLowerCase().endsWith('.pdf')) {
            showStatus('❌ ' + t('selectFile'), 'error');
            return;
        }
        if (file.size > 15 * 1024 * 1024) {
            showStatus('❌ ' + t('tooBig'), 'error');
            return;
        }
        selectedFile = file;
        fileName.textContent = file.name.length > 30 ? file.name.substring(0, 30) + '...' : file.name;
        fileSize.textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
        fileInfo.style.display = 'flex';
        controls.style.display = 'block';
        watermarkBtn.style.display = 'flex';
        downloadBtn.style.display = 'none';
        resetBtn.style.display = 'none';
        status.style.display = 'none';
    }

    watermarkBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        const text = watermarkText.value.trim() || 'Bharat24Tools';
        const opacity = parseInt(opacityRange.value) / 100;

        watermarkBtn.disabled = true;
        watermarkBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('loading');
        showStatus('⏳ ' + t('loading'), 'loading');

        try {
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('text', text);
            formData.append('opacity', opacity);

            const res = await fetch(API_URL + '/pdf-watermark', {
                method: 'POST',
                body: formData
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(errText || 'Server error');
            }

            resultBlob = await res.blob();

            showStatus('🎉 ' + t('success'), 'success');
            downloadBtn.style.display = 'flex';
            resetBtn.style.display = 'flex';
            watermarkBtn.style.display = 'none';
        } catch (err) {
            console.error(err);
            showStatus('❌ ' + t('error') + err.message, 'error');
        }

        watermarkBtn.disabled = false;
        watermarkBtn.innerHTML = '<i class="fas fa-magic"></i> ' + t('watermarkBtn');
    });

    downloadBtn.addEventListener('click', () => {
        if (!resultBlob) return;
        const url = URL.createObjectURL(resultBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'watermarked-' + (selectedFile ? selectedFile.name : 'document.pdf');
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
    });

    resetBtn.addEventListener('click', () => {
        selectedFile = null;
        resultBlob = null;
        fileInput.value = '';
        fileInfo.style.display = 'none';
        controls.style.display = 'none';
        status.style.display = 'none';
    });

    function showStatus(msg, type) {
        status.textContent = msg;
        status.className = 'status ' + type;
        status.style.display = 'block';
    }

    applyTranslations();
</script>
