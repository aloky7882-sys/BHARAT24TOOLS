<div class="container">
    <h1><i class="fa-solid fa-money-bill-trend-up"></i> EMI Calculator</h1>
    <p class="subtitle">Calculate your monthly loan EMI instantly</p>

    <div class="input-group">
        <label>Loan Amount (₹)</label>
        <input type="number" id="amount" placeholder="e.g. 500000">
    </div>

    <div class="input-group">
        <label>Interest Rate (% per year)</label>
        <input type="number" id="rate" placeholder="e.g. 8.5" step="0.01">
    </div>

    <div class="input-group">
        <label>Loan Tenure (Years)</label>
        <input type="number" id="time" placeholder="e.g. 5">
    </div>

    <button onclick="calculateEMI()">
        <i class="fa-solid fa-calculator"></i> Calculate EMI
    </button>

    <div id="result"></div>

    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
</div>

<script>
    function calculateEMI(){
        const amount = parseFloat(document.getElementById("amount").value);
        const rate = parseFloat(document.getElementById("rate").value);
        const years = parseFloat(document.getElementById("time").value);
        const resultBox = document.getElementById("result");

        if(!amount || !rate || !years || amount <= 0 || rate <= 0 || years <= 0){
            resultBox.className = "show error";
            resultBox.innerHTML = "❌ Please fill all fields with valid values.";
            return;
        }

        const monthlyRate = rate / 12 / 100;
        const months = years * 12;

        const emi = (amount * monthlyRate * Math.pow(1 + monthlyRate, months)) /
                    (Math.pow(1 + monthlyRate, months) - 1);

        const totalPayment = emi * months;
        const totalInterest = totalPayment - amount;

        const formatINR = (num) => "₹" + Math.round(num).toLocaleString("en-IN");

        resultBox.className = "show";
        resultBox.innerHTML = `
            <div class="emi-main">${formatINR(emi)} / month</div>
            <div class="row">
                <span>Principal Amount</span>
                <span>${formatINR(amount)}</span>
            </div>
            <div class="row">
                <span>Total Interest</span>
                <span>${formatINR(totalInterest)}</span>
            </div>
            <div class="row">
                <span>Total Payment</span>
                <span>${formatINR(totalPayment)}</span>
            </div>
            <div class="row">
                <span>Loan Tenure</span>
                <span>${months} months (${years} years)</span>
            </div>
        `;
    }
</script>
