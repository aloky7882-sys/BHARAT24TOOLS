<body>
<div class="wrapper">
    <div class="page-header">
        <h1><i class="fa-solid fa-star"></i> Favicon Generator</h1>
        <p>Upload one image and get every favicon size you need — ready to download.</p>
    </div>

    <div class="panel">
        <div class="upload-zone" id="dropZone">
            <div class="upload-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
            <div class="upload-title">Drag & Drop your image here</div>
            <div class="upload-subtitle">Square images work best (e.g. 512x512)</div>
            <div class="upload-formats">JPG / PNG / WEBP</div>
            <input type="file" id="upload" accept="image/*">
        </div>
        <div id="status"></div>
    </div>

    <div class="panel" id="resultsPanel" style="display:none;">
        <h3 style="margin-bottom:14px;">Generated Sizes</h3>
        <div class="sizes-grid" id="sizesGrid"></div>
        <button class="btn btn-primary" id="downloadZipBtn"><i class="fa-solid fa-file-zipper"></i> Download All (ZIP)</button>
    </div>

    <div class="panel" id="codePanel" style="display:none;">
        <h3>HTML Code (paste into your &lt;head&gt;)</h3>
        <div class="code-box">
            <button class="copy-btn" id="copyCodeBtn">Copy</button>
            <span id="codeOutput"></span>
        </div>
    </div>

    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
</div>

<script>
    const upload = document.getElementById("upload");
    const dropZone = document.getElementById("dropZone");
    const status = document.getElementById("status");
    const resultsPanel = document.getElementById("resultsPanel");
    const sizesGrid = document.getElementById("sizesGrid");
    const codePanel = document.getElementById("codePanel");
    const codeOutput = document.getElementById("codeOutput");
    const downloadZipBtn = document.getElementById("downloadZipBtn");
    const copyCodeBtn = document.getElementById("copyCodeBtn");

    const sizes = [
        { size: 16, name: "favicon-16x16.png" },
        { size: 32, name: "favicon-32x32.png" },
        { size: 48, name: "favicon-48x48.png" },
        { size: 96, name: "favicon-96x96.png" },
        { size: 180, name: "apple-touch-icon.png" },
        { size: 192, name: "android-chrome-192x192.png" },
        { size: 512, name: "android-chrome-512x512.png" }
    ];

    let generatedFiles = [];

    function processFile(file){
        if(!file || !file.type.startsWith("image/")){
            status.innerText = "❌ Please select an image file.";
            status.style.color = "#dc3545";
            return;
        }

        status.innerText = "Generating favicon sizes...";
        status.style.color = "#0d6efd";

        const reader = new FileReader();

        reader.onload = function(e){
            const img = new Image();
            img.onload = function(){
                generateSizes(img);
            };
            img.onerror = function(){
                status.innerText = "❌ Could not process the image.";
                status.style.color = "#dc3545";
            };
            img.src = e.target.result;
        };

        reader.readAsDataURL(file);
    }

    function generateSizes(img){
        sizesGrid.innerHTML = "";
        generatedFiles = [];

        sizes.forEach(spec => {
            const canvas = document.createElement("canvas");
            canvas.width = spec.size;
            canvas.height = spec.size;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, spec.size, spec.size);

            const dataURL = canvas.toDataURL("image/png");
            generatedFiles.push({ name: spec.name, dataURL: dataURL });

            const card = document.createElement("div");
            card.className = "size-card";

            card.innerHTML = `
                <img src="${dataURL}" width="${Math.min(spec.size, 80)}" height="${Math.min(spec.size, 80)}" alt="${spec.name}">
                <div class="label">${spec.size}×${spec.size}</div>
                <div class="dims">${spec.name}</div>
                <button class="dl-single">Download</button>
            `;

            card.querySelector(".dl-single").addEventListener("click", function(){
                const a = document.createElement("a");
                a.href = dataURL;
                a.download = spec.name;
                a.click();
            });

            sizesGrid.appendChild(card);
        });

        resultsPanel.style.display = "block";
        codePanel.style.display = "block";

        codeOutput.innerText =
`<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">`;

        status.innerText = "✅ All sizes generated! Download individually or as ZIP.";
        status.style.color = "#198754";
    }

    upload.addEventListener("change", function(){
        processFile(this.files[0]);
    });

    dropZone.addEventListener("dragover", function(e){
        e.preventDefault();
        dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", function(){
        dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", function(e){
        e.preventDefault();
        dropZone.classList.remove("dragover");
        processFile(e.dataTransfer.files[0]);
    });

    downloadZipBtn.addEventListener("click", async function(){
        if(generatedFiles.length === 0) return;

        if(typeof JSZip === "undefined"){
            status.innerText = "❌ ZIP engine failed to load. Try downloading sizes individually.";
            status.style.color = "#dc3545";
            return;
        }

        status.innerText = "Preparing ZIP file...";
        status.style.color = "#0d6efd";

        const zip = new JSZip();

        generatedFiles.forEach(file => {
            const base64Data = file.dataURL.split(",")[1];
            zip.file(file.name, base64Data, { base64: true });
        });

        zip.file("favicon-code.html", codeOutput.innerText);

        const blob = await zip.generateAsync({ type: "blob" });

        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "favicons.zip";
        a.click();

        status.innerText = "🎉 ZIP downloaded!";
        status.style.color = "#198754";
    });

    copyCodeBtn.addEventListener("click", function(){
        navigator.clipboard.writeText(codeOutput.innerText).then(() => {
            copyCodeBtn.innerText = "Copied!";
            setTimeout(() => { copyCodeBtn.innerText = "Copy"; }, 1500);
        });
    });
</script>
