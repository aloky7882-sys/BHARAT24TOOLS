<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel to PDF - Bharat24Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body { background:linear-gradient(135deg, #0f0f1e 0%, #16213e 50%, #533483 100%); display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
.container { background:rgba(30,27,75,0.95); padding:40px; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.4); max-width:700px; width:100%; text-align:center; border:1px solid rgba(168,85,247,0.3); color:#e0e7ff; }
h1 { color:#a855f7; margin-bottom:10px; font-weight:800; }
.subtitle { font-size:14px; color:#a5b4fc; margin-bottom:25px; }
.upload-zone { position:relative; border:3px dashed rgba(168,85,247,0.6); padding:40px 20px; border-radius:12px; background:rgba(99,102,241,0.05); cursor:pointer; margin:20px 0; transition:all .3s ease; overflow:hidden; }
.upload-zone:hover, .upload-zone.dragover { background:rgba(168,85,247,0.15); border-color:#a855f7; transform:translateY(-2px); }
.upload-zone input { position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }
.upload-icon { width:76px; height:76px; margin:0 auto 14px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(168,85,247,0.2); color:#a855f7; font-size:34px; }
.upload-title { font-size:18px; font-weight:700; margin-bottom:6px; }
.upload-subtitle { font-size:14px; color:#a5b4fc; margin-bottom:10px; }
.upload-formats { display:inline-block; padding:5px 10px; border-radius:20px; background:rgba(168,85,247,0.15); color:#a855f7; font-size:12px; font-weight:600; }
#file-name { margin-top:12px; font-weight:600; color:#86efac; font-size:14px; display:none; }
button { width:100%; padding:14px; background:linear-gradient(135deg, #a855f7, #ec4899); color:#fff; border:none; border-radius:8px; font-size:16px; font-weight:700; cursor:pointer; margin-top:15px; font-family:inherit; }
button:disabled { opacity:0.6; cursor:not-allowed; }
#status { margin-top:15px; font-size:14px; font-weight:600; padding:12px; border-radius:8px; display:none; }
#status.success { background:rgba(34,197,94,0.2); color:#86efac; display:block; }
#status.error { background:rgba(239,68,68,0.2); color:#fca5a5; display:block; }
#status.info { background:rgba(99,102,241,0.2); color:#a5b4fc; display:block; }
</style>
</head>
<body>
<div class="container">
    <h1>📊 Excel to PDF</h1>
    <p class="subtitle">Convert Excel spreadsheets to clean PDFs</p>
    <div class="upload-zone" id="drop-zone">
        <div class="upload-icon">📤</div>
        <div class="upload-title">Drag & Drop Excel here</div>
        <div class="upload-subtitle">or click to choose</div>
        <div class="upload-formats">XLS / XLSX</div>
        <input type="file" id="excel-file" accept=".xlsx,.xls" />
    </div>
    <div id="file-name"></div>
    <button id="convert-btn">Convert & Download PDF</button>
    <div id="status"></div>
</div>

<script>
let outputFileName = "converted-document.pdf";
let selectedFile = null;
let excelData = null;

const fileInput = document.getElementById("excel-file");
const fileNameBox = document.getElementById("file-name");
const convertBtn = document.getElementById("convert-btn");
const statusBox = document.getElementById("status");
const dropZone = document.getElementById("drop-zone");

function showStatus(message, type) {
    statusBox.className = type;
    statusBox.innerHTML = message;
    statusBox.style.display = "block";
}

function processExcelFile(file) {
    if (!file) return;
    const name = file.name.toLowerCase();
    if (!name.endsWith(".xlsx") && !name.endsWith(".xls")) {
        showStatus("❌ Please select a valid Excel file.", "error");
        return;
    }
    selectedFile = file;
    outputFileName = file.name.replace(/\.[^/.]+$/, "") + ".pdf";
    fileNameBox.innerHTML = '✅ ' + file.name;
    fileNameBox.style.display = "block";
    showStatus("📂 Reading Excel file...", "info");

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: "array" });
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            excelData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

            if (!excelData || excelData.length === 0) {
                showStatus("❌ Excel file appears empty.", "error");
                return;
            }
            showStatus("✅ Excel loaded! Click Convert.", "success");
        } catch(err) {
            showStatus("❌ Could not read Excel: " + err.message, "error");
        }
    };
    reader.readAsArrayBuffer(file);
}

function convertToPDF() {
    if (!excelData || excelData.length === 0 || !selectedFile) {
        showStatus("❌ No Excel file selected.", "error");
        return;
    }
    showStatus("⏳ Converting to PDF...", "info");
    convertBtn.disabled = true;

    try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const margin = 10;
        const columnCount = excelData[0].length;
        const usableWidth = pageWidth - (margin * 2);
        const columnWidth = usableWidth / columnCount;
        let y = margin;
        const rowHeight = 10;

        // Header
        doc.setFont("helvetica", "bold");
        doc.setFillColor(168, 85, 247);
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(10);
        for (let c = 0; c < columnCount; c++) {
            const x = margin + (c * columnWidth);
            const text = (excelData[0][c] || "").toString().substring(0, 20);
            doc.rect(x, y, columnWidth, rowHeight, "F");
            doc.text(text, x + 2, y + 7);
        }
        y += rowHeight;

        doc.setFont("helvetica", "normal");
        doc.setTextColor(51, 51, 51);
        doc.setFontSize(9);

        for (let r = 1; r < excelData.length; r++) {
            if (y + rowHeight > pageHeight - margin) {
                doc.addPage();
                y = margin;
                doc.setFont("helvetica", "bold");
                doc.setFillColor(168, 85, 247);
                doc.setTextColor(255, 255, 255);
                for (let c = 0; c < columnCount; c++) {
                    const x = margin + (c * columnWidth);
                    const text = (excelData[0][c] || "").toString().substring(0, 20);
                    doc.rect(x, y, columnWidth, rowHeight, "F");
                    doc.text(text, x + 2, y + 7);
                }
                y += rowHeight;
                doc.setFont("helvetica", "normal");
                doc.setTextColor(51, 51, 51);
            }

            if (r % 2 === 0) doc.setFillColor(248, 249, 250);
            else doc.setFillColor(255, 255, 255);

            const rowData = excelData[r];
            for (let c = 0; c < columnCount; c++) {
                const x = margin + (c * columnWidth);
                const text = (rowData[c] !== undefined && rowData[c] !== null) ? rowData[c].toString().substring(0, 20) : "";
                doc.rect(x, y, columnWidth, rowHeight, "F");
                doc.setDrawColor(222, 226, 230);
                doc.rect(x, y, columnWidth, rowHeight);
                doc.text(text, x + 2, y + 7);
            }
            y += rowHeight;
        }

        doc.save(outputFileName);
        showStatus("🎉 PDF downloaded successfully!", "success");
    } catch(err) {
        showStatus("❌ PDF conversion failed: " + err.message, "error");
    }
    convertBtn.disabled = false;
}

fileInput.addEventListener("change", function() { processExcelFile(this.files[0]); });
dropZone.addEventListener("dragover", function(e) { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", function() { dropZone.classList.remove("dragover"); });
dropZone.addEventListener("drop", function(e) { e.preventDefault(); dropZone.classList.remove("dragover"); processExcelFile(e.dataTransfer.files[0]); });
convertBtn.addEventListener("click", convertToPDF);
</script>
</body>
</html>
