        <h1>🎙️ Voice to Text</h1>
        <p class="subtitle">Bolo, aur text apne aap ban jaayega. Free, instant.</p>

        <div class="card">
            <p class="unsupported" id="unsupported-msg">Ye tool sirf Chrome browser me sahi se kaam karta hai. Kripya Chrome me kholein.</p>

            <label for="lang-select">Language</label>
            <select id="lang-select">
                <option value="hi-IN">Hindi</option>
                <option value="en-IN" selected>English (India)</option>
                <option value="en-US">English (US)</option>
            </select>

            <div class="mic-area">
                <button type="button" id="mic-btn">🎤</button>
                <p id="mic-status">Bolne ke liye mic button dabao</p>
            </div>

            <label for="result-text">Text</label>
            <textarea id="result-text" placeholder="Aapka bola hua text yahan aayega..."></textarea>

            <div class="actions">
                <button type="button" id="copy-btn">Copy Text</button>
                <button type="button" id="clear-btn">Clear</button>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Bharat24Tools. All rights reserved.
    </footer>

    <script>
        (function () {
            var micBtn = document.getElementById('mic-btn');
            var micStatus = document.getElementById('mic-status');
            var resultText = document.getElementById('result-text');
            var langSelect = document.getElementById('lang-select');
            var copyBtn = document.getElementById('copy-btn');
            var clearBtn = document.getElementById('clear-btn');
            var unsupportedMsg = document.getElementById('unsupported-msg');

            var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                unsupportedMsg.style.display = 'block';
                micBtn.disabled = true;
                micBtn.style.opacity = '0.5';
                micStatus.textContent = 'Speech recognition supported nahi hai.';
                return;
            }

            var recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = langSelect.value;

            var isListening = false;
            var finalTranscript = resultText.value;

            langSelect.addEventListener('change', function () {
                recognition.lang = langSelect.value;
            });

            micBtn.addEventListener('click', function () {
                if (isListening) {
                    recognition.stop();
                } else {
                    finalTranscript = resultText.value ? resultText.value + ' ' : '';
                    recognition.lang = langSelect.value;
                    try {
                        recognition.start();
                    } catch (e) {}
                }
            });

            recognition.onstart = function () {
                isListening = true;
                micBtn.classList.add('listening');
                micStatus.textContent = 'Sun raha hoon... bolte rahiye';
            };

            recognition.onend = function () {
                isListening = false;
                micBtn.classList.remove('listening');
                micStatus.textContent = 'Bolne ke liye mic button dabao';
            };

            recognition.onerror = function (event) {
                isListening = false;
                micBtn.classList.remove('listening');
                if (event.error === 'not-allowed') {
                    micStatus.textContent = 'Mic ki permission do browser me.';
                } else {
                    micStatus.textContent = 'Kuch galat hua, dobara try karo.';
                }
            };

            recognition.onresult = function (event) {
                var interim = '';
                for (var i = event.resultIndex; i < event.results.length; i++) {
                    var transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interim += transcript;
                    }
                }
                resultText.value = finalTranscript + interim;
            };

            copyBtn.addEventListener('click', function () {
                resultText.select();
                resultText.setSelectionRange(0, 999999);
                navigator.clipboard.writeText(resultText.value).then(function () {
                    copyBtn.textContent = 'Copied!';
                    setTimeout(function () { copyBtn.textContent = 'Copy Text'; }, 1500);
                });
            });

            clearBtn.addEventListener('click', function () {
                resultText.value = '';
                finalTranscript = '';
            });
        })();
    </script>
