    ru: { title: "🖼️ PDF в JPG", subtitle: "Конвертируйте все страницы PDF в качественные JPG", clickDrag: "Нажмите или перетащите", maxSize: "PDF файл (макс. 15MB)", fast: "⚡ Быстро", private: "🔒 Приватно", zipOutput: "📦 ZIP архив", qualityLabel: "🎨 Качество:", qualityMed: "Среднее (150 DPI)", qualityHigh: "Высокое (200 DPI) — Рекомендуется", qualityUltra: "Ультра (300 DPI)", convertBtn: "🖼️ Конвертировать в JPG", howItWorks: "💡 Как это работает:", infoText: "Ваш PDF безопасно обрабатывается на нашем сервере. Каждая страница конвертируется в JPG и скачивается как ZIP.", errPdf: "❌ Пожалуйста, выберите PDF.", errSize: "❌ Файл больше 15MB.", ready: "✅ Файл готов:", waking: "⏳ Сервер просыпается...", uploading: "⏳ Загрузка PDF...", converting: "⏳ Конвертация страниц...", success: "🎉 Успешно конвертировано!", errNetwork: "Сервер просыпается. Подождите 1 минуту." },

let currentLang = 'en';
let selectedFile = null;

// DOM Elements
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const controls = document.getElementById('controls');
const convertBtn = document.getElementById('convertBtn');
const fileNameEl = document.getElementById('fileName');
const fileSizeEl = document.getElementById('fileSize');
const qualitySelect = document.getElementById('qualitySelect');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const status = document.getElementById('status');
const langSelect = document.getElementById('langSelect');

// 🌍 Language Engine
function changeLanguage(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    if (lang === 'ar') { document.documentElement.dir = 'rtl'; } else { document.documentElement.dir = 'ltr'; }
    
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang] && i18n[lang][key]) { el.innerHTML = i18n[lang][key]; }
    });
    localStorage.setItem('b24_lang', lang);
}

langSelect.addEventListener('change', (e) => changeLanguage(e.target.value));
window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('b24_lang') || 'en';
    langSelect.value = saved;
    changeLanguage(saved);
});

// 📂 File Handling
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('active'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('active'));
uploadZone.addEventListener('drop', (e) => {
    e.preventDefault(); uploadZone.classList.remove('active');
    if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) handleFile(e.target.files[0]);
});

function handleFile(file) {
    if (!file.name.toLowerCase().endsWith('.pdf')) {
        showStatus(i18n[currentLang].errPdf, 'error'); return;
    }
    if (file.size > 15 * 1024 * 1024) {
        showStatus(i18n[currentLang].errSize, 'error'); return;
    }
    selectedFile = file;
    fileNameEl.textContent = file.name.length > 30 ? file.name.substring(0, 30) + '...' : file.name;
    fileSizeEl.textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
    controls.style.display = 'block';
    showStatus(`${i18n[currentLang].ready} ${(file.size / 1024 / 1024).toFixed(2)} MB`, 'success');
}

// 🚀 Convert Logic (With Server Wakeup Ping)
convertBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    convertBtn.disabled = true;
    progressBar.style.display = 'block';
    progressFill.style.width = '10%';
    showStatus(`<span class="spinner"></span> ${i18n[currentLang].waking}`, 'loading');

    try {
        // 🟢 STEP 1: WAKE UP SERVER
        let serverAwake = false;
        for(let i=0; i<3; i++) {
            try {
                const ping = await fetch(API_URL + '/health', { method: 'GET' });
                if (ping.ok) { serverAwake = true; break; }
            } catch (e) {
                // Ignore error, wait and retry
            }
            await new Promise(r => setTimeout(r, 3000)); // wait 3s before retry
        }

        if (!serverAwake) {
            throw new Error(i18n[currentLang].errNetwork);
        }

        // 🟢 STEP 2: UPLOAD FILE
        progressFill.style.width = '40%';
        showStatus(`<span class="spinner"></span> ${i18n[currentLang].uploading}`, 'loading');

        const formData = new FormData();
        formData.append('file', selectedFile);

        // Ab request bhejo (Timeout 2 minute)
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 120000);

        const res = await fetch(API_URL + '/pdf-to-jpg', {
            method: 'POST',
            body: formData,
            signal: controller.signal
        });
        clearTimeout(timeoutId);

        progressFill.style.width = '80%';
        showStatus(`<span class="spinner"></span> ${i18n[currentLang].converting}`, 'loading');

        if (!res.ok) {
            const errText = await res.text();
            throw new Error(errText || 'Server error ' + res.status);
        }

        const blob = await res.blob();
        progressFill.style.width = '100%';

        // File download trigger
        const contentType = res.headers.get('Content-Type') || '';
        let downloadName = 'pages.zip';
        if (contentType.includes('image/jpeg')) downloadName = 'page.jpg';
        else if (contentType.includes('zip')) downloadName = selectedFile.name.replace(/\.pdf$/i, '') + '-pages.zip';

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = downloadName;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);

        showStatus(`🎉 ${i18n[currentLang].success} (${downloadName})`, 'success');

    } catch (err) {
        console.error(err);
        const msg = err.name === 'AbortError' ? 'Timeout: Server took too long.' : err.message;
        showStatus('❌ Error: ' + msg, 'error');
    } finally {
        convertBtn.disabled = false;
        setTimeout(() => { progressBar.style.display = 'none'; progressFill.style.width = '0%'; }, 4000);
    }
});

function showStatus(msg, type) {
    status.innerHTML = msg;
    status.className = 'status ' + type;
}
</script>
</body>
</html>
