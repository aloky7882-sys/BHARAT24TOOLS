            zh: { title: "🖼️ PDF转JPG", subtitle: "转换为高质量JPG — 100%私密", clickDrag: "点击或拖拽", maxSize: "PDF文件（最大15MB）", fast: "⚡ 快速", private: "🔒 100% 私密", zipOutput: "📦 ZIP输出", qualityLabel: "🎨 图像质量:", qualityMed: "中 (150 DPI)", qualityHigh: "高 (200 DPI) — 推荐", qualityUltra: "超高 (300 DPI)", convertBtn: "🖼️ 转换为JPG", howItWorks: "💡 工作原理:", infoText: "您的PDF在浏览器内100%处理。没有任何文件上传到服务器。它快速且完全私密。", errPdf: "❌ 请选择一个PDF文件。", errSize: "❌ 文件大于15MB。", ready: "✅ 文件已就绪:", converting: "⏳ 正在处理页面...", success: "🎉 转换成功！", noFile: "❌ 未选择文件。" },

        let currentLang = 'en';
        let selectedFile = null;
        let pdfDoc = null;

        // DOM Elements
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const controls = document.getElementById('controls');
        const convertBtn = document.getElementById('convertBtn');
        const fileNameEl = document.getElementById('fileName');
        const fileSizeEl = document.getElementById('fileSize');
        const qualitySelect = document.getElementById('qualitySelect');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const status = document.getElementById('status');
        const langSelect = document.getElementById('langSelect');

        // 🌍 Language Engine
        function changeLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            if (lang === 'ar') { document.documentElement.dir = 'rtl'; } else { document.documentElement.dir = 'ltr'; }
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) { el.innerHTML = i18n[lang][key]; }
            });
            localStorage.setItem('b24_lang', lang);
        }

        langSelect.addEventListener('change', (e) => changeLanguage(e.target.value));
        
        const savedLang = localStorage.getItem('b24_lang') || 'en';
        langSelect.value = savedLang;
        changeLanguage(savedLang);

        // 📂 File Handling (Drag & Drop)
        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('active'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('active'));
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault(); 
            uploadZone.classList.remove('active');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.name.toLowerCase().endsWith('.pdf')) {
                showStatus(i18n[currentLang].errPdf, 'error'); return;
            }
            if (file.size > 15 * 1024 * 1024) {
                showStatus(i18n[currentLang].errSize, 'error'); return;
            }
            selectedFile = file;
            fileNameEl.textContent = file.name.length > 30 ? file.name.substring(0, 30) + '...' : file.name;
            fileSizeEl.textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
            controls.style.display = 'block';
            showStatus(`${i18n[currentLang].ready} ${(file.size / 1024 / 1024).toFixed(2)} MB`, 'success');
        }

        // 🚀 Convert Logic (100% Client-Side)
        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return showStatus(i18n[currentLang].noFile, 'error');

            convertBtn.disabled = true;
            progressBar.style.display = 'block';
            progressFill.style.width = '5%';
            showStatus(`<span class="spinner"></span> ${i18n[currentLang].converting}`, 'loading');

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                
                // Load PDF
                pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const totalPages = pdfDoc.numPages;
                const scale = parseFloat(qualitySelect.value);
                const zip = new JSZip();
                let hasMultiplePages = totalPages > 1;

                for (let i = 1; i <= totalPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: scale });
                    
                    // Create canvas
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    // Render page
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                    // Convert to Blob
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92));
                    
                    if (hasMultiplePages) {
                        zip.file(`page-${i}.jpg`, blob);
                    } else {
                        // Single page download
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = selectedFile.name.replace(/\.pdf$/i, '') + '.jpg';
                        a.click();
                        setTimeout(() => URL.revokeObjectURL(url), 5000);
                    }

                    // Update Progress
                    const percent = Math.floor((i / totalPages) * 90) + 5;
                    progressFill.style.width = percent + '%';
                    
                    // UI breathe
                    await new Promise(r => setTimeout(r, 50));
                }

                // ZIP download for multiple pages
                if (hasMultiplePages) {
                    progressFill.style.width = '95%';
                    const zipBlob = await zip.generateAsync({ type: 'blob' });
                    const url = URL.createObjectURL(zipBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = selectedFile.name.replace(/\.pdf$/i, '') + '-pages.zip';
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                }

                progressFill.style.width = '100%';
                showStatus(`🎉 ${i18n[currentLang].success}`, 'success');

            } catch (err) {
                console.error(err);
                showStatus('❌ Error: ' + err.message, 'error');
            } finally {
                convertBtn.disabled = false;
                setTimeout(() => { progressBar.style.display = 'none'; progressFill.style.width = '0%'; }, 4000);
            }
        });

        function showStatus(msg, type) {
            status.innerHTML = msg;
            status.className = 'status ' + type;
        }
    });
</script>
</body>
</html>
