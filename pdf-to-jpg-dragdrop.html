<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF to JPG - Bharat24Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body { min-height:100vh; background: linear-gradient(135deg, #0f0f1e 0%, #16213e 50%, #533483 100%); display:flex; align-items:center; justify-content:center; padding:20px; }
.container { background:rgba(30,27,75,0.95); padding:40px; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.4); max-width:800px; width:100%; text-align:center; border:1px solid rgba(168,85,247,0.3); color:#e0e7ff; }
h1 { margin-bottom:10px; color:#a855f7; font-size:2rem; font-weight:800; }
.subtitle { font-size:14px; color:#a5b4fc; margin-bottom:25px; }
.upload-zone { position:relative; border:3px dashed rgba(168,85,247,0.6); border-radius:12px; padding:40px 20px; margin:20px 0; background:rgba(99,102,241,0.05); cursor:pointer; transition:all .3s ease; overflow:hidden; }
.upload-zone:hover, .upload-zone.dragover { background:rgba(168,85,247,0.15); border-color:#a855f7; transform:translateY(-2px); }
.upload-zone input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; margin:0; }
.upload-icon { width:76px; height:76px; margin:0 auto 14px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(168,85,247,0.2); color:#a855f7; font-size:34px; }
.upload-title { font-size:18px; font-weight:700; margin-bottom:6px; }
.upload-subtitle { font-size:14px; color:#a5b4fc; }
#file-name { margin-top:12px; font-weight:600; color:#86efac; font-size:14px; display:none; }
#status { margin-top:15px; font-size:14px; font-weight:600; padding:12px; border-radius:8px; display:none; }
#status.success { background:rgba(34,197,94,0.2); color:#86efac; display:block; }
#status.error { background:rgba(239,68,68,0.2); color:#fca5a5; display:block; }
#status.info { background:rgba(99,102,241,0.2); color:#a5b4fc; display:block; }
#canvasContainer { margin-top:25px; display:none; }
canvas { max-width:100%; border-radius:8px; background:#fff; }
#pageControls { display:none; text-align:center; margin:20px 0; }
#pageControls button { background:linear-gradient(135deg,#a855f7,#ec4899); color:white; border:none; padding:10px 18px; border-radius:8px; margin:0 5px; cursor:pointer; font-weight:600; font-size:13px; font-family:inherit; }
#pageControls button:disabled { opacity:0.5; cursor:not-allowed; }
#downloadControls { display:none; margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; }
button.download-btn { flex:1; min-width:150px; padding:14px; background:linear-gradient(135deg,#a855f7,#ec4899); color:#fff; border:none; border-radius:10px; cursor:pointer; font-size:14px; font-weight:700; font-family:inherit; transition:all .3s ease; }
button.download-btn:hover { transform:translateY(-2px); box-shadow:0 10px 20px rgba(168,85,247,0.4); }
.page-info { color:#a5b4fc; font-size:13px; }
</style>
</head>
<body>
<div class="container">
<h1>📄 PDF to JPG</h1>
<p class="subtitle">Convert all PDF pages to high-quality JPG images</p>
<div class="upload-zone" id="dropZone">
<div class="upload-icon">📤</div>
<div class="upload-title">Drag & Drop PDF here</div>
<div class="upload-subtitle">or click to choose</div>
<input type="file" id="upload" accept=".pdf,application/pdf">
</div>
<div id="file-name"></div>
<div id="status"></div>
<div id="canvasContainer"><canvas id="canvas"></canvas></div>
<div id="pageControls">
<button id="prevBtn">← Previous</button>
<span class="page-info" id="pageInfo"></span>
<button id="nextBtn">Next →</button>
</div>
<div id="downloadControls">
<button class="download-btn" id="downloadSingle">⬇ Download This Page</button>
<button class="download-btn" id="downloadAll" style="background:linear-gradient(135deg,#198754,#22c55e);">⬇ Download All as ZIP</button>
</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const upload = document.getElementById("upload");
const dropZone = document.getElementById("dropZone");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const fileNameBox = document.getElementById("file-name");
const statusEl = document.getElementById("status");
const canvasContainer = document.getElementById("canvasContainer");
const pageControls = document.getElementById("pageControls");
const downloadControls = document.getElementById("downloadControls");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const pageInfo = document.getElementById("pageInfo");

let selectedFile = null;
let pdfDoc = null;
let currentPage = 1;

function showStatus(message, type) {
    statusEl.className = type;
    statusEl.innerHTML = message;
}

async function renderPage(pageNum) {
    try {
        const page = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: 2 });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        pageInfo.textContent = `Page ${pageNum} of ${pdfDoc.numPages}`;
        prevBtn.disabled = pageNum === 1;
        nextBtn.disabled = pageNum === pdfDoc.numPages;
    } catch(err) {
        showStatus("❌ Failed to render page", "error");
    }
}

async function processPDF(file) {
    if(!file) return;
    if(file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
        showStatus("❌ Please select a PDF file.", "error");
        return;
    }
    selectedFile = file;
    fileNameBox.innerHTML = '✅ ' + file.name;
    fileNameBox.style.display = "block";
    showStatus("📂 Loading PDF...", "info");
    canvasContainer.style.display = "none";
    pageControls.style.display = "none";
    downloadControls.style.display = "none";

    try {
        const arrayBuffer = await file.arrayBuffer();
        pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        currentPage = 1;
        await renderPage(currentPage);
        canvasContainer.style.display = "block";
        pageControls.style.display = "block";
        downloadControls.style.display = "flex";
        showStatus(`✅ PDF loaded! ${pdfDoc.numPages} page(s) ready.`, "success");
    } catch(err) {
        showStatus("❌ Cannot read this PDF. Try another.", "error");
    }
}

upload.addEventListener("change", () => processPDF(upload.files[0]));
dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", (e) => { e.preventDefault(); dropZone.classList.remove("dragover"); processPDF(e.dataTransfer.files[0]); });
prevBtn.addEventListener("click", async () => { if (currentPage > 1) { currentPage--; await renderPage(currentPage); } });
nextBtn.addEventListener("click", async () => { if (currentPage < pdfDoc.numPages) { currentPage++; await renderPage(currentPage); } });

document.getElementById("downloadSingle").addEventListener("click", () => {
    const link = document.createElement("a");
    link.href = canvas.toDataURL("image/jpeg", 0.95);
    link.download = selectedFile.name.replace(/\.pdf$/i, "") + `-page-${currentPage}.jpg`;
    link.click();
});

document.getElementById("downloadAll").addEventListener("click", async () => {
    document.getElementById("downloadAll").disabled = true;
    showStatus("⏳ Generating images...", "info");
    try {
        const zip = new JSZip();
        for (let i = 1; i <= pdfDoc.numPages; i++) {
            await renderPage(i);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.95);
            const base64 = dataUrl.split(',')[1];
            zip.file(selectedFile.name.replace(/\.pdf$/i, "") + `-page-${i}.jpg`, base64, { base64: true });
        }
        const zipBlob = await zip.generateAsync({ type: 'blob' });
        saveAs(zipBlob, selectedFile.name.replace(/\.pdf$/i, "") + '-images.zip');
        await renderPage(currentPage);
        showStatus("🎉 All pages downloaded as ZIP!", "success");
    } catch(err) {
        showStatus("❌ Download failed: " + err.message, "error");
    }
    document.getElementById("downloadAll").disabled = false;
});
</script>
</body>
</html>
