        <h1>🔊 Text to Voice</h1>
        <p class="subtitle">Text likho, AI usko bol ke sunayega. Free, instant.</p>

        <div class="card">
            <p class="unsupported" id="unsupported-msg">Ye tool aapke browser me support nahi hai. Kripya Chrome me kholein.</p>

            <label for="text-input">Text</label>
            <textarea id="text-input" placeholder="Yahan apna text likho jo bolna chahte ho...">Bharat Tools me aapka swagat hai.</textarea>

            <label for="voice-select">Voice / Language</label>
            <select id="voice-select"></select>

            <div class="slider-row">
                <label>Speed</label>
                <input type="range" id="rate-slider" min="0.5" max="2" step="0.1" value="1">
                <span class="val" id="rate-val">1.0x</span>
            </div>

            <div class="slider-row">
                <label>Pitch</label>
                <input type="range" id="pitch-slider" min="0" max="2" step="0.1" value="1">
                <span class="val" id="pitch-val">1.0</span>
            </div>

            <div class="actions">
                <button type="button" id="play-btn">▶ Bolo</button>
                <button type="button" id="stop-btn">■ Roko</button>
            </div>
        </div>
    </main>

    <footer>

    <script>
        (function () {
            var textInput = document.getElementById('text-input');
            var voiceSelect = document.getElementById('voice-select');
            var rateSlider = document.getElementById('rate-slider');
            var rateVal = document.getElementById('rate-val');
            var pitchSlider = document.getElementById('pitch-slider');
            var pitchVal = document.getElementById('pitch-val');
            var playBtn = document.getElementById('play-btn');
            var stopBtn = document.getElementById('stop-btn');
            var unsupportedMsg = document.getElementById('unsupported-msg');

            if (!('speechSynthesis' in window)) {
                unsupportedMsg.style.display = 'block';
                playBtn.disabled = true;
                return;
            }

            var synth = window.speechSynthesis;
            var voices = [];

            function loadVoices() {
                voices = synth.getVoices();
                voiceSelect.innerHTML = '';
                voices.forEach(function (voice, i) {
                    var opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = voice.name + ' (' + voice.lang + ')';
                    voiceSelect.appendChild(opt);
                });
                var hindiIndex = voices.findIndex(function (v) { return v.lang === 'hi-IN'; });
                if (hindiIndex >= 0) voiceSelect.value = hindiIndex;
            }

            loadVoices();
            if (synth.onvoiceschanged !== undefined) {
                synth.onvoiceschanged = loadVoices;
            }

            rateSlider.addEventListener('input', function () {
                rateVal.textContent = parseFloat(rateSlider.value).toFixed(1) + 'x';
            });
            pitchSlider.addEventListener('input', function () {
                pitchVal.textContent = parseFloat(pitchSlider.value).toFixed(1);
            });

            playBtn.addEventListener('click', function () {
                if (!textInput.value.trim()) return;
                synth.cancel();
                var utterance = new SpeechSynthesisUtterance(textInput.value);
                var selectedVoice = voices[voiceSelect.value];
                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                    utterance.lang = selectedVoice.lang;
                }
                utterance.rate = parseFloat(rateSlider.value);
                utterance.pitch = parseFloat(pitchSlider.value);
                synth.speak(utterance);
            });

            stopBtn.addEventListener('click', function () {
                synth.cancel();
            });
        })();
    </script>
