<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word to Image - BHARAT TOOLS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f4f7fb 0%, #e8f1f9 100%);
            min-height: 100vh;
        }
        
        header {
            background: linear-gradient(135deg, #2f6fed, #1a4fd6);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header a { color: #fff; text-decoration: none; }
        header .brand { color: #fff; font-weight: 700; }
        
        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        
        h1 { font-size: 1.8rem; text-align: center; margin-bottom: 8px; color: #1a2b45; }
        .subtitle { text-align: center; color: #5c6b82; margin-bottom: 24px; }
        
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 6px 24px rgba(26, 43, 69, 0.07);
            margin-bottom: 20px;
        }
        
        .upload-zone {
            border: 2px dashed #c3cfe4;
            border-radius: 14px;
            padding: 50px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #2f6fed;
            background: #eef4ff;
        }
        
        .upload-zone .icon { font-size: 2.5rem; margin-bottom: 12px; color: #2f6fed; }
        input[type="file"] { display: none; }
        
        .preview {
            display: none;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #c3cfe4;
            border-radius: 8px;
            padding: 16px;
            background: #f8f9fa;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }
        
        .controls {
            display: none;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a2b45;
        }
        
        .control-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #c3cfe4;
            border-radius: 8px;
            font-family: inherit;
        }
        
        button {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .convert-btn {
            background: linear-gradient(135deg, #2f6fed, #1a4fd6);
            color: #fff;
            width: 100%;
            margin-top: 15px;
        }
        
        .convert-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(47, 111, 237, 0.3);
        }
        
        #status {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }
        
        #status.loading { background: #eef4ff; color: #1a4fd6; display: block; }
        #status.success { background: #d4edda; color: #155724; display: block; }
        #status.error { background: #f8d7da; color: #721c24; display: block; }
    </style>
</head>

<body>

    <header>
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
        <span class="brand"><i class="fas fa-image"></i> BHARAT TOOLS</span>
    </header>

    <main>
        <h1>📄 Word to Image</h1>
        <p class="subtitle">Word document को screenshot में convert करो - PNG/JPG format में!</p>

        <div class="card">
            <div class="upload-zone" id="upload-zone">
                <span class="icon">📁</span>
                <p><strong>Click या drag करो</strong> Word file यहाँ (.docx)</p>
            </div>
            <input type="file" id="file-input" accept=".docx">
            
            <div class="preview" id="preview"></div>
            
            <div class="controls" id="controls">
                <div class="control-group">
                    <label>Image Format</label>
                    <select id="format">
                        <option value="png">PNG (Best Quality)</option>
                        <option value="jpg">JPG (Smaller Size)</option>
                    </select>
                </div>
                <button class="convert-btn" id="convert-btn"><i class="fas fa-magic"></i> Convert to Image</button>
            </div>
            
            <p id="status"></p>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        class WordToImage {
            constructor() {
                this.uploadZone = document.getElementById('upload-zone');
                this.fileInput = document.getElementById('file-input');
                this.preview = document.getElementById('preview');
                this.controls = document.getElementById('controls');
                this.convertBtn = document.getElementById('convert-btn');
                this.formatSelect = document.getElementById('format');
                this.statusEl = document.getElementById('status');
                
                this.init();
            }

            init() {
                this.uploadZone.addEventListener('click', () => this.fileInput.click());
                
                this.uploadZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    this.uploadZone.classList.add('dragover');
                });
                
                this.uploadZone.addEventListener('dragleave', () => {
                    this.uploadZone.classList.remove('dragover');
                });
                
                this.uploadZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.uploadZone.classList.remove('dragover');
                    if (e.dataTransfer.files[0]) {
                        this.loadWord(e.dataTransfer.files[0]);
                    }
                });

                this.fileInput.addEventListener('change', (e) => {
                    if (e.target.files[0]) {
                        this.loadWord(e.target.files[0]);
                    }
                });

                this.convertBtn.addEventListener('click', () => this.convertToImage());
            }

            loadWord(file) {
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    try {
                        const arrayBuffer = e.target.result;
                        
                        mammoth.convertToHtml({ arrayBuffer: arrayBuffer })
                            .then((result) => {
                                this.preview.innerHTML = result.value;
                                this.preview.style.display = 'block';
                                this.controls.style.display = 'block';
                                this.showStatus(`✅ Document loaded: ${file.name}`, 'success');
                            })
                            .catch((e) => {
                                console.error(e);
                                this.showStatus('❌ Error reading Word file', 'error');
                            });
                    } catch (e) {
                        console.error(e);
                        this.showStatus('❌ Error reading file', 'error');
                    }
                };
                
                reader.readAsArrayBuffer(file);
            }

            async convertToImage() {
                if (!this.preview.textContent.trim()) {
                    this.showStatus('❌ Preview नहीं मिला', 'error');
                    return;
                }

                this.convertBtn.disabled = true;
                this.showStatus('⏳ Image बन रहा है...', 'loading');

                try {
                    const canvas = await html2canvas(this.preview, {
                        scale: 2,
                        backgroundColor: '#fff',
                        logging: false,
                        useCORS: true,
                        allowTaint: true
                    });

                    const format = this.formatSelect.value;
                    const mimeType = format === 'png' ? 'image/png' : 'image/jpeg';
                    
                    canvas.toBlob((blob) => {
                        const link = document.createElement('a');
                        link.download = 'word-to-image.' + format;
                        link.href = URL.createObjectURL(blob);
                        link.click();
                        
                        this.showStatus('🎉 Image download हो गया!', 'success');
                        this.convertBtn.disabled = false;
                    }, mimeType);

                } catch (e) {
                    console.error(e);
                    this.showStatus('❌ Error converting image', 'error');
                    this.convertBtn.disabled = false;
                }
            }

            showStatus(msg, type) {
                this.statusEl.textContent = msg;
                this.statusEl.className = type;
            }
        }

        window.addEventListener('load', () => {
            new WordToImage();
        });
    </script>

</body>
</html>
