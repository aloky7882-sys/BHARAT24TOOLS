<body>
<div class="wrapper">
    <div class="page-header">
        <h1><i class="fa-solid fa-face-grin-squint-tears"></i> Meme Generator</h1>
        <p>Upload an image, add top and bottom text, and download your meme.</p>
    </div>

    <div class="layout">
        <div>
            <div class="panel">
                <h3>Image</h3>
                <div class="upload-zone" id="dropZone">
                    <div class="icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
                    <div class="txt">Click or drag an image here</div>
                    <input type="file" id="upload" accept="image/*">
                </div>
            </div>

            <div class="panel">
                <h3>Text</h3>
                <label>Top Text</label>
                <input type="text" id="topText" placeholder="TOP TEXT">

                <label>Bottom Text</label>
                <input type="text" id="bottomText" placeholder="BOTTOM TEXT">

                <label>Font Size <span class="range-value" id="fontSizeValue">42px</span></label>
                <input type="range" id="fontSize" min="20" max="90" value="42">

                <label>Text Color / Outline</label>
                <div class="color-row">
                    <div class="cfield">
                        <input type="color" id="textColor" value="#ffffff">
                    </div>
                    <div class="cfield">
                        <input type="color" id="strokeColor" value="#000000">
                    </div>
                </div>

                <button class="btn btn-primary" id="downloadBtn"><i class="fa-solid fa-download"></i> Download Meme</button>
            </div>
        </div>

        <div class="panel canvas-wrap">
            <canvas id="memeCanvas" width="600" height="450"></canvas>
            <div id="status">Upload an image to get started.</div>
        </div>
    </div>

    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
</div>

<script>
    const upload = document.getElementById("upload");
    const dropZone = document.getElementById("dropZone");
    const canvas = document.getElementById("memeCanvas");
    const ctx = canvas.getContext("2d");
    const topText = document.getElementById("topText");
    const bottomText = document.getElementById("bottomText");
    const fontSize = document.getElementById("fontSize");
    const fontSizeValue = document.getElementById("fontSizeValue");
    const textColor = document.getElementById("textColor");
    const strokeColor = document.getElementById("strokeColor");
    const downloadBtn = document.getElementById("downloadBtn");
    const status = document.getElementById("status");

    let currentImage = null;

    function drawPlaceholder(){
        canvas.width = 600;
        canvas.height = 450;
        ctx.fillStyle = "#eeeeee";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#999";
        ctx.font = "18px Poppins, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Upload an image to preview your meme", canvas.width/2, canvas.height/2);
    }

    function wrapText(text, maxWidth){
        const words = text.split(" ");
        const lines = [];
        let line = "";
        words.forEach(word => {
            const testLine = line ? line + " " + word : word;
            if(ctx.measureText(testLine).width > maxWidth && line){
                lines.push(line);
                line = word;
            } else {
                line = testLine;
            }
        });
        if(line) lines.push(line);
        return lines;
    }

    function drawMemeText(text, size, yAnchor, isTop){
        if(!text) return;
        const upperText = text.toUpperCase();
        ctx.font = `bold ${size}px 'Anton', Impact, sans-serif`;
        ctx.textAlign = "center";
        ctx.lineWidth = size / 10;
        ctx.strokeStyle = strokeColor.value;
        ctx.fillStyle = textColor.value;
        ctx.lineJoin = "round";

        const maxWidth = canvas.width * 0.9;
        const lines = wrapText(upperText, maxWidth);
        const lineHeight = size * 1.15;

        lines.forEach((line, i) => {
            let y;
            if(isTop){
                y = yAnchor + (i * lineHeight);
            } else {
                y = yAnchor - ((lines.length - 1 - i) * lineHeight);
            }
            ctx.strokeText(line, canvas.width/2, y);
            ctx.fillText(line, canvas.width/2, y);
        });
    }

    function render(){
        if(!currentImage){
            drawPlaceholder();
            return;
        }
        const maxDim = 800;
        let w = currentImage.width;
        let h = currentImage.height;
        if(w > maxDim || h > maxDim){
            const scale = maxDim / Math.max(w, h);
            w = w * scale;
            h = h * scale;
        }
        canvas.width = w;
        canvas.height = h;
        ctx.drawImage(currentImage, 0, 0, w, h);
        const size = parseInt(fontSize.value);
        drawMemeText(topText.value, size, size * 0.9, true);
        drawMemeText(bottomText.value, size, canvas.height - (size * 0.35), false);
    }

    function processFile(file){
        if(!file || !file.type.startsWith("image/")){
            status.innerText = "❌ Please select an image file.";
            return;
        }
        const reader = new FileReader();
        reader.onload = function(e){
            const img = new Image();
            img.onload = function(){
                currentImage = img;
                status.innerText = "✅ Image loaded. Add your text!";
                render();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    upload.addEventListener("change", function(){
        processFile(this.files[0]);
    });

    dropZone.addEventListener("dragover", function(e){
        e.preventDefault();
        dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", function(){
        dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", function(e){
        e.preventDefault();
        dropZone.classList.remove("dragover");
        processFile(e.dataTransfer.files[0]);
    });

    [topText, bottomText, textColor, strokeColor].forEach(el => {
        el.addEventListener("input", render);
    });

    fontSize.addEventListener("input", function(){
        fontSizeValue.innerText = this.value + "px";
        render();
    });

    downloadBtn.addEventListener("click", function(){
        if(!currentImage){
            status.innerText = "❌ Please upload an image first.";
            return;
        }
        const link = document.createElement("a");
        link.download = "meme.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
        status.innerText = "🎉 Meme downloaded!";
    });

    drawPlaceholder();
    document.fonts.ready.then(render);
</script>
</body>
