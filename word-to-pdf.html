<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word to PDF - Bharat24Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Mammoth for DOCX parsing -->
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<!-- html2pdf for PDF generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<!-- jsPDF as fallback -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body {
    min-height:100vh;
    background:linear-gradient(135deg, #0f0f1e 0%, #16213e 50%, #533483 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.container {
    background:rgba(30,27,75,0.95);
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    max-width:750px;
    width:100%;
    text-align:center;
    border:1px solid rgba(168,85,247,0.3);
    color:#e0e7ff;
}
h1 {
    margin-bottom:10px;
    font-size:1.8rem;
    font-weight:800;
    background:linear-gradient(135deg,#a855f7,#ec4899);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
.subtitle { font-size:14px; color:#a5b4fc; margin-bottom:25px; }
.upload-zone {
    position:relative;
    border:3px dashed rgba(168,85,247,0.6);
    border-radius:12px;
    padding:40px 20px;
    margin:20px 0;
    background:rgba(99,102,241,0.05);
    cursor:pointer;
    transition:all .3s ease;
    overflow:hidden;
}
.upload-zone:hover, .upload-zone.dragover {
    background:rgba(168,85,247,0.15);
    border-color:#a855f7;
    transform:translateY(-2px);
}
.upload-zone input {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    cursor:pointer;
}
.upload-icon {
    width:76px;
    height:76px;
    margin:0 auto 14px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(168,85,247,0.2);
    font-size:34px;
}
.upload-title { font-size:18px; font-weight:700; margin-bottom:6px; }
.upload-subtitle { font-size:14px; color:#a5b4fc; margin-bottom:10px; }
.upload-formats {
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    background:rgba(168,85,247,0.15);
    color:#a855f7;
    font-size:12px;
    font-weight:600;
}
#previewWrapper {
    display:none;
    text-align:left;
    max-height:350px;
    overflow-y:auto;
    border:1px solid rgba(168,85,247,0.3);
    border-radius:10px;
    padding:20px;
    margin-top:20px;
    background:#fff;
    color:#1a1a1a;
    line-height:1.6;
}
button {
    width:100%;
    padding:15px;
    background:linear-gradient(135deg,#a855f7,#ec4899);
    border:none;
    border-radius:10px;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:15px;
    font-family:inherit;
    transition:all .3s;
    display:none;
}
button:hover:not(:disabled) {
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(168,85,247,0.4);
}
button:disabled { opacity:0.6; cursor:not-allowed; }
#status {
    margin-top:15px;
    font-size:14px;
    font-weight:600;
    padding:12px;
    border-radius:8px;
    display:none;
}
#status.success { background:rgba(34,197,94,0.2); color:#86efac; display:block; }
#status.error { background:rgba(239,68,68,0.2); color:#fca5a5; display:block; }
#status.info { background:rgba(99,102,241,0.2); color:#a5b4fc; display:block; }
</style>
</head>
<body>

<div class="container">
    <h1>📄 Word to PDF</h1>
    <p class="subtitle">Convert Word (.docx) documents to PDF</p>

    <div class="upload-zone" id="dropZone">
        <div class="upload-icon">📤</div>
        <div class="upload-title">Drag & Drop Word file here</div>
        <div class="upload-subtitle">or click to choose</div>
        <div class="upload-formats">DOCX</div>
        <input type="file" id="upload" accept=".docx">
    </div>

    <div id="previewWrapper"></div>
    <button id="download">Convert & Download PDF</button>
    <div id="status"></div>
</div>

<script>
const upload = document.getElementById("upload");
const dropZone = document.getElementById("dropZone");
const previewWrapper = document.getElementById("previewWrapper");
const download = document.getElementById("download");
const statusEl = document.getElementById("status");

let selectedFile = null;
let convertedHTML = "";

function showStatus(message, type) {
    statusEl.textContent = message;
    statusEl.className = type;
    statusEl.style.display = 'block';
}

function processFile(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith(".docx")) {
        showStatus("❌ Please select a .docx file only.", "error");
        return;
    }

    if (typeof mammoth === "undefined") {
        showStatus("❌ Library loading failed. Please refresh page.", "error");
        return;
    }

    selectedFile = file;
    showStatus("📂 Reading document...", "info");
    download.style.display = "none";

    const reader = new FileReader();
    reader.onload = function(e) {
        mammoth.convertToHtml({ arrayBuffer: e.target.result })
            .then(function(result) {
                convertedHTML = result.value;
                if (!convertedHTML || convertedHTML.trim() === "") {
                    showStatus("❌ Document appears empty.", "error");
                    return;
                }
                previewWrapper.innerHTML = convertedHTML;
                previewWrapper.style.display = "block";
                download.style.display = "block";
                showStatus("✅ Document ready! Click Convert.", "success");
            })
            .catch(function(err) {
                showStatus("❌ Cannot read file: " + err.message, "error");
            });
    };
    reader.onerror = function() {
        showStatus("❌ Failed to read file.", "error");
    };
    reader.readAsArrayBuffer(file);
}

upload.addEventListener("change", function() { processFile(this.files[0]); });
dropZone.addEventListener("dragover", function(e) { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", function() { dropZone.classList.remove("dragover"); });
dropZone.addEventListener("drop", function(e) {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    processFile(e.dataTransfer.files[0]);
});

download.addEventListener("click", function() {
    if (!convertedHTML || !selectedFile) {
        showStatus("❌ Please select a Word file first.", "error");
        return;
    }

    if (typeof html2pdf === "undefined") {
        showStatus("❌ PDF library not loaded. Please refresh page.", "error");
        return;
    }

    showStatus("⏳ Converting to PDF...", "info");
    download.disabled = true;

    const fileName = selectedFile.name.replace(/\.docx$/i, "") + ".pdf";

    const opt = {
        margin: 10,
        filename: fileName,
        image: { type: "jpeg", quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true, logging: false },
        jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
    };

    // Create a clone with white background for PDF
    const clone = document.createElement("div");
    clone.style.cssText = "background:#fff;color:#000;padding:20px;font-family:Arial,sans-serif;line-height:1.6;";
    clone.innerHTML = convertedHTML;
    clone.style.position = "absolute";
    clone.style.left = "-9999px";
    clone.style.width = "190mm";
    document.body.appendChild(clone);

    html2pdf().set(opt).from(clone).save().then(function() {
        document.body.removeChild(clone);
        showStatus("🎉 PDF downloaded successfully!", "success");
        download.disabled = false;
    }).catch(function(err) {
        document.body.removeChild(clone);
        showStatus("❌ Conversion failed: " + err.message, "error");
        download.disabled = false;
    });
});
</script>
</body>
</html>
