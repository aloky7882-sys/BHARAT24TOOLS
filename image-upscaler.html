        ru: { back: "Назад", title: "🔍 AI Увеличение Изображений", subtitle: "Увеличьте разрешение 2x, 3x, 4x", clickOrDrag: "Нажмите или перетащите", formatInfo: "Изображение (JPG, PNG, WebP — макс 10MB)", selectScale: "Коэффициент:", scale2: "2x", scale2Desc: "Быстро", scale3: "3x", scale3Desc: "Баланс", scale4: "4x", scale4Desc: "Максимум", upscaleBtn: "Увеличить", downloadBtn: "Скачать", resetBtn: "Другое изображение", infoTitle: "Как:", infoText: "ИИ увеличивает с Lanczos + резкость.", loading: "Увеличение... 30-60 сек", success: "Готово!", error: "Ошибка: ", selectImage: "Выберите изображение", tooBig: "Файл слишком большой" },
        id: { back: "Kembali", title: "🔍 AI Image Upscaler", subtitle: "Tingkatkan resolusi 2x, 3x, 4x", clickOrDrag: "Klik atau seret", formatInfo: "Gambar (JPG, PNG, WebP — maks 10MB)", selectScale: "Faktor:", scale2: "2x", scale2Desc: "Cepat", scale3: "3x", scale3Desc: "Seimbang", scale4: "4x", scale4Desc: "Maksimal", upscaleBtn: "Upscale", downloadBtn: "Unduh", resetBtn: "Gambar Lain", infoTitle: "Cara:", infoText: "AI upscale dengan Lanczos + penajaman.", loading: "Upscaling... 30-60 detik", success: "Berhasil!", error: "Kesalahan: ", selectImage: "Pilih gambar", tooBig: "File besar" },
        "zh-CN": { back: "返回", title: "🔍 AI 图片放大", subtitle: "将分辨率放大 2x、3x、4x", clickOrDrag: "点击或拖拽", formatInfo: "图片 (JPG, PNG, WebP — 最大 10MB)", selectScale: "倍数:", scale2: "2x", scale2Desc: "快速", scale3: "3x", scale3Desc: "均衡", scale4: "4x", scale4Desc: "最高", upscaleBtn: "放大", downloadBtn: "下载", resetBtn: "换一张", infoTitle: "原理:", infoText: "AI 使用 Lanczos + 锐化放大图片。", loading: "放大中... 30-60 秒", success: "成功!", error: "错误: ", selectImage: "请选择图片", tooBig: "文件太大" }
    };

    let currentLang = localStorage.getItem('lang') || 'en';

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('lang', lang);
        applyTranslations();
    }
    function applyTranslations() {
        const t = translations[currentLang] || translations.en;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.textContent = t[key];
        });
        document.getElementById('languageSelect').value = currentLang;
    }
    function t(key) {
        const tr = translations[currentLang] || translations.en;
        return tr[key] || key;
    }

    // App Logic
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const previewSection = document.getElementById('previewSection');
    const previewImg = document.getElementById('previewImg');
    const fileInfo = document.getElementById('fileInfo');
    const controls = document.getElementById('controls');
    const upscaleBtn = document.getElementById('upscaleBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const status = document.getElementById('status');

    let selectedFile = null;
    let resultBlob = null;
    let selectedScale = 2;

    document.querySelectorAll('.scale-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedScale = parseInt(btn.dataset.scale);
        });
    });

    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('active'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('active'));
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('active');
        if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            showStatus('❌ ' + t('selectImage'), 'error');
            return;
        }
        if (file.size > 10 * 1024 * 1024) {
            showStatus('❌ ' + t('tooBig'), 'error');
            return;
        }
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            previewImg.src = e.target.result;
            previewSection.style.display = 'block';
            controls.style.display = 'block';
            upscaleBtn.style.display = 'flex';
            downloadBtn.style.display = 'none';
            resetBtn.style.display = 'none';
            status.style.display = 'none';
        };
        reader.readAsDataURL(file);

        const img = new Image();
        img.onload = () => {
            fileInfo.textContent = `📐 ${img.width} × ${img.height} px | 📦 ${(file.size/1024).toFixed(1)} KB`;
        };
        img.src = URL.createObjectURL(file);
    }

    upscaleBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        upscaleBtn.disabled = true;
        upscaleBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('loading');
        showStatus('⏳ ' + t('loading'), 'loading');

        try {
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('scale', selectedScale);

            const res = await fetch(API_URL + '/image-upscaler', {
                method: 'POST',
                body: formData
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(errText || 'Server error');
            }

            resultBlob = await res.blob();
            const url = URL.createObjectURL(resultBlob);
            previewImg.src = url;

            showStatus('🎉 ' + t('success'), 'success');
            downloadBtn.style.display = 'flex';
            resetBtn.style.display = 'flex';
            upscaleBtn.style.display = 'none';
        } catch (err) {
            console.error(err);
            showStatus('❌ ' + t('error') + err.message, 'error');
        }

        upscaleBtn.disabled = false;
        upscaleBtn.innerHTML = '<i class="fas fa-magic"></i> ' + t('upscaleBtn');
    });

    downloadBtn.addEventListener('click', () => {
        if (!resultBlob) return;
        const url = URL.createObjectURL(resultBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'upscaled-' + selectedScale + 'x-' + Date.now() + '.png';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
    });

    resetBtn.addEventListener('click', () => {
        selectedFile = null;
        resultBlob = null;
        fileInput.value = '';
        previewSection.style.display = 'none';
        controls.style.display = 'none';
        status.style.display = 'none';
    });

    function showStatus(msg, type) {
        status.textContent = msg;
        status.className = 'status ' + type;
        status.style.display = 'block';
    }

    applyTranslations();
</script>

</body>
</html>
