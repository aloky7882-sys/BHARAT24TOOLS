<main>
    <h1>🔄 Rotate PDF</h1>
    <p class="subtitle">PDF के सभी pages को rotate करो — Server-powered</p>

    <div class="card">
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">🔄</div>
            <p><span class="highlight">Click करो या Drag करो</span></p>

                <span class="badge">🔒 Private</span>
                <span class="badge">👁️ Live Preview</span>
            </div>
        </div>
        <input type="file" id="fileInput" accept=".pdf,application/pdf">

        <div class="controls" id="controls">
            <div class="file-info">
                <span class="name" id="fileName">-</span>
                <span class="size" id="fileSize">-</span>
            </div>

            <div class="control-group">
                <label>🎯 Rotation Angle:</label>
                <div class="angle-grid">
                    <button class="angle-btn active" data-angle="90">
                        <div class="angle-icon">↻</div>
                        <div class="angle-title">90° Right</div>
                        <div class="angle-desc">Clockwise</div>
                    </button>
                    <button class="angle-btn" data-angle="180">
                        <div class="angle-icon">⟳</div>
                        <div class="angle-title">180°</div>
                        <div class="angle-desc">Upside down</div>
                    </button>
                    <button class="angle-btn" data-angle="270">
                        <div class="angle-icon">↺</div>
                        <div class="angle-title">90° Left</div>
                        <div class="angle-desc">Counter-clockwise</div>
                    </button>
                    <button class="angle-btn" data-angle="0">
                        <div class="angle-icon">⭕</div>
                        <div class="angle-title">Reset</div>
                        <div class="angle-desc">No rotation</div>
                    </button>
                </div>

                <div class="preview-label">👁️ Live Preview</div>
                <canvas id="previewCanvas"></canvas>
            </div>

        </div>

        <div class="info-box">
            <strong>💡 कैसे काम करता है:</strong> तुम्हारी PDF हमारे server पर Ghostscript से rotate होती है। सारे pages एक साथ rotate होंगे।
        </div>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const API_URL = 'https://bharat24tools-api.onrender.com';

const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const controls = document.getElementById('controls');
const rotateBtn = document.getElementById('rotateBtn');
const fileNameEl = document.getElementById('fileName');
const fileSizeEl = document.getElementById('fileSize');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const status = document.getElementById('status');
const previewBox = document.getElementById('previewBox');
const previewCanvas = document.getElementById('previewCanvas');

let selectedFile = null;
let selectedAngle = 90;
let pdfDoc = null;
let firstPageImage = null;

document.querySelectorAll('.angle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.angle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedAngle = parseInt(btn.dataset.angle);
        updatePreview();
    });
});

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('active'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('active'));
uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('active');
    if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) handleFile(e.target.files[0]);
});

async function handleFile(file) {
    if (!file.name.toLowerCase().endsWith('.pdf')) {
        showStatus('❌ कृपया PDF file चुनें', 'error');
        return;
    }
    if (file.size > 15 * 1024 * 1024) {
        showStatus('❌ File 15MB से बड़ी है', 'error');
        return;
    }

    selectedFile = file;
    fileNameEl.textContent = file.name.length > 30 ? file.name.substring(0, 30) + '...' : file.name;
    fileSizeEl.textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
    controls.style.display = 'block';
    showStatus(`✅ File ready: ${(file.size / 1024 / 1024).toFixed(2)} MB`, 'success');

    try {
        const arrayBuffer = await file.arrayBuffer();
        pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer.slice(0) }).promise;
        const page = await pdfDoc.getPage(1);
        const viewport = page.getViewport({ scale: 0.5 });
        previewCanvas.width = viewport.width;
        previewCanvas.height = viewport.height;
        const ctx = previewCanvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;

        previewBox.style.display = 'block';
        firstPageImage = previewCanvas.toDataURL();
        updatePreview();
    } catch (err) {
        console.error(err);
    }
}

function updatePreview() {
    if (!firstPageImage) return;
    const img = new Image();
    img.onload = () => {
        const canvas = previewCanvas;
        const ctx = canvas.getContext('2d');
        const angle = selectedAngle;

        if (angle === 90 || angle === 270) {
            canvas.width = img.height;
            canvas.height = img.width;
        } else {
            canvas.width = img.width;
            canvas.height = img.height;
        }

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((angle * Math.PI) / 180);
        ctx.drawImage(img, -img.width / 2, -img.height / 2);
        ctx.restore();
    };
    img.src = firstPageImage;
}

rotateBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    if (selectedAngle === 0) {
        showStatus('❌ कृपया rotation angle चुनें (90°, 180°, 270°)', 'error');
        return;
    }

    rotateBtn.disabled = true;
    progressBar.style.display = 'block';
    progressFill.style.width = '20%';
    showStatus('⏳ Uploading to server... (if server was sleeping, wait 30s)', 'loading');

    setTimeout(() => {
        if (rotateBtn.disabled) {
            progressFill.style.width = '60%';
            showStatus('⏳ Rotating PDF on server...', 'loading');
        }
    }, 5000);

    try {
        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('angle', selectedAngle);

        const res = await fetch(API_URL + '/rotate-pdf', {
            method: 'POST',
            body: formData
        });

        progressFill.style.width = '90%';

        if (!res.ok) {
            const errText = await res.text();
            throw new Error(errText || 'Server error ' + res.status);
        }

        const blob = await res.blob();
        progressFill.style.width = '100%';

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = selectedFile.name.replace(/\.pdf$/i, '') + '-rotated.pdf';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);

        showStatus(`🎉 PDF rotated ${selectedAngle}° successfully!`, 'success');
    } catch (err) {
        console.error(err);
        showStatus('❌ Error: ' + err.message, 'error');
    }

    rotateBtn.disabled = false;
    setTimeout(() => {
        progressBar.style.display = 'none';
        progressFill.style.width = '0%';
    }, 4000);
});

function showStatus(msg, type) {
    status.textContent = msg;
    status.className = 'status ' + type;
}
</script>
