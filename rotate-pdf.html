    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        
        /* Clean, Professional Light Theme (Like iLoveIMG) */
        body { min-height:100vh; background: #f3f4f6; color: #1f2937; display: flex; flex-direction: column; }
        
        /* Header */
        header { background: #ffffff; padding: 15px 30px; display: flex; align-items: center; border-bottom: 1px solid #e5e7eb; }
        header a { color: #6b7280; text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: 0.2s; }
        header a:hover { color: #2563eb; }
        .brand { font-weight: 700; font-size: 1.2rem; color: #2563eb; margin-left: auto; }

        /* Main Container */
        main { flex: 1; padding: 40px 20px; display: flex; justify-content: center; }
        .card { background: #ffffff; width: 100%; max-width: 800px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 40px; }
        
        h1 { font-size: 2rem; text-align: center; margin-bottom: 10px; color: #111827; }
        .subtitle { text-align: center; color: #6b7280; font-size: 1rem; margin-bottom: 30px; }

        /* Upload Zone (Native File Input) */
        .upload-zone { border: 2px dashed #3b82f6; background: #eff6ff; border-radius: 10px; padding: 50px 20px; text-align: center; position: relative; transition: 0.3s; margin-bottom: 20px; cursor: pointer; }
        .upload-zone:hover { background: #dbeafe; border-color: #2563eb; }
        .upload-zone input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .upload-icon { font-size: 3rem; color: #3b82f6; margin-bottom: 15px; }
        .upload-title { font-size: 1.2rem; font-weight: 600; color: #1e3a8a; margin-bottom: 5px; }
        .upload-subtitle { font-size: 0.9rem; color: #64748b; }

        /* Error Box */
        #errorBox { display: none; background: #fee2e2; color: #b91c1c; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: 500; border: 1px solid #f87171; }

        /* Controls (Hidden Initially) */
        #editorArea { display: none; }
        
        .file-info { display: flex; justify-content: space-between; padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 20px; font-weight: 500; color: #475569; }
        
        .tools-section { margin-bottom: 25px; }
        .section-title { font-size: 1rem; font-weight: 600; margin-bottom: 15px; color: #334155; }
        
        /* Buttons */
        .angle-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .btn-angle { padding: 15px 10px; background: #ffffff; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 600; color: #475569; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .btn-angle:hover { border-color: #93c5fd; background: #eff6ff; }
        .btn-angle.active { background: #2563eb; border-color: #2563eb; color: #ffffff; }
        .btn-angle span.icon { font-size: 1.5rem; }

        /* Live Preview Area */
        .preview-container { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 25px; }
        .preview-label { font-size: 0.85rem; color: #64748b; margin-bottom: 15px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
        #previewCanvas { max-width: 100%; max-height: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 4px; background: #fff; transition: transform 0.2s; }

        /* Action Button */
        .btn-primary { width: 100%; padding: 18px; background: #2563eb; color: #ffffff; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-primary:hover { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

        @media (max-width: 600px) {
            .card { padding: 20px; }
            h1 { font-size: 1.5rem; }
            .angle-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html">← Back to Tools</a>
        <div class="brand">⚡ Bharat24Tools</div>
    </header>

    <main>
        <div class="card">
            <h1>Rotate PDF</h1>
            <p class="subtitle">Rotate all pages in your PDF file. 100% free and secure.</p>

            <div id="errorBox">⚠️ Could not load PDF libraries. Please disable AdBlocker/VPN and refresh.</div>

            <!-- Upload Zone -->
            <div class="upload-zone" id="uploadZone">
                <input type="file" id="fileInput" accept=".pdf,application/pdf">
                <div class="upload-icon">📄</div>
                <div class="upload-title">Select PDF file</div>
                <div class="upload-subtitle">or drop PDF here (Max 15MB)</div>
            </div>

            <!-- Editor Area -->
            <div id="editorArea">
                <div class="file-info">
                    <span id="fileName">document.pdf</span>
                    <span id="fileSize">0 MB</span>
                </div>

                <div class="tools-section">
                    <div class="section-title">Select Rotation Angle</div>
                    <div class="angle-grid">
                        <button type="button" class="btn-angle active" data-angle="90">
                            <span class="icon">↻</span> 90° Right
                        </button>
                        <button type="button" class="btn-angle" data-angle="180">
                            <span class="icon">⟳</span> 180° Upside
                        </button>
                        <button type="button" class="btn-angle" data-angle="270">
                            <span class="icon">↺</span> 90° Left
                        </button>
                        <button type="button" class="btn-angle" data-angle="0">
                            <span class="icon">⭕</span> Reset
                        </button>
                    </div>
                </div>

                <div class="preview-container">
                    <div class="preview-label">Live Preview</div>
                    <canvas id="previewCanvas"></canvas>
                </div>

                <button type="button" class="btn-primary" id="rotateBtn">
                    <span>🔄</span> Rotate & Download PDF
                </button>
            </div>

        </div>
    </main>

    <!-- ✅ Multi-CDN Loader to bypass Adblockers -->
    <script>
        // Function to load scripts dynamically with fallbacks
        async function loadScript(url) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = url;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        async function init() {
            try {
                // Load PDF.js (For Preview)
                try {
                    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
                } catch (e) {
                    await loadScript("https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js");
                }

                // Load PDF-Lib (For Rotation)
                try {
                    await loadScript("https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js");
                } catch (e) {
                    await loadScript("https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js");
                }

                // If success, start the app
                startApp();

            } catch (error) {
                console.error("Library load failed:", error);
                document.getElementById('errorBox').style.display = 'block';
            }
        }

        function startApp() {
            // Setup PDF.js Worker
            pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

            const fileInput = document.getElementById('fileInput');
            const uploadZone = document.getElementById('uploadZone');
            const editorArea = document.getElementById('editorArea');
            const fileNameEl = document.getElementById('fileName');
            const fileSizeEl = document.getElementById('fileSize');
            const rotateBtn = document.getElementById('rotateBtn');
            const previewCanvas = document.getElementById('previewCanvas');

            let selectedFile = null;
            let selectedAngle = 90;
            let firstPageImage = null;

            // Handle File Selection
            fileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!file.name.toLowerCase().endsWith('.pdf')) {
                    alert('Please select a valid PDF file.');
                    return;
                }

                if (file.size > 15 * 1024 * 1024) {
                    alert('File is too large. Max limit is 15MB.');
                    return;
                }

                selectedFile = file;
                fileNameEl.textContent = file.name;
                fileSizeEl.textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
                
                uploadZone.style.display = 'none';
                editorArea.style.display = 'block';

                // Generate Preview
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer.slice(0) }).promise;
                    const page = await pdfDoc.getPage(1);
                    const viewport = page.getViewport({ scale: 0.6 });
                    
                    previewCanvas.width = viewport.width;
                    previewCanvas.height = viewport.height;
                    
                    const ctx = previewCanvas.getContext('2d');
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                    firstPageImage = previewCanvas.toDataURL();
                    updatePreview();
                } catch (err) {
                    console.error(err);
                    alert('Could not load PDF preview. File might be password protected.');
                }
            });

            // Angle Buttons
            document.querySelectorAll('.btn-angle').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.btn-angle').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedAngle = parseInt(btn.dataset.angle);
                    updatePreview();
                });
            });

            // Update Preview (Rotate Canvas)
            function updatePreview() {
                if (!firstPageImage) return;
                const img = new Image();
                img.onload = () => {
                    const ctx = previewCanvas.getContext('2d');
                    
                    if (selectedAngle === 90 || selectedAngle === 270) {
                        previewCanvas.width = img.height;
                        previewCanvas.height = img.width;
                    } else {
                        previewCanvas.width = img.width;
                        previewCanvas.height = img.height;
                    }
                    
                    ctx.save();
                    ctx.translate(previewCanvas.width / 2, previewCanvas.height / 2);
                    ctx.rotate((selectedAngle * Math.PI) / 180);
                    ctx.drawImage(img, -img.width / 2, -img.height / 2);
                    ctx.restore();
                };
                img.src = firstPageImage;
            }

            // Main Rotation & Download
            rotateBtn.addEventListener('click', async () => {
                if (!selectedFile || typeof PDFLib === 'undefined') return;

                rotateBtn.disabled = true;
                rotateBtn.innerHTML = "<span>⏳</span> Processing...";

                try {
                    const arrayBuffer = await selectedFile.arrayBuffer();
                    const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
                    const pages = pdfDoc.getPages();

                    // Rotate all pages
                    pages.forEach(page => {
                        const currentRotation = page.getRotation().angle;
                        page.setRotation(PDFLib.degrees((currentRotation + selectedAngle) % 360));
                    });

                    const pdfBytes = await pdfDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    
                    // BULLETPROOF DOWNLOAD
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'rotated-' + selectedFile.name;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    // Cleanup memory
                    setTimeout(() => URL.revokeObjectURL(url), 5000);

                    // Reset UI after success
                    rotateBtn.innerHTML = "<span>✅</span> Downloaded Successfully!";
                    setTimeout(() => {
                        rotateBtn.innerHTML = "<span>🔄</span> Rotate & Download PDF";
                        rotateBtn.disabled = false;
                    }, 3000);

                } catch (error) {
                    console.error("Rotation Error:", error);
                    alert('Error: ' + (error.message || 'Could not process PDF.'));
                    rotateBtn.innerHTML = "<span>🔄</span> Rotate & Download PDF";
                    rotateBtn.disabled = false;
                }
            });
        }

        // Start Loading
        init();
    </script>
</body>
</html>
