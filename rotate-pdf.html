    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        
        /* Dark Glassmorphism Theme */
        body { 
            min-height:100vh; 
            background: linear-gradient(135deg, #0f0f1e 0%, #16213e 50%, #533483 100%); 
            color:#e0e7ff; 
            display: flex; 
            flex-direction: column; 
            padding: 20px;
        }
        
        header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 15px 25px;
            background: rgba(15,15,30,0.6);
            border-radius: 12px;
            border: 1px solid rgba(168,85,247,0.2);
            backdrop-filter: blur(10px);
        }
        header a { color: #a5b4fc; text-decoration: none; font-weight: 600; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        header a:hover { color: #a855f7; }
        .brand { font-weight: 800; font-size: 1.2rem; color: #a855f7; display: flex; align-items: center; gap: 8px; }

        main { flex: 1; display: flex; justify-content: center; align-items: flex-start; }
        .card { 
            background: rgba(30, 27, 75, 0.85); 
            width: 100%; 
            max-width: 800px; 
            border-radius: 16px; 
            border: 1px solid rgba(168,85,247,0.3); 
            box-shadow: 0 15px 50px rgba(0,0,0,0.6); 
            padding: 40px; 
            backdrop-filter: blur(15px);
        }
        
        h1 { font-size: 2rem; text-align: center; margin-bottom: 10px; color: #ffffff; }
        .subtitle { text-align: center; color: #a5b4fc; font-size: 0.95rem; margin-bottom: 30px; }

        /* Upload Zone */
        .upload-zone { 
            border: 2px dashed rgba(168,85,247,0.6); 
            background: rgba(99,102,241,0.05); 
            border-radius: 12px; 
            padding: 50px 20px; 
            text-align: center; 
            position: relative; 
            transition: 0.3s; 
            cursor: pointer; 
        }
        .upload-zone:hover { background: rgba(168,85,247,0.15); border-color: #a855f7; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(168,85,247,0.2); }
        .upload-zone input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .upload-icon { font-size: 3.5rem; color: #a855f7; margin-bottom: 15px; }
        .upload-title { font-size: 1.2rem; font-weight: 600; color: #e0e7ff; margin-bottom: 5px; }
        .upload-subtitle { font-size: 0.85rem; color: #a5b4fc; }

        /* Editor Area */
        #editorArea { display: none; }
        
        .file-info { display: flex; justify-content: space-between; padding: 15px; background: rgba(99,102,241,0.1); border: 1px solid rgba(168,85,247,0.2); border-radius: 8px; margin-bottom: 20px; font-weight: 500; color: #cbd5e1; }
        .file-info span:last-child { color: #a855f7; font-weight: 700; }
        
        .section-title { font-size: 1rem; font-weight: 600; margin-bottom: 15px; color: #e0e7ff; }
        
        /* Password Prompt (Hidden by default) */
        #passwordPrompt {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        #passwordPrompt p { color: #fca5a5; font-size: 0.9rem; margin-bottom: 15px; }
        .password-input-group { display: flex; gap: 10px; }
        .password-input-group input {
            flex: 1; padding: 12px; border-radius: 8px; background: rgba(15,15,30,0.8);
            border: 1px solid rgba(168,85,247,0.4); color: white; font-family: inherit; outline: none;
        }
        .password-input-group button {
            background: #ef4444; color: white; border: none; padding: 0 20px;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .password-input-group button:hover { background: #dc2626; }

        /* Buttons */
        .angle-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 25px; }
        .btn-angle { 
            padding: 15px 10px; 
            background: rgba(15,15,30,0.6); 
            border: 1px solid rgba(168,85,247,0.3); 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.9rem; 
            font-weight: 600; 
            color: #cbd5e1; 
            transition: 0.2s; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 5px; 
        }
        .btn-angle:hover { border-color: #a855f7; background: rgba(168,85,247,0.1); }
        .btn-angle.active { background: linear-gradient(135deg, #a855f7, #ec4899); border-color: transparent; color: #fff; box-shadow: 0 4px 15px rgba(168,85,247,0.3); }
        .btn-angle span.icon { font-size: 1.5rem; }

        /* Preview Area */
        .preview-container { 
            background: rgba(15,15,30,0.8); 
            border: 1px solid rgba(168,85,247,0.2); 
            border-radius: 8px; 
            padding: 25px; 
            text-align: center; 
            margin-bottom: 25px; 
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .preview-label { font-size: 0.8rem; color: #a5b4fc; margin-bottom: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        #previewCanvas { max-width: 100%; max-height: 350px; border-radius: 4px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: all 0.3s ease; }
        
        /* Loading Spinner */
        .loader { display: none; border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #a855f7; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Action Button */
        .btn-primary { 
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(135deg, #a855f7, #ec4899); 
            color: #ffffff; 
            border: none; 
            border-radius: 8px; 
            font-size: 1.05rem; 
            font-weight: 700; 
            cursor: pointer; 
            transition: 0.3s; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(168,85,247,0.4); }
        .btn-primary:disabled { background: #475569; cursor: not-allowed; transform: none; box-shadow: none; }

        @media (max-width: 600px) {
            .card { padding: 20px; }
            h1 { font-size: 1.5rem; }
            .angle-grid { grid-template-columns: repeat(2, 1fr); }
            .password-input-group { flex-direction: column; }
            .password-input-group button { padding: 12px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
        <div class="brand"><i class="fas fa-bolt"></i> Bharat24Tools</div>
    </header>

    <main>
        <div class="card">
            <h1>🔄 Rotate PDF</h1>
            <p class="subtitle">Rotate all pages in your PDF file securely in your browser.</p>

            <!-- Upload Zone -->
            <div class="upload-zone" id="uploadZone">
                <input type="file" id="fileInput" accept=".pdf,application/pdf">
                <div class="upload-icon"><i class="fas fa-file-pdf"></i></div>
                <div class="upload-title">Select PDF file</div>
                <div class="upload-subtitle">or drop PDF here (Max 20MB)</div>
            </div>

            <!-- Editor Area -->
            <div id="editorArea">
                <div class="file-info">
                    <span id="fileName">document.pdf</span>
                    <span id="fileSize">0 MB</span>
                </div>

                <!-- Smart Password Prompt -->
                <div id="passwordPrompt">
                    <p><i class="fas fa-lock"></i> This PDF is password protected. Please enter the password to view the preview.</p>
                    <div class="password-input-group">
                        <input type="password" id="pdfPasswordInput" placeholder="Enter PDF Password">
                        <button id="unlockBtn">Unlock</button>
                    </div>
                </div>

                <div class="section-title">Select Rotation Angle:</div>
                <div class="angle-grid">
                    <button type="button" class="btn-angle active" data-angle="90">
                        <span class="icon">↻</span> 90° Right
                    </button>
                    <button type="button" class="btn-angle" data-angle="180">
                        <span class="icon">⟳</span> 180° Upside
                    </button>
                    <button type="button" class="btn-angle" data-angle="270">
                        <span class="icon">↺</span> 90° Left
                    </button>
                    <button type="button" class="btn-angle" data-angle="0">
                        <span class="icon">⭕</span> Reset
                    </button>
                </div>

                <div class="preview-container">
                    <div class="preview-label">Live Preview</div>
                    <div class="loader" id="previewLoader"></div>
                    <canvas id="previewCanvas"></canvas>
                </div>

                <button type="button" class="btn-primary" id="rotateBtn">
                    <i class="fas fa-sync-alt"></i> Rotate & Download PDF
                </button>
            </div>

        </div>
    </main>

    <!-- ✅ Smart Multi-CDN Loader -->
    <script>
        async function loadScript(url) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = url;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        async function init() {
            try {
                // Load PDF.js (For robust Preview)
                try { await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"); } 
                catch (e) { await loadScript("https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"); }

                // Load PDF-Lib (For Rotation)
                try { await loadScript("https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"); } 
                catch (e) { await loadScript("https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"); }

                startApp();
            } catch (error) {
                console.error("Library load failed:", error);
                alert("Could not load PDF tools. Please check your internet connection or disable AdBlocker.");
            }
        }

        function startApp() {
            pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

            const fileInput = document.getElementById('fileInput');
            const uploadZone = document.getElementById('uploadZone');
            const editorArea = document.getElementById('editorArea');
            const fileNameEl = document.getElementById('fileName');
            const fileSizeEl = document.getElementById('fileSize');
            const rotateBtn = document.getElementById('rotateBtn');
            const previewCanvas = document.getElementById('previewCanvas');
            const previewLoader = document.getElementById('previewLoader');
            const passwordPrompt = document.getElementById('passwordPrompt');
            const pdfPasswordInput = document.getElementById('pdfPasswordInput');
            const unlockBtn = document.getElementById('unlockBtn');

            let selectedFile = null;
            let selectedAngle = 90;
            let pdfArrayBuffer = null;
            let pdfPassword = "";

            // Handle File Upload
            fileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!file.name.toLowerCase().endsWith('.pdf')) {
                    alert('Please select a valid PDF file.');
                    return;
                }

                selectedFile = file;
                fileNameEl.textContent = file.name;
                fileSizeEl.textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
                
                uploadZone.style.display = 'none';
                editorArea.style.display = 'block';
                passwordPrompt.style.display = 'none';
                pdfPasswordInput.value = '';
                pdfPassword = '';
                
                previewCanvas.style.display = 'none';
                previewLoader.style.display = 'block';

                // Read File into ArrayBuffer for processing
                pdfArrayBuffer = await file.arrayBuffer();
                renderPreview(pdfArrayBuffer, "");
            });

            // Handle Password Unlock
            unlockBtn.addEventListener('click', () => {
                const pass = pdfPasswordInput.value;
                if (!pass) {
                    alert("Please enter the password.");
                    return;
                }
                pdfPassword = pass;
                pdfPasswordInput.value = ''; // Clear for security
                passwordPrompt.style.display = 'none';
                previewLoader.style.display = 'block';
                previewCanvas.style.display = 'none';
                renderPreview(pdfArrayBuffer, pdfPassword);
            });

            // Render PDF Page to Canvas (Advanced)
            async function renderPreview(arrayBuffer, password = "") {
                try {
                    // Copy arraybuffer because pdf.js consumes it
                    const dataCopy = arrayBuffer.slice(0);
                    
                    const loadingTask = pdfjsLib.getDocument({ 
                        data: dataCopy,
                        password: password 
                    });
                    
                    const pdfDoc = await loadingTask.promise;
                    const page = await pdfDoc.getPage(1);
                    
                    // High Resolution rendering
                    const viewport = page.getViewport({ scale: 1.5 }); 
                    
                    previewCanvas.width = viewport.width;
                    previewCanvas.height = viewport.height;
                    
                    const ctx = previewCanvas.getContext('2d');
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                    previewLoader.style.display = 'none';
                    previewCanvas.style.display = 'block';
                    
                    // Apply rotation visually to the fresh canvas
                    applyCanvasRotation();

                } catch (err) {
                    previewLoader.style.display = 'none';
                    console.warn("Preview Error:", err);
                    
                    // Check if it's a Password Exception
                    if (err.name === "PasswordException" || err.message.includes("password")) {
                        passwordPrompt.style.display = 'block';
                    } else {
                        alert('Could not load PDF preview. The file might be corrupted or using an unsupported format.');
                    }
                }
            }

            // Angle Buttons
            document.querySelectorAll('.btn-angle').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.btn-angle').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedAngle = parseInt(btn.dataset.angle);
                    applyCanvasRotation();
                });
            });

            // Apply Rotation to Canvas visually
            function applyCanvasRotation() {
                if (previewCanvas.style.display === 'none' || previewCanvas.width === 0) return;
                
                // We need to draw the existing canvas onto a new canvas with rotation
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = previewCanvas.width;
                tempCanvas.height = previewCanvas.height;
                tempCtx.drawImage(previewCanvas, 0, 0);

                const img = new Image();
                img.onload = () => {
                    const ctx = previewCanvas.getContext('2d');
                    
                    if (selectedAngle === 90 || selectedAngle === 270) {
                        previewCanvas.width = img.height;
                        previewCanvas.height = img.width;
                    } else {
                        previewCanvas.width = img.width;
                        previewCanvas.height = img.height;
                    }
                    
                    ctx.save();
                    ctx.translate(previewCanvas.width / 2, previewCanvas.height / 2);
                    ctx.rotate((selectedAngle * Math.PI) / 180);
                    ctx.drawImage(img, -img.width / 2, -img.height / 2);
                    ctx.restore();
                };
                img.src = tempCanvas.toDataURL();
            }

            // Rotate & Download Logic
            rotateBtn.addEventListener('click', async () => {
                if (!pdfArrayBuffer || typeof PDFLib === 'undefined') return;

                rotateBtn.disabled = true;
                rotateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

                try {
                    // Load PDF with PDF-Lib (ignoreEncryption allows editing)
                    const pdfDoc = await PDFLib.PDFDocument.load(pdfArrayBuffer, { ignoreEncryption: true });
                    const pages = pdfDoc.getPages();

                    pages.forEach(page => {
                        const currentRotation = page.getRotation().angle;
                        page.setRotation(PDFLib.degrees((currentRotation + selectedAngle) % 360));
                    });

                    const pdfBytes = await pdfDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    
                    // BULLETPROOF DOWNLOAD (Works on all browsers)
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'rotated-' + selectedFile.name;
                    document.body.appendChild(link);
                    link.click();
                    
                    // CLEANUP
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(url), 5000);

                    rotateBtn.innerHTML = '<i class="fas fa-check"></i> Downloaded!';
                    setTimeout(() => {
                        rotateBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Rotate & Download PDF';
                        rotateBtn.disabled = false;
                    }, 3000);

                } catch (error) {
                    console.error("Rotation Error:", error);
                    alert('Error: Could not process PDF. It might be heavily encrypted.');
                    rotateBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Rotate & Download PDF';
                    rotateBtn.disabled = false;
                }
            });
        }

        init();
    </script>
</body>
</html>
