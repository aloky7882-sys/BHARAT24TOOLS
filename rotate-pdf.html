    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        
        /* Dark Glassmorphism Theme */

        #editorArea { display: none; }
        
        .file-info { display: flex; justify-content: space-between; padding: 15px; background: rgba(99,102,241,0.1); border: 1px solid rgba(168,85,247,0.2); border-radius: 8px; margin-bottom: 20px; font-weight: 500; color: #cbd5e1; }

        .btn-angle:hover { border-color: #a855f7; background: rgba(168,85,247,0.1); }
        .btn-angle.active { background: linear-gradient(135deg, #a855f7, #ec4899); border-color: transparent; color: #fff; box-shadow: 0 4px 15px rgba(168,85,247,0.3); }
        .btn-angle span.icon { font-size: 1.5rem; }

        /* Preview Area */
        .preview-container { 
            background: rgba(15,15,30,0.8); 
            border: 1px solid rgba(168,85,247,0.2);

        /* Canvas for Preview */
        #previewCanvas { max-width: 100%; max-height: 350px; border-radius: 4px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; }
        
        /* Fallback Message */
        #fallbackMessage { display: none; color: #fca5a5; font-size: 0.9rem; text-align: center; padding: 20px; }

        /* Action Button */
        .btn-primary { 
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(135deg, #a855f7, #ec4899); 
            color: #ffffff; 
            border: none; 
            border-radius: 8px;

            font-weight: 700; 
            cursor: pointer; 
            transition: 0.3s;

        .btn-primary:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(168,85,247,0.4); }
        .btn-primary:disabled { background: #475569; cursor: not-allowed; transform: none; box-shadow: none; }

        @media (max-width: 600px) {
            .card { padding: 20px; }
            h1 { font-size: 1.5rem; }
            .angle-grid { grid-template-columns: repeat(2, 1fr); }

    </style>
</head>
<body>

    <header>
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
        <div class="brand"><i class="fas fa-bolt"></i> Bharat24Tools</div>
    </header>

    <main>
        <div class="card">
            <h1>🔄 Rotate PDF</h1>
            <p class="subtitle">Rotate all pages in your PDF file securely in your browser.</p>

            <!-- Upload Zone -->
            <div class="upload-zone" id="uploadZone">
                <input type="file" id="fileInput" accept=".pdf,application/pdf">
                <div class="upload-icon"><i class="fas fa-file-pdf"></i></div>
                <div class="upload-title">Select PDF file</div>
                <div class="upload-subtitle">or drop PDF here (Max 20MB)</div>
            </div>

            <!-- Editor Area -->
            <div id="editorArea">
                <div class="file-info">
                    <span id="fileName">document.pdf</span>
                    <span id="fileSize">0 MB</span>
                </div>

                <div class="section-title">Select Rotation Angle:</div>
                <div class="angle-grid">
                    <button type="button" class="btn-angle active" data-angle="90">
                        <span class="icon">↻</span> 90° Right
                    </button>
                    <button type="button" class="btn-angle" data-angle="180">
                        <span class="icon">⟳</span> 180° Upside
                    </button>
                    <button type="button" class="btn-angle" data-angle="270">
                        <span class="icon">↺</span> 90° Left
                    </button>
                    <button type="button" class="btn-angle" data-angle="0">
                        <span class="icon">⭕</span> Reset
                    </button>
                </div>

                <div class="preview-container">
                    <div class="preview-label">Live Preview</div>
                    <canvas id="previewCanvas"></canvas>
                    <div id="fallbackMessage">
                        <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 10px;"></i><br>
                        Preview not available for this file (Browser restriction).<br>
                        <strong>You can still rotate & download safely.</strong>
                    </div>
                </div>

                <button type="button" class="btn-primary" id="rotateBtn">
                    <i class="fas fa-sync-alt"></i> Rotate & Download PDF
                </button>
            </div>

        </div>
    </main>

    <script>
        // ✅ Ultimate Bypass Loader (Tries CDNs, then Proxy)
        async function loadScriptWithBypass(url, proxyUrl) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = url;
                script.onload = resolve;
                script.onerror = () => {
                    console.log("Blocked: " + url + ". Trying Proxy...");
                    const proxyScript = document.createElement('script');
                    proxyScript.src = proxyUrl;
                    proxyScript.onload = resolve;
                    proxyScript.onerror = reject;
                    document.head.appendChild(proxyScript);
                };
                document.head.appendChild(script);
            });
        }

        async function init() {
            try {
                // 1. Load PDF.js (For Preview)
                await loadScriptWithBypass(
                    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
                    "https://api.allorigins.win/raw?url=https%3A%2F%2Fcdnjs.cloudflare.com%2Fajax%2Flibs%2Fpdf.js%2F3.11.174%2Fpdf.min.js"
                );

                // 2. Load PDF-Lib (For Rotation)
                await loadScriptWithBypass(
                    "https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js",
                    "https://api.allorigins.win/raw?url=https%3A%2F%2Fcdn.jsdelivr.net%2Fnpm%2Fpdf-lib%401.17.1%2Fdist%2Fpdf-lib.min.js"
                );

                startApp();
            } catch (error) {
                // If both CDN and Proxy fail, silently fail (no red box)
                console.error("All library load attempts failed.", error);
            }
        }

        function startApp() {
            // Try to set worker, use proxy if needed
            pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

            const fileInput = document.getElementById('fileInput');
            const uploadZone = document.getElementById('uploadZone');
            const editorArea = document.getElementById('editorArea');
            const fileNameEl = document.getElementById('fileName');
            const fileSizeEl = document.getElementById('fileSize');
            const rotateBtn = document.getElementById('rotateBtn');
            const previewCanvas = document.getElementById('previewCanvas');
            const fallbackMessage = document.getElementById('fallbackMessage');

            let selectedFile = null;
            let selectedAngle = 90;
            let firstPageImageData = null;

            fileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!file.name.toLowerCase().endsWith('.pdf')) {
                    alert('Please select a valid PDF file.');
                    return;
                }

                selectedFile = file;
                fileNameEl.textContent = file.name;
                fileSizeEl.textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
                
                uploadZone.style.display = 'none';
                editorArea.style.display = 'block';
                
                previewCanvas.style.display = 'none';
                fallbackMessage.style.display = 'none';

                const arrayBuffer = await file.arrayBuffer();
                renderPreview(arrayBuffer);
            });

            async function renderPreview(arrayBuffer) {
                try {
                    const dataCopy = arrayBuffer.slice(0);
                    const loadingTask = pdfjsLib.getDocument({ data: dataCopy });
                    const pdfDoc = await loadingTask.promise;
                    const page = await pdfDoc.getPage(1);
                    const viewport = page.getViewport({ scale: 2.0 }); 
                    
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = viewport.width;
                    tempCanvas.height = viewport.height;
                    const tempCtx = tempCanvas.getContext('2d');
                    
                    await page.render({ canvasContext: tempCtx, viewport: viewport }).promise;
                    firstPageImageData = tempCanvas.toDataURL();
                    
                    previewCanvas.style.display = 'block';
                    fallbackMessage.style.display = 'none';
                    applyRotation();
                } catch (err) {
                    console.warn("Preview Error:", err);
                    previewCanvas.style.display = 'none';
                    fallbackMessage.style.display = 'block';
                }
            }

            document.querySelectorAll('.btn-angle').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.btn-angle').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedAngle = parseInt(btn.dataset.angle);
                    if (firstPageImageData) applyRotation();
                });
            });

            function applyRotation() {
                if (!firstPageImageData) return;
                const img = new Image();
                img.onload = () => {
                    const ctx = previewCanvas.getContext('2d');
                    if (selectedAngle === 90 || selectedAngle === 270) {
                        previewCanvas.width = img.height;
                        previewCanvas.height = img.width;
                    } else {
                        previewCanvas.width = img.width;
                        previewCanvas.height = img.height;
                    }
                    ctx.save();
                    ctx.translate(previewCanvas.width / 2, previewCanvas.height / 2);
                    ctx.rotate((selectedAngle * Math.PI) / 180);
                    ctx.drawImage(img, -img.width / 2, -img.height / 2);
                    ctx.restore();
                };
                img.src = firstPageImageData;
            }

            rotateBtn.addEventListener('click', async () => {
                if (!selectedFile) return;

                rotateBtn.disabled = true;
                rotateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

                try {
                    const arrayBuffer = await selectedFile.arrayBuffer();
                    const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
                    const pages = pdfDoc.getPages();

                    pages.forEach(page => {
                        const currentRotation = page.getRotation().angle;
                        page.setRotation(PDFLib.degrees((currentRotation + selectedAngle) % 360));
                    });

                    const pdfBytes = await pdfDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'rotated-' + selectedFile.name;
                    
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    setTimeout(() => URL.revokeObjectURL(url), 5000);

                    rotateBtn.innerHTML = '<i class="fas fa-check"></i> Downloaded!';
                    setTimeout(() => {
                        rotateBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Rotate & Download PDF';
                        rotateBtn.disabled = false;
                    }, 3000);

                } catch (error) {
                    console.error("Rotation Error:", error);
                    alert('Error: Could not process PDF. It might be heavily encrypted.');
                    rotateBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Rotate & Download PDF';
                    rotateBtn.disabled = false;
                }
            });
        }

        // Start loading
        init();
    </script>
</body>
</html>
