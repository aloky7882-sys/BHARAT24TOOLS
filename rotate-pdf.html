<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate PDF v2.0 - Bharat24Tools</title>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- ✅ PDFLib for Rotation & PDF.js for Preview -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body { min-height:100vh; background: #0f172a; padding:20px; color:#f8fafc; display: flex; flex-direction: column; align-items: center; }
        
        header { width: 100%; max-width: 800px; display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; }
        header a { color: #94a3b8; text-decoration: none; font-weight: 500; }
        .brand { font-weight: 700; font-size: 1.2rem; color: #3b82f6; }

        /* ✅ Red Box for Errors */
        #errorBox { display: none; width: 100%; max-width: 800px; background: #ef4444; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; text-align: center; }

        main { width: 100%; max-width: 800px; background: #1e293b; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        h1 { font-size: 2rem; text-align: center; margin-bottom: 10px; }
        .version { text-align: center; color: #10b981; font-weight: bold; margin-bottom: 30px; font-size: 0.9rem; }

        /* ✅ NATIVE HTML FILE INPUT (No JS Click tricks) */
        .file-input-wrapper {
            position: relative; width: 100%; margin-bottom: 20px;
            background: #0f172a; border: 2px dashed #3b82f6; border-radius: 12px; overflow: hidden;
        }
        .file-input-wrapper input[type="file"] {
            width: 100%; padding: 40px 20px; cursor: pointer; color: #94a3b8;
            background: transparent; outline: none; font-size: 1.1rem;
        }
        .file-input-wrapper input[type="file"]::file-selector-button {
            background: #3b82f6; color: white; border: none; padding: 10px 20px;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 15px;
            font-family: 'Poppins', sans-serif; transition: 0.3s;
        }
        .file-input-wrapper input[type="file"]::file-selector-button:hover {
            background: #2563eb;
        }

        .controls { display: none; background: #0f172a; padding: 20px; border-radius: 12px; margin-top: 20px; }
        
        .angle-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .angle-btn {
            background: #334155; border: 2px solid #475569; color: white;
            padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s;
        }
        .angle-btn:hover, .angle-btn.active { background: #3b82f6; border-color: #3b82f6; }

        #previewArea { display: none; text-align: center; margin-top: 20px; background: #000; padding: 10px; border-radius: 8px; }
        #previewCanvas { max-width: 100%; max-height: 300px; }

        .btn-submit {
            width: 100%; padding: 18px; background: #10b981; color: white; border: none;
            border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            transition: 0.3s; margin-top: 20px;
        }
        .btn-submit:hover { background: #059669; }
        .btn-submit:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <a href="index.html">← Back</a>
        <div class="brand">⚡ Bharat24Tools</div>
    </header>

    <div id="errorBox">⚠️ Libraries failed to load. Please turn off AdBlocker/VPN and refresh.</div>

    <main>
        <h1>🔄 Rotate PDF</h1>
        <div class="version">v2.0 - Desktop Compatible</div>

        <!-- Native File Input -->
        <div class="file-input-wrapper">
            <input type="file" id="fileInput" accept=".pdf,application/pdf">
        </div>

        <div class="controls" id="controls">
            <div class="angle-grid">
                <button type="button" class="angle-btn active" data-angle="90">↻ 90° Right</button>
                <button type="button" class="angle-btn" data-angle="180">⟳ 180° Upside</button>
                <button type="button" class="angle-btn" data-angle="270">↺ 90° Left</button>
                <button type="button" class="angle-btn" data-angle="0">⭕ Reset</button>
            </div>

            <div id="previewArea">
                <canvas id="previewCanvas"></canvas>
            </div>

            <button type="button" class="btn-submit" id="rotateBtn">Rotate & Download PDF</button>
        </div>
    </main>

    <script>
        // Check if libraries loaded successfully
        window.onload = function() {
            if (typeof PDFLib === 'undefined' || typeof pdfjsLib === 'undefined') {
                document.getElementById('errorBox').style.display = 'block';
            }
        };

        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const fileInput = document.getElementById('fileInput');
        const controls = document.getElementById('controls');
        const rotateBtn = document.getElementById('rotateBtn');
        const previewArea = document.getElementById('previewArea');
        const previewCanvas = document.getElementById('previewCanvas');

        let selectedFile = null;
        let selectedAngle = 90;
        let firstPageImage = null;

        // Native File Input Change
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.name.toLowerCase().endsWith('.pdf')) {
                alert('Please select a PDF file.');
                return;
            }

            selectedFile = file;
            controls.style.display = 'block';

            // Render Preview
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer.slice(0) }).promise;
                const page = await pdfDoc.getPage(1);
                const viewport = page.getViewport({ scale: 0.5 });
                previewCanvas.width = viewport.width;
                previewCanvas.height = viewport.height;
                await page.render({ canvasContext: previewCanvas.getContext('2d'), viewport }).promise;
                
                previewArea.style.display = 'block';
                firstPageImage = previewCanvas.toDataURL();
                updatePreview();
            } catch (err) {
                console.error("Preview Error:", err);
                alert('Could not load PDF preview. File might be protected.');
            }
        });

        // Angle Buttons
        document.querySelectorAll('.angle-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.angle-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedAngle = parseInt(btn.dataset.angle);
                updatePreview();
            });
        });

        function updatePreview() {
            if (!firstPageImage) return;
            const img = new Image();
            img.onload = () => {
                const ctx = previewCanvas.getContext('2d');
                if (selectedAngle === 90 || selectedAngle === 270) {
                    previewCanvas.width = img.height;
                    previewCanvas.height = img.width;
                } else {
                    previewCanvas.width = img.width;
                    previewCanvas.height = img.height;
                }
                ctx.save();
                ctx.translate(previewCanvas.width / 2, previewCanvas.height / 2);
                ctx.rotate((selectedAngle * Math.PI) / 180);
                ctx.drawImage(img, -img.width / 2, -img.height / 2);
                ctx.restore();
            };
            img.src = firstPageImage;
        }

        // Main Rotate Button
        rotateBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            if (typeof PDFLib === 'undefined') {
                alert('PDF Library is missing. Adblocker might be blocking it.');
                return;
            }

            rotateBtn.disabled = true;
            rotateBtn.textContent = "Processing... Please wait";
            
            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
                const pages = pdfDoc.getPages();
                
                pages.forEach(page => {
                    const currentRotation = page.getRotation().angle;
                    page.setRotation(PDFLib.degrees((currentRotation + selectedAngle) % 360));
                });
                
                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                
                // BULLETPROOF DOWNLOAD FOR DESKTOP
                const link = document.createElement('a');
                link.href = url;
                link.download = 'rotated-' + selectedFile.name;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(() => URL.revokeObjectURL(url), 5000);
                alert('PDF Rotated Successfully! Check your Downloads folder.');
                
            } catch (err) {
                console.error("Rotation Error:", err);
                alert('Error: ' + (err.message || 'Could not rotate PDF.'));
            } finally {
                rotateBtn.disabled = false;
                rotateBtn.textContent = "Rotate & Download PDF";
            }
        });
    </script>
</body>
</html>
