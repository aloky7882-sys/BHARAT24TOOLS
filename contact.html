<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Bharat24Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f4f7fb 0%, #e8f1f9 100%);
            min-height: 100vh;
        }
        .navbar {
            background: #fff;
            padding: 18px 5%;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0d6efd, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar a {
            text-decoration: none;
            color: #4b5563;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s;
        }
        .navbar a:hover {
            background: #eef4ff;
            color: #0d6efd;
        }
        .contact-container {
            max-width: 700px;
            margin: 50px auto;
            background: #fff;
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(13, 110, 253, 0.08);
            border: 1px solid rgba(13, 110, 253, 0.05);
        }
        h2 {
            font-size: 2rem;
            color: #1a2b45;
            margin-bottom: 10px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h2 i { color: #0d6efd; }
        .subtitle {
            color: #6c757d;
            margin-bottom: 30px;
            font-size: 1rem;
        }
        .contact-info {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8fafc;
            border-radius: 16px;
            border: 1px solid #e9ecef;
        }
        .contact-info p {
            margin: 15px 0;
            font-size: 1rem;
            color: #333;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .contact-info i {
            color: #0d6efd;
            font-size: 1.2rem;
            width: 25px;
            text-align: center;
        }
        .contact-info a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }
        .contact-info a.wa-link {
            color: #138808;
        }
        .contact-info a:hover { text-decoration: underline; }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1a2b45;
            font-size: 0.95rem;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.3s;
            background: #f8fafc;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #0d6efd;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1);
        }
        .submit-btn {
            background: linear-gradient(135deg, #0d6efd, #a855f7);
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s;
            font-family: inherit;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(13, 110, 253, 0.3);
        }
        footer {
            text-align: center;
            padding: 30px;
            background: #0b1a2e;
            color: #a0b8d0;
            margin-top: 50px;
            font-size: 0.95rem;
        }
        @media (max-width: 768px) {
            .contact-container { padding: 25px; margin: 20px; }
            h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo"><i class="fa-solid fa-bolt"></i> Bharat24Tools</div>
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Home</a>
</nav>

<div class="contact-container">
    <h2><i class="fa-solid fa-envelope"></i> Contact Us</h2>
    <p class="subtitle">If you have any questions, feedback, or need support, feel free to reach out. We typically respond within 24 hours.</p>
    
    <div class="contact-info">
        <p><i class="fa-solid fa-envelope"></i> <strong>Email:</strong> <a href="mailto:aloky7882@gmail.com">aloky7882@gmail.com</a></p>
        <p><i class="fa-solid fa-phone"></i> <strong>Phone:</strong> <a href="tel:+918881440719">+91 8881440719</a></p>
        <p><i class="fa-brands fa-whatsapp"></i> <strong>WhatsApp:</strong> <a href="https://wa.me/918881440719" target="_blank" class="wa-link">Chat on WhatsApp</a></p>
    </div>

    <form action="https://formsubmit.co/aloky7882@gmail.com" method="POST">
        <input type="hidden" name="_subject" value="New message from Bharat24Tools contact form">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <div class="form-group">
            <label>Your Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
            <label>Your Email</label>
            <input type="email" name="email" placeholder="Enter your email address" required>
        </div>
        <div class="form-group">
            <label>Message</label>
            <textarea name="message" rows="5" placeholder="Type your message here..." required></textarea>
        </div>
        <button type="submit" class="submit-btn"><i class="fa-solid fa-paper-plane"></i> Send Message</button>
    </form>
</div>

<footer>
    &copy; 2026 Bharat24Tools | Made with ❤️ in India by Alok
</footer>

</body>
</html>
