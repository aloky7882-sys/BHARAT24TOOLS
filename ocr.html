        es: { back: "Atrás", title: "🔎 OCR - Imagen a Texto", subtitle: "Extrae texto de imagen — 100+ idiomas", clickOrDrag: "Clic o arrastra", formatInfo: "Imagen (JPG, PNG, WebP — máx 10MB)", selectLang: "Idioma:", extractBtn: "Extraer Texto", copyBtn: "Copiar", downloadBtn: "Descargar .txt", resetBtn: "Otra Imagen", resultLabel: "Texto Extraído:", infoTitle: "Cómo:", infoText: "IA extrae texto de imagen. Primera vez 60-90 seg.", loading: "Extrayendo... 60-90 seg", success: "¡Texto extraído!", error: "Error: ", selectImage: "Selecciona imagen", tooBig: "Archivo grande", copied: "¡Copiado!", noText: "Sin texto" },
        pt: { back: "Voltar", title: "🔎 OCR - Imagem para Texto", subtitle: "Extraia texto de imagem — 100+ idiomas", clickOrDrag: "Clique ou arraste", formatInfo: "Imagem (JPG, PNG, WebP — máx 10MB)", selectLang: "Idioma:", extractBtn: "Extrair Texto", copyBtn: "Copiar", downloadBtn: "Baixar .txt", resetBtn: "Outra Imagem", resultLabel: "Texto Extraído:", infoTitle: "Como:", infoText: "IA extrai texto de imagem. Primeira vez 60-90 seg.", loading: "Extraindo... 60-90 seg", success: "Extraído!", error: "Erro: ", selectImage: "Selecione imagem", tooBig: "Arquivo grande", copied: "Copiado!", noText: "Sem texto" },
        fr: { back: "Retour", title: "🔎 OCR - Image en Texte", subtitle: "Extraire texte d'image — 100+ langues", clickOrDrag: "Cliquez ou glissez", formatInfo: "Image (JPG, PNG, WebP — max 10MB)", selectLang: "Langue:", extractBtn: "Extraire", copyBtn: "Copier", downloadBtn: "Télécharger .txt", resetBtn: "Autre Image", resultLabel: "Texte Extrait:", infoTitle: "Comment:", infoText: "IA extrait le texte. Première fois 60-90 sec.", loading: "Extraction... 60-90 sec", success: "Extrait!", error: "Erreur: ", selectImage: "Sélectionnez image", tooBig: "Fichier trop grand", copied: "Copié!", noText: "Pas de texte" },

        ar: { back: "رجوع", title: "🔎 OCR - صورة إلى نص", subtitle: "استخرج النص من الصورة — 100+ لغة", clickOrDrag: "انقر أو اسحب", formatInfo: "صورة (JPG, PNG, WebP — 10MB)", selectLang: "اللغة:", extractBtn: "استخراج النص", copyBtn: "نسخ", downloadBtn: "تحميل .txt", resetBtn: "صورة أخرى", resultLabel: "النص المستخرج:", infoTitle: "كيف:", infoText: "الذكاء الاصطناعي يستخرج النص. أول مرة 60-90 ثانية.", loading: "جاري الاستخراج... 60-90 ثانية", success: "تم!", error: "خطأ: ", selectImage: "اختر صورة", tooBig: "الملف كبير", copied: "تم النسخ!", noText: "لا يوجد نص" },
        ru: { back: "Назад", title: "🔎 OCR - Изображение в Текст", subtitle: "Извлеките текст — 100+ языков", clickOrDrag: "Нажмите или перетащите", formatInfo: "Изображение (JPG, PNG, WebP — макс 10MB)", selectLang: "Язык:", extractBtn: "Извлечь текст", copyBtn: "Копировать", downloadBtn: "Скачать .txt", resetBtn: "Другое изображение", resultLabel: "Извлечённый текст:", infoTitle: "Как:", infoText: "ИИ извлекает текст. Первый раз 60-90 сек.", loading: "Извлечение... 60-90 сек", success: "Извлечено!", error: "Ошибка: ", selectImage: "Выберите изображение", tooBig: "Файл слишком большой", copied: "Скопировано!", noText: "Нет текста" },
        id: { back: "Kembali", title: "🔎 OCR - Gambar ke Teks", subtitle: "Ekstrak teks dari gambar — 100+ bahasa", clickOrDrag: "Klik atau seret", formatInfo: "Gambar (JPG, PNG, WebP — maks 10MB)", selectLang: "Bahasa:", extractBtn: "Ekstrak Teks", copyBtn: "Salin", downloadBtn: "Unduh .txt", resetBtn: "Gambar Lain", resultLabel: "Teks Diekstrak:", infoTitle: "Cara:", infoText: "AI ekstrak teks. Pertama kali 60-90 detik.", loading: "Mengekstrak... 60-90 detik", success: "Berhasil!", error: "Kesalahan: ", selectImage: "Pilih gambar", tooBig: "File besar", copied: "Disalin!", noText: "Tidak ada teks" },
        "zh-CN": { back: "返回", title: "🔎 OCR - 图片转文字", subtitle: "从图片提取文字 — 100+ 语言", clickOrDrag: "点击或拖拽", formatInfo: "图片 (JPG, PNG, WebP — 最大 10MB)", selectLang: "语言:", extractBtn: "提取文字", copyBtn: "复制", downloadBtn: "下载 .txt", resetBtn: "换一张", resultLabel: "提取的文字:", infoTitle: "原理:", infoText: "AI 从图片提取文字。首次需 60-90 秒。", loading: "提取中... 60-90 秒", success: "成功!", error: "错误: ", selectImage: "请选择图片", tooBig: "文件太大", copied: "已复制!", noText: "没有文字" }
    };

    let currentLang = localStorage.getItem('lang') || 'en';

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('lang', lang);
        applyTranslations();
    }
    function applyTranslations() {
        const t = translations[currentLang] || translations.en;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.textContent = t[key];
        });
        document.getElementById('languageSelect').value = currentLang;
    }
    function t(key) {
        const tr = translations[currentLang] || translations.en;
        return tr[key] || key;
    }

    // App Logic
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const previewSection = document.getElementById('previewSection');
    const previewImg = document.getElementById('previewImg');
    const controls = document.getElementById('controls');
    const ocrLang = document.getElementById('ocrLang');
    const extractBtn = document.getElementById('extractBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultSection = document.getElementById('resultSection');
    const resultText = document.getElementById('resultText');
    const status = document.getElementById('status');

    let selectedFile = null;

    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('active'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('active'));
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('active');
        if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            showStatus('❌ ' + t('selectImage'), 'error');
            return;
        }
        if (file.size > 10 * 1024 * 1024) {
            showStatus('❌ ' + t('tooBig'), 'error');
            return;
        }
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            previewImg.src = e.target.result;
            previewSection.style.display = 'block';
            controls.style.display = 'block';
            extractBtn.style.display = 'flex';
            copyBtn.style.display = 'none';
            downloadBtn.style.display = 'none';
            resetBtn.style.display = 'none';
            resultSection.style.display = 'none';
            status.style.display = 'none';
        };
        reader.readAsDataURL(file);
    }

    extractBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        extractBtn.disabled = true;
        extractBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('loading');
        showStatus('⏳ ' + t('loading'), 'loading');
        resultSection.style.display = 'none';

        try {
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('lang', ocrLang.value);

            const res = await fetch(API_URL + '/ocr', {
                method: 'POST',
                body: formData
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(errText || 'Server error');
            }

            const text = await res.text();

            if (!text || text.trim().length === 0) {
                showStatus('⚠️ ' + t('noText'), 'error');
            } else {
                resultText.value = text;
                resultSection.style.display = 'block';
                showStatus('🎉 ' + t('success'), 'success');
                copyBtn.style.display = 'flex';
                downloadBtn.style.display = 'flex';
                resetBtn.style.display = 'flex';
                extractBtn.style.display = 'none';
            }
        } catch (err) {
            console.error(err);
            showStatus('❌ ' + t('error') + err.message, 'error');
        }

        extractBtn.disabled = false;
        extractBtn.innerHTML = '<i class="fas fa-magic"></i> ' + t('extractBtn');
    });

    copyBtn.addEventListener('click', () => {
        if (!resultText.value) return;
        navigator.clipboard.writeText(resultText.value).then(() => {
            const original = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fas fa-check"></i> ' + t('copied');
            setTimeout(() => { copyBtn.innerHTML = original; }, 1500);
        });
    });

    downloadBtn.addEventListener('click', () => {
        if (!resultText.value) return;
        const blob = new Blob([resultText.value], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'ocr-' + Date.now() + '.txt';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
    });

    resetBtn.addEventListener('click', () => {
        selectedFile = null;
        fileInput.value = '';
        previewSection.style.display = 'none';
        controls.style.display = 'none';
        resultSection.style.display = 'none';
        status.style.display = 'none';
        resultText.value = '';
    });

    function showStatus(msg, type) {
        status.textContent = msg;
        status.className = 'status ' + type;
        status.style.display = 'block';
    }

    applyTranslations();
</script>

</body>
</html>
