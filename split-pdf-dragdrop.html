<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Visual PDF Splitter - Bharat24Tools</title>
    
    <!-- ✅ PDF.js for rendering thumbnails -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body { min-height:100vh; background: linear-gradient(135deg, #0f0f1e 0%, #16213e 50%, #533483 100%); padding:30px 16px 60px; color:#e0e7ff; }
        header { background:rgba(15,15,30,0.95); padding:16px 24px; display:flex; align-items:center; gap:20px; border-bottom:2px solid rgba(168,85,247,0.3); position:sticky; top:0; z-index:100; margin:-30px -16px 30px; }
        header a { color:#cbd5e1; text-decoration:none; font-weight:600; padding:8px 12px; border-radius:6px; transition:all 0.3s; }
        header a:hover { color:#a855f7; background:rgba(168,85,247,0.1); }
        .brand { font-weight:800; font-size:1.3rem; background:linear-gradient(135deg, #a855f7, #ec4899); -webkit-background-clip:text; -webkit-text-fill-color:transparent; flex:1; }
        
        main { max-width:1000px; margin:0 auto; }
        h1 { font-size:2rem; text-align:center; margin-bottom:8px; font-weight:800; }
        .subtitle { text-align:center; color:#a5b4fc; margin-bottom:30px; font-size:0.95rem; }
        .card { background:rgba(30,27,75,0.9); border-radius:20px; padding:36px; border:1px solid rgba(168,85,247,0.3); box-shadow:0 20px 60px rgba(0,0,0,0.4); }
        
        /* Upload Zone */
        .upload-zone { border:3px dashed rgba(168,85,247,0.6); border-radius:16px; padding:50px 25px; text-align:center; cursor:pointer; transition:all 0.3s; background:rgba(99,102,241,0.05); position:relative; overflow:hidden; }
        .upload-zone:hover, .upload-zone.active { border-color:#a855f7; background:rgba(168,85,247,0.15); transform:translateY(-2px); }
        .upload-zone input { position:absolute; inset:0; opacity:0; cursor:pointer; }
        .upload-icon { font-size:3rem; color:#a855f7; margin-bottom:14px; }
        .upload-zone p { color:#cbd5e1; margin:6px 0; }
        .highlight { color:#e0e7ff; font-weight:700; }

        /* Loader */
        .loader-box { display:none; text-align:center; padding:40px 0; }
        .spinner { width:50px; height:50px; border:5px solid rgba(168,85,247,0.2); border-top-color:#a855f7; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 16px; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* Thumbnails Area */
        .controls { display:none; margin-top:24px; }
        
        .toolbar { display:flex; justify-content:space-between; align-items:center; background:rgba(15,15,30,0.6); padding:12px 20px; border-radius:12px; margin-bottom:20px; border:1px solid rgba(168,85,247,0.2); flex-wrap:wrap; gap:10px; }
        .toolbar-info { font-size:0.9rem; color:#a5b4fc; font-weight:600; }
        .toolbar-actions { display:flex; gap:8px; }
        .btn-small { background:rgba(168,85,247,0.2); border:1px solid rgba(168,85,247,0.4); color:#e0e7ff; padding:6px 12px; border-radius:6px; font-size:0.75rem; cursor:pointer; transition:all 0.2s; font-family:inherit; font-weight:600; }
        .btn-small:hover { background:#a855f7; color:#fff; }

        /* Grid */
        .pages-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:16px; max-height:500px; overflow-y:auto; padding:10px; background:rgba(0,0,0,0.2); border-radius:12px; margin-bottom:24px; }
        
        /* Individual Page */
        .page-item { position:relative; cursor:pointer; background:#fff; border-radius:8px; padding:8px; border:3px solid transparent; transition:all 0.2s; aspect-ratio: 1/1.4; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0.7; }
        .page-item:hover { opacity:1; transform:scale(1.02); }
        .page-item canvas { max-width:100%; max-height:100%; object-fit:contain; pointer-events:none; }
        .page-number { position:absolute; bottom:4px; background:rgba(0,0,0,0.6); color:#fff; font-size:0.65rem; padding:2px 6px; border-radius:10px; }
        
        /* Selected State */
        .page-item.selected { border-color:#a855f7; opacity:1; box-shadow:0 0 15px rgba(168,85,247,0.4); }
        .page-item.selected::after { content:'\f00c'; font-family:'FontAwesome'; position:absolute; top:6px; right:6px; background:#a855f7; color:#fff; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.6rem; }

        button.primary-btn { width:100%; padding:16px; background:linear-gradient(135deg,#a855f7,#ec4899); border:none; border-radius:12px; color:#fff; font-weight:700; font-size:1.05rem; cursor:pointer; font-family:inherit; transition:all 0.3s; display:flex; align-items:center; justify-content:center; gap:8px; }
        button.primary-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 10px 30px rgba(168,85,247,0.4); }
        button.primary-btn:disabled { opacity:0.6; cursor:not-allowed; }

        .status { display:none; margin-top:20px; padding:16px; border-radius:12px; text-align:center; font-weight:600; font-size:0.9rem; }
        .status.error { background:rgba(239,68,68,0.2); color:#fca5a5; display:block; border:1px solid rgba(239,68,68,0.3); }
        .status.success { background:rgba(34,197,94,0.2); color:#86efac; display:block; border:1px solid rgba(34,197,94,0.3); }
        
        @media(max-width:600px) {
            .card { padding:20px; }
            .pages-grid { grid-template-columns:repeat(auto-fill, minmax(90px, 1fr)); gap:10px; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html">← Back</a>
    <div class="brand">⚡ Bharat24Tools</div>
</header>

<main>
    <h1>✂️ Visual PDF Splitter</h1>
    <p class="subtitle">Click on pages to select, then extract them instantly.</p>

    <div class="card">
        <!-- Upload Zone -->
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon"><i class="fas fa-file-pdf"></i></div>
            <p><span class="highlight">Click to Browse</span> or Drag PDF here</p>
            <p style="font-size:0.8rem; opacity:0.7;">Max file size: 20MB</p>
            <input type="file" id="fileInput" accept=".pdf,application/pdf">
        </div>

        <!-- Loader -->
        <div class="loader-box" id="loaderBox">
            <div class="spinner"></div>
            <p>Generating page previews... Please wait.</p>
        </div>

        <!-- Main Controls -->
        <div class="controls" id="controls">
            
            <div class="toolbar">
                <div class="toolbar-info">
                    <i class="fas fa-check-circle" style="color:#a855f7;"></i> 
                    <span id="selectedCount">0</span> pages selected
                </div>
                <div class="toolbar-actions">
                    <button class="btn-small" id="selectAllBtn">Select All</button>
                    <button class="btn-small" id="clearAllBtn">Clear</button>
                    <button class="btn-small" id="oddBtn">Odd Pages</button>
                    <button class="btn-small" id="evenBtn">Even Pages</button>
                </div>
            </div>

            <!-- Thumbnails Grid -->
            <div class="pages-grid" id="pagesGrid">
                <!-- Pages will be injected here by PDF.js -->
            </div>

            <button class="primary-btn" id="splitBtn">
                <i class="fas fa-cut"></i> Extract Selected Pages
            </button>
        </div>

        <div class="status" id="status"></div>
    </div>
</main>

<script>
    // ✅ Set PDF.js Worker Source (Required for rendering)
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const API_URL = 'https://bharat24tools-api.onrender.com'; // Apna API URL check kar lein
    let selectedFile = null;
    let pdfDoc = null;
    let selectedPages = new Set(); // Stores selected page numbers (1-based)

    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const loaderBox = document.getElementById('loaderBox');
    const controls = document.getElementById('controls');
    const pagesGrid = document.getElementById('pagesGrid');
    const selectedCount = document.getElementById('selectedCount');
    const splitBtn = document.getElementById('splitBtn');
    const status = document.getElementById('status');

    // File Upload
    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('active'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('active'));
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('active');
        if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    async function handleFile(file) {
        if (!file.name.toLowerCase().endsWith('.pdf')) {
            showStatus('Please select a valid PDF file.', 'error');
            return;
        }
        if (file.size > 20 * 1024 * 1024) {
            showStatus('File is too large (Max 20MB).', 'error');
            return;
        }
        
        selectedFile = file;
        uploadZone.style.display = 'none';
        loaderBox.style.display = 'block';
        status.style.display = 'none';
        pagesGrid.innerHTML = '';
        selectedPages.clear();
        updateSelectedCount();

        try {
            // Read PDF using ArrayBuffer
            const arrayBuffer = await file.arrayBuffer();
            // Load into PDF.js
            pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            
            loaderBox.style.display = 'none';
            controls.style.display = 'block';

            // Render thumbnails
            renderThumbnails();
        } catch (error) {
            console.error("PDF load error:", error);
            loaderBox.style.display = 'none';
            uploadZone.style.display = 'block';
            showStatus('Could not read this PDF. It might be corrupted or password protected.', 'error');
        }
    }

    async function renderThumbnails() {
        pagesGrid.innerHTML = '';
        
        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
            const page = await pdfDoc.getPage(pageNum);
            
            // Render at a small scale for thumbnail
            const viewport = page.getViewport({ scale: 0.5 }); 
            
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page-item';
            pageDiv.dataset.page = pageNum;
            
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            
            const pageLabel = document.createElement('span');
            pageLabel.className = 'page-number';
            pageLabel.textContent = pageNum;

            pageDiv.appendChild(canvas);
            pageDiv.appendChild(pageLabel);
            pagesGrid.appendChild(pageDiv);

            // Render page to canvas
            await page.render({
                canvasContext: context,
                viewport: viewport
            }).promise;

            // Click event to toggle selection
            pageDiv.addEventListener('click', () => {
                if (selectedPages.has(pageNum)) {
                    selectedPages.delete(pageNum);
                    pageDiv.classList.remove('selected');
                } else {
                    selectedPages.add(pageNum);
                    pageDiv.classList.add('selected');
                }
                updateSelectedCount();
            });
        }
    }

    function updateSelectedCount() {
        selectedCount.textContent = selectedPages.size;
        splitBtn.disabled = selectedPages.size === 0;
    }

    // Toolbar Actions
    document.getElementById('selectAllBtn').addEventListener('click', () => {
        document.querySelectorAll('.page-item').forEach(el => {
            el.classList.add('selected');
            selectedPages.add(parseInt(el.dataset.page));
        });
        updateSelectedCount();
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
        document.querySelectorAll('.page-item').forEach(el => {
            el.classList.remove('selected');
        });
        selectedPages.clear();
        updateSelectedCount();
    });

    document.getElementById('oddBtn').addEventListener('click', () => {
        selectedPages.clear();
        document.querySelectorAll('.page-item').forEach(el => {
            const p = parseInt(el.dataset.page);
            if (p % 2 !== 0) {
                el.classList.add('selected');
                selectedPages.add(p);
            } else {
                el.classList.remove('selected');
            }
        });
        updateSelectedCount();
    });

    document.getElementById('evenBtn').addEventListener('click', () => {
        selectedPages.clear();
        document.querySelectorAll('.page-item').forEach(el => {
            const p = parseInt(el.dataset.page);
            if (p % 2 === 0) {
                el.classList.add('selected');
                selectedPages.add(p);
            } else {
                el.classList.remove('selected');
            }
        });
        updateSelectedCount();
    });

    // Split Action (Submit to Backend)
    splitBtn.addEventListener('click', async () => {
        if (!selectedFile || selectedPages.size === 0) return;

        splitBtn.disabled = true;
        splitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Extracting...';
        status.style.display = 'none';

        // Convert selected pages (Set) to a comma-separated string
        // e.g., "1,2,5,6"
        const ranges = Array.from(selectedPages).sort((a,b) => a-b).join(',');

        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('mode', 'custom');
        formData.append('ranges', ranges); // Backend will parse this

        try {
            const res = await fetch(API_URL + '/split-pdf', {
                method: 'POST',
                body: formData
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(errText);
            }

            // Download File
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'extracted-pages.pdf';
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 5000);

            showStatus('🎉 Success! Your pages have been extracted.', 'success');
        } catch (err) {
            console.error(err);
            showStatus('❌ Error: ' + (err.message || 'Server error occurred'), 'error');
        }

        splitBtn.disabled = false;
        splitBtn.innerHTML = '<i class="fas fa-cut"></i> Extract Selected Pages';
    });

    function showStatus(msg, type) {
        status.textContent = msg;
        status.className = 'status ' + type;
        status.style.display = 'block';
    }
</script>
</body>
</html>
