<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Split PDF - Bharat24Tools</title>
    
    <!-- 🟢 MOST RELIABLE CDN (jsDelivr - India me best chalta hai) -->
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.min.js"></script>
    <script>
        // Version 2.16 is highly stable for local/browser rendering
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.worker.min.js';
        }
    </script>

    <style>
        :root {
            --bg-dark: #0f0f1e;
            --bg-card: rgba(30, 27, 75, 0.95);
            --primary: #a855f7;
            --primary-hover: #9333ea;
            --accent: #6366f1;
            --text-main: #ffffff;
            --text-muted: #a5b4fc;
            --border-color: rgba(168, 85, 247, 0.3);
            --success: #86efac;
            --error: #fca5a5;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
        
        body { 
            background: linear-gradient(135deg, var(--bg-dark), #533483); 
            min-height: 100vh; 
            color: var(--text-main); 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container { 
            width: 100%;
            max-width: 900px; 
            background: var(--bg-card); 
            border-radius: 24px; 
            padding: 35px; 
            border: 1px solid var(--border-color); 
            position: relative; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            backdrop-filter: blur(10px);
        }
        
        h1 { color: var(--primary); text-align: center; margin-bottom: 8px; font-size: 1.8rem; font-weight: 800; }
        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 25px; font-size: 0.95rem; }
        
        .lang-select { 
            position: absolute; top: 25px; right: 25px; background: var(--primary); color: #fff; 
            border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; 
            font-weight: 600; z-index: 10; outline: none; font-size: 0.85rem; 
        }

        /* Dropzone */
        .dropzone { 
            display: block; border: 3px dashed rgba(168, 85, 247, 0.6); 
            border-radius: 16px; padding: 45px 20px; text-align: center; 
            cursor: pointer; transition: all 0.3s ease; 
            background: rgba(99, 102, 241, 0.05); position: relative; overflow: hidden;
        }
        .dropzone:hover, .dropzone.dragover { border-color: var(--primary); background: rgba(168,85,247,0.1); }
        .dropzone .icon { font-size: 3rem; margin-bottom: 15px; display: inline-block; }
        .dropzone .text { color: var(--text-main); font-size: 1.1rem; font-weight: 600; margin-bottom: 5px; }
        .dropzone .hint { color: var(--text-muted); font-size: 0.85rem; }
        #fileInput { display: none; }
        
        /* File Info */
        .file-info { margin-top: 20px; padding: 15px 20px; background: rgba(99,102,241,0.15); border-radius: 12px; border-left: 4px solid var(--success); display: none; }
        .file-info.show { display: block; }
        .file-info .name { color: var(--success); font-weight: 700; font-size: 1.1rem; word-break: break-all; }
        
        /* Tabs */
        .tabs { display: none; gap: 10px; margin: 25px 0; }
        .tab { 
            flex: 1; padding: 14px 10px; background: rgba(99,102,241,0.1); 
            border: 2px solid transparent; border-radius: 12px; cursor: pointer; 
            text-align: center; font-weight: 700; color: var(--text-muted); font-size: 0.95rem; 
        }
        .tab.active { background: rgba(168,85,247,0.2); border-color: var(--primary); color: #fff; }
        
        /* Panels */
        .mode-panel { display: none; }
        .mode-panel.active { display: block; }
        
        /* Visual Mode */
        .thumbnails { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; max-height: 450px; overflow-y: auto; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 16px; }
        .page-thumb { position: relative; cursor: pointer; border: 3px solid transparent; border-radius: 10px; overflow: hidden; background: #fff; transition: all 0.2s; aspect-ratio: 3/4; display: flex; align-items: center; justify-content: center; }
        .page-thumb.selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(168,85,247,0.4); }
        .page-thumb canvas { width: 100%; height: 100%; display: block; object-fit: contain; }
        .page-thumb .page-num { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.8); color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; z-index: 2; }
        .page-thumb .check { position: absolute; top: 6px; left: 6px; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.9); border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--primary); font-weight: 900; opacity: 0; z-index: 2; }
        .page-thumb.selected .check { background: var(--primary); color: #fff; opacity: 1; }
        .thumb-loading { position: absolute; width: 20px; height: 20px; border: 2px solid #ccc; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }

        /* Controls */
        .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        .btn-secondary { background: rgba(99,102,241,0.2); color: var(--text-muted); border: 1px solid rgba(99,102,241,0.4); }
        .btn-secondary:hover { background: rgba(99,102,241,0.4); color: #fff; }
        
        .input-group { margin: 20px 0; }
        .input-group label { display: block; color: var(--text-muted); margin-bottom: 8px; font-size: 0.95rem; font-weight: 600; }
        .input-group input { width: 100%; padding: 16px; background: rgba(0,0,0,0.4); border: 2px solid rgba(168,85,247,0.3); border-radius: 12px; color: #fff; font-size: 1.1rem; font-family: 'Courier New', monospace; }
        .input-group input:focus { outline: none; border-color: var(--primary); }
        
        .live-preview-box { margin-top: 15px; padding: 18px; border-radius: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(168,85,247,0.2); font-size: 1rem; font-weight: 600; text-align: center; }
        
        /* Action Button */
        .split-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; border: none; border-radius: 14px; font-size: 1.15rem; font-weight: 800; cursor: pointer; margin-top: 25px; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(168,85,247,0.3); }
        .split-btn:hover:not(:disabled) { transform: translateY(-3px); }
        .split-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
        
        /* Status Alert */
        .status { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 0.95rem; display: none; text-align: center; font-weight: 600; }
        .status.show { display: block; }
        .status.info { background: rgba(99,102,241,0.15); color: var(--text-muted); border: 1px solid rgba(99,102,241,0.3); }
        .status.error { background: rgba(239,68,68,0.15); color: var(--error); border: 1px solid rgba(239,68,68,0.3); }
        .status.success { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid rgba(34,197,94,0.3); }
        
        .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
  
  <select class="lang-select" id="langSelect">
    <option value="en">🇬🇧 English</option>
    <option value="hi">🇮🇳 हिंदी (Hindi)</option>
  </select>

  <h1>✂️ Split PDF</h1>
  <p class="subtitle">Split PDF into pages — Visual, Manual or Fixed</p>

  <label class="dropzone" id="dropzone">
    <div class="icon">📄</div>
    <div class="text" data-i18n="dropText">Drop file here or click to browse</div>
    <div class="hint" data-i18n="dropHint">Max 20MB • PDF only</div>
    <input type="file" id="fileInput" accept=".pdf,application/pdf">
  </label>

  <div class="file-info" id="fileInfo">
    <div class="name" id="fileName">-</div>
    <div style="color:var(--text-muted); font-size:0.85rem; margin-top:4px;">
      <span id="pageCount">-</span> <span data-i18n="pages">pages</span> • <span id="fileSize">-</span>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-mode="custom" onclick="setMode('custom')">✋ Visual</div>
    <div class="tab" data-mode="manual" onclick="setMode('manual')">✏️ Manual</div>
    <div class="tab" data-mode="fixed" onclick="setMode('fixed')">⚡ Fixed</div>
  </div>

  <!-- VISUAL MODE -->
  <div class="mode-panel active" id="panel-custom">
    <div class="controls">
      <button class="btn btn-secondary" onclick="selectAll()">Select All</button>
      <button class="btn btn-secondary" onclick="clearAll()">Clear All</button>
      <span style="margin-left:auto; padding-top:10px;"><span id="selectedCount" style="color:var(--success); font-weight:800; font-size:1.1rem;">0</span> selected</span>
    </div>
    <div class="thumbnails" id="thumbnails">
      <div style="color:var(--text-muted); padding:30px; text-align:center; grid-column: 1/-1;">Please upload a PDF to see pages</div>
    </div>
    <div class="live-preview-box" id="visualPreview">
      <span style="color:var(--error);">Select at least 1 page</span>
    </div>
  </div>

  <!-- MANUAL MODE -->
  <div class="mode-panel" id="panel-manual">
    <div class="input-group">
      <label>Enter pages (e.g., 1-3, 5, 8-10 or 'all')</label>
      <input type="text" id="manualRanges" placeholder="1-3, 5" autocomplete="off">
    </div>
    <div class="live-preview-box" id="manualPreview">
      <span style="color:#6b7280;">Type page numbers to see preview...</span>
    </div>
  </div>

  <!-- FIXED MODE -->
  <div class="mode-panel" id="panel-fixed">
    <div class="input-group">
      <label>Pages per split file?</label>
      <input type="number" id="fixedSize" min="1" value="1">
    </div>
    <div class="live-preview-box" id="fixedPreview">
      <span style="color:#6b7280;">Enter number to see preview...</span>
    </div>
  </div>

  <button class="split-btn" id="splitBtn" onclick="doSplit()" disabled>✂️ Split PDF</button>
  <div class="status" id="status"></div>
</div>

<script>
// Aapka Backend URL
const API_URL = "https://bharat24tools-api.onrender.com/split-pdf"; 

let currentFile = null;
let totalPages = 0;
let selectedPages = new Set();
let currentMode = 'custom';
let pdfDoc = null;

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');

dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => { 
    e.preventDefault(); 
    dropzone.classList.remove('dragover'); 
    if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        handleFile(e.dataTransfer.files[0]); 
    }
});
fileInput.addEventListener('change', e => { if (e.target.files.length) handleFile(e.target.files[0]); });

function resetUI() {
    selectedPages.clear();
    document.getElementById('manualRanges').value = '';
    document.getElementById('fixedSize').value = '1';
    document.getElementById('thumbnails').innerHTML = '';
    document.getElementById('selectedCount').textContent = '0';
    document.getElementById('fileInfo').classList.remove('show');
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('splitBtn').disabled = true;
    document.getElementById('manualPreview').innerHTML = `<span style="color:#6b7280;">Type page numbers to see preview...</span>`;
    document.getElementById('fixedPreview').innerHTML = `<span style="color:#6b7280;">Enter number to see preview...</span>`;
    document.getElementById('visualPreview').innerHTML = `<span style="color:var(--error);">Select at least 1 page</span>`;
    hideStatus();
}

async function handleFile(file) {
  if (!file.name.toLowerCase().endsWith('.pdf')) return showStatus('error', 'Only PDF files allowed!');
  if (file.size > 20 * 1024 * 1024) return showStatus('error', 'File too large (max 20MB)');

  resetUI();
  currentFile = file;
  pdfDoc = null;
  totalPages = 0;

  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileSize').textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
  document.getElementById('fileInfo').classList.add('show');
  document.getElementById('tabs').style.display = 'flex';
  document.getElementById('splitBtn').disabled = false;
  
  document.getElementById('thumbnails').innerHTML = `<div style="color:var(--text-muted); padding:30px; text-align:center; grid-column:1/-1;"><span class="spinner"></span> Loading PDF...</div>`;
  showStatus('info', 'Loading PDF pages...');

  try {
    const arrayBuffer = await file.arrayBuffer();
    
    // 🟢 SMART AUTO-FALLBACK SYSTEM
    // 1. Pehle normal (Worker ke sath) load karega
    try {
        pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    } catch (err1) {
        console.warn("Normal load failed, trying fallback (disableWorker)...", err1);
        // 2. Agar fail hua, toh Worker disable karke try karega (kuch PDFs ke liye)
        const arrayBuffer2 = await file.arrayBuffer(); // Fresh buffer
        pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer2, disableWorker: true }).promise;
    }
    
    totalPages = pdfDoc.numPages;
    document.getElementById('pageCount').textContent = totalPages;
    
    await renderThumbnails();
    hideStatus();
    updateLivePreview();
  } catch (err) {
    console.error('All PDF load attempts failed:', err);
    
    // 3. Agar phir bhi fail ho, toh Manual mode open kar do
    totalPages = 1; // Fake number so manual works
    document.getElementById('pageCount').textContent = '?';
    setMode('manual');
    document.getElementById('thumbnails').innerHTML = '<div style="color:var(--error); padding:30px; text-align:center; grid-column:1/-1;">Aapki PDF ka preview load nahi ho paya (File format issue).<br><br>Kripya <b>Manual Tab</b> me page number type karke split karein.</div>';
    showStatus('error', '⚠️ Visual preview failed. Please use Manual mode to split.');
  }
}

async function renderThumbnails() {
  const container = document.getElementById('thumbnails');
  container.innerHTML = '';
  
  for (let i = 1; i <= totalPages; i++) {
    const div = document.createElement('div');
    div.className = 'page-thumb';
    div.dataset.page = i;
    
    const spinner = document.createElement('div');
    spinner.className = 'thumb-loading';
    div.appendChild(spinner);
    
    div.innerHTML += `<div class="check">✓</div><div class="page-num">${i}</div>`;
    div.addEventListener('click', () => togglePage(i, div));
    container.appendChild(div);

    try {
      const page = await pdfDoc.getPage(i);
      const viewport = page.getViewport({ scale: 0.8 }); 
      
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      
      spinner.remove();
      div.insertBefore(canvas, div.firstChild);
      
      // Delay for memory
      await new Promise(r => setTimeout(r, 10));
      
    } catch (e) {
      console.error('Page render error:', i, e);
      spinner.remove();
      // Blank white box ki jagah error icon dikhao
      div.innerHTML = '<span style="color:#999;font-size:10px;text-align:center;">No Image</span>' + div.innerHTML;
    }
  }
  updateSelectedCount();
}

function togglePage(num, el) {
  if (selectedPages.has(num)) { selectedPages.delete(num); el.classList.remove('selected'); }
  else { selectedPages.add(num); el.classList.add('selected'); }
  updateSelectedCount();
}

function selectAll() { 
  document.querySelectorAll('.page-thumb').forEach(el => { selectedPages.add(parseInt(el.dataset.page)); el.classList.add('selected'); }); 
  updateSelectedCount();
}

function clearAll() { 
  selectedPages.clear(); document.querySelectorAll('.page-thumb').forEach(el => el.classList.remove('selected')); 
  updateSelectedCount();
}

function updateSelectedCount() { 
    document.getElementById('selectedCount').textContent = selectedPages.size; 
    updateLivePreview();
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + mode).classList.add('active');
  updateLivePreview();
}

function parseRanges(input, max) {
  const pages = new Set();
  const trimmed = input.trim().toLowerCase();
  if (!trimmed) return pages;
  if (trimmed === 'all' || trimmed === '*') { for (let i = 1; i <= max; i++) pages.add(i); return pages; }
  for (const part of trimmed.split(',')) {
    const p = part.trim();
    if (!p) continue;
    if (p.includes('-')) {
      const [a, b] = p.split('-').map(x => parseInt(x.trim(), 10));
      if (!isNaN(a) && !isNaN(b)) { for (let i = Math.max(1, Math.min(a, b)); i <= Math.min(max, Math.max(a, b)); i++) pages.add(i); }
    } else {
      const n = parseInt(p, 10);
      if (!isNaN(n) && n >= 1 && n <= max) pages.add(n);
    }
  }
  return pages;
}

function buildRangesFromSet(set) {
  const sorted = [...set].sort((a, b) => a - b);
  if (!sorted.length) return '';
  const ranges = [];
  let start = sorted[0], end = sorted[0];
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i] === end + 1) end = sorted[i];
    else { ranges.push(start === end ? `${start}` : `${start}-${end}`); start = end = sorted[i]; }
  }
  ranges.push(start === end ? `${start}` : `${start}-${end}`);
  return ranges.join(',');
}

function updateLivePreview() {
  const visualPrev = document.getElementById('visualPreview');
  const manualPrev = document.getElementById('manualPreview');
  const fixedPrev = document.getElementById('fixedPreview');
  const max = totalPages || 10000;

  if (currentMode === 'custom') {
    if (selectedPages.size === 0) { visualPrev.innerHTML = `<span style="color:var(--error);">Select at least 1 page</span>`; }
    else { visualPrev.innerHTML = `<span style="color:var(--success);">✅ Will extract ${selectedPages.size} pages → <b>${buildRangesFromSet(selectedPages)}</b></span>`; }
  }

  if (currentMode === 'manual') {
    const input = document.getElementById('manualRanges').value.trim();
    if (!input) { manualPrev.innerHTML = `<span style="color:#6b7280;">Type page numbers to see preview...</span>`; }
    else {
      const pages = parseRanges(input, max);
      if (pages.size === 0) { manualPrev.innerHTML = `<span style="color:var(--error);">❌ Invalid pages or out of range!</span>`; }
      else { manualPrev.innerHTML = `<span style="color:var(--success);">✅ Will extract ${pages.size} pages → <b>${buildRangesFromSet(pages)}</b></span>`; }
    }
  }

  if (currentMode === 'fixed') {
    const sizeInput = parseInt(document.getElementById('fixedSize').value, 10);
    if (isNaN(sizeInput) || sizeInput < 1) { fixedPrev.innerHTML = `<span style="color:var(--error);">❌ Invalid number</span>`; }
    else if (!totalPages) { fixedPrev.innerHTML = `<span style="color:#6b7280;">Upload PDF to see preview...</span>`; }
    else {
      const numFiles = Math.ceil(totalPages / sizeInput);
      let html = `<span style="color:var(--success);">✅ Will create ${numFiles} PDF files</span><br>`;
      let previewText = [];
      for (let i = 0; i < Math.min(numFiles, 3); i++) {
        let start = (i * sizeInput) + 1;
        let end = Math.min((i + 1) * sizeInput, totalPages);
        previewText.push(`File ${i + 1}: Pages ${start} to ${end}`);
      }
      if (numFiles > 3) previewText.push("...and more");
      html += `<div style="font-size:0.85rem; color:var(--text-muted); margin-top:8px;">${previewText.join('<br>')}</div>`;
      fixedPrev.innerHTML = html;
    }
  }
}

document.getElementById('manualRanges').addEventListener('input', updateLivePreview);
document.getElementById('fixedSize').addEventListener('input', updateLivePreview);

async function doSplit() {
  if (!currentFile) return showStatus('error', 'Please select a PDF first');
  
  const formData = new FormData();
  formData.append('file', currentFile);

  if (currentMode === 'custom') {
    if (selectedPages.size === 0) return showStatus('error', 'Please select at least one page');
    formData.append('mode', 'custom');
    formData.append('ranges', buildRangesFromSet(selectedPages));
  } else if (currentMode === 'manual') {
    const input = document.getElementById('manualRanges').value.trim();
    if (!input) return showStatus('error', 'Please enter valid page numbers');
    formData.append('mode', 'custom');
    formData.append('ranges', input);
  } else {
    formData.append('mode', 'fixed');
    formData.append('fixed_size', document.getElementById('fixedSize').value || '1');
  }

  const btn = document.getElementById('splitBtn');
  btn.disabled = true;
  showStatus('info', '<span class="spinner"></span> Uploading and splitting...');

  try {
    const res = await fetch(API_URL, { method: 'POST', body: formData });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(text || `Server Error (${res.status})`);
    }
    const blob = await res.blob();
    const cd = res.headers.get('Content-Disposition') || '';
    let filename = 'split.pdf';
    const match = cd.match(/filename="?([^";]+)"?/);
    if (match) filename = match[1];

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showStatus('success', '✅ Split complete! Download started.');
  } catch (err) {
    console.error('Split error:', err);
    let msg = err.message;
    if (msg.includes('Failed to fetch') || msg.includes('NetworkError')) { 
      msg = "Network error. Server is waking up, please try again in 1 min."; 
    }
    showStatus('error', '❌ ' + msg);
  } finally { btn.disabled = false; }
}

function showStatus(type, msg) { 
    const s = document.getElementById('status'); 
    s.className = 'status show ' + type; 
    s.innerHTML = msg; 
}
function hideStatus() { 
    document.getElementById('status').classList.remove('show'); 
}
</script>
</body>
</html>
