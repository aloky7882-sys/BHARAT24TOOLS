<main>

<script>
    const API_URL = 'https://bharat24tools-api.onrender.com';

    const translations = {
        en: { back: "Back", title: "✏️ Image to Sketch", subtitle: "Convert photo to pencil sketch — AI effect", clickOrDrag: "Click or Drag", formatInfo: "Image file (JPG, PNG, WebP — max 15MB)", sketchBtn: "Convert to Sketch", downloadBtn: "Download", resetBtn: "Try Another Image", infoTitle: "How it works:", infoText: "OpenCV creates pencil sketch effect. 100% free.", loading: "Creating sketch...", success: "Sketch created successfully!", error: "Error: ", selectImage: "Please select an image", tooBig: "File too large (max 15MB)" },
        hi: { back: "वापस", title: "✏️ Image से Sketch", subtitle: "Photo को pencil sketch में बदलो", clickOrDrag: "Click करो या Drag करो", formatInfo: "Image (JPG, PNG, WebP — max 15MB)", sketchBtn: "Sketch बनाओ", downloadBtn: "डाउनलोड", resetBtn: "दूसरी try करो", infoTitle: "कैसे:", infoText: "OpenCV pencil sketch effect बनाता है।", loading: "Sketch बन रहा है...", success: "Sketch बन गया!", error: "एरर: ", selectImage: "कृपया image चुनें", tooBig: "File 15MB से बड़ी" },
        es: { back: "Atrás", title: "✏️ Imagen a Boceto", subtitle: "Convierte foto a boceto", clickOrDrag: "Clic o arrastra", formatInfo: "Imagen (JPG, PNG, WebP — máx 15MB)", sketchBtn: "Convertir a Boceto", downloadBtn: "Descargar", resetBtn: "Otra Imagen", infoTitle: "Cómo:", infoText: "OpenCV crea efecto boceto.", loading: "Creando...", success: "¡Creado!", error: "Error: ", selectImage: "Selecciona imagen", tooBig: "Archivo grande" },
        pt: { back: "Voltar", title: "✏️ Imagem para Esboço", subtitle: "Converta foto em esboço", clickOrDrag: "Clique ou arraste", formatInfo: "Imagem (JPG, PNG, WebP — máx 15MB)", sketchBtn: "Converter em Esboço", downloadBtn: "Baixar", resetBtn: "Outra Imagem", infoTitle: "Como:", infoText: "OpenCV cria efeito esboço.", loading: "Criando...", success: "Criado!", error: "Erro: ", selectImage: "Selecione imagem", tooBig: "Arquivo grande" },
        fr: { back: "Retour", title: "✏️ Image en Croquis", subtitle: "Convertissez photo en croquis", clickOrDrag: "Cliquez ou glissez", formatInfo: "Image (JPG, PNG, WebP — max 15MB)", sketchBtn: "Convertir en Croquis", downloadBtn: "Télécharger", resetBtn: "Autre Image", infoTitle: "Comment:", infoText: "OpenCV crée effet croquis.", loading: "Création...", success: "Créé!", error: "Erreur: ", selectImage: "Sélectionnez image", tooBig: "Fichier trop grand" },
        de: { back: "Zurück", title: "✏️ Bild zu Skizze", subtitle: "Foto in Skizze umwandeln", clickOrDrag: "Klick oder ziehe", formatInfo: "Bild (JPG, PNG, WebP — max 15MB)", sketchBtn: "In Skizze", downloadBtn: "Herunterladen", resetBtn: "Anderes Bild", infoTitle: "Wie:", infoText: "OpenCV erstellt Skizzeneffekt.", loading: "Erstellung...", success: "Erstellt!", error: "Fehler: ", selectImage: "Bild wählen", tooBig: "Datei zu groß" },
        ar: { back: "رجوع", title: "✏️ صورة إلى رسم", subtitle: "حول الصورة إلى رسم بالقلم", clickOrDrag: "انقر أو اسحب", formatInfo: "صورة (JPG, PNG, WebP — 15MB)", sketchBtn: "تحويل إلى رسم", downloadBtn: "تحميل", resetBtn: "صورة أخرى", infoTitle: "كيف:", infoText: "OpenCV ينشئ تأثير الرسم.", loading: "جاري الإنشاء...", success: "تم!", error: "خطأ: ", selectImage: "اختر صورة", tooBig: "الملف كبير" },
        ru: { back: "Назад", title: "✏️ Изображение в Эскиз", subtitle: "Преобразуйте фото в эскиз", clickOrDrag: "Нажмите или перетащите", formatInfo: "Изображение (JPG, PNG, WebP — макс 15MB)", sketchBtn: "В Эскиз", downloadBtn: "Скачать", resetBtn: "Другое изображение", infoTitle: "Как:", infoText: "OpenCV создаёт эффект эскиза.", loading: "Создание...", success: "Готово!", error: "Ошибка: ", selectImage: "Выберите изображение", tooBig: "Файл слишком большой" },
        id: { back: "Kembali", title: "✏️ Gambar ke Sketsa", subtitle: "Konversi foto ke sketsa", clickOrDrag: "Klik atau seret", formatInfo: "Gambar (JPG, PNG, WebP — maks 15MB)", sketchBtn: "Konversi ke Sketsa", downloadBtn: "Unduh", resetBtn: "Gambar Lain", infoTitle: "Cara:", infoText: "OpenCV buat efek sketsa.", loading: "Membuat...", success: "Berhasil!", error: "Kesalahan: ", selectImage: "Pilih gambar", tooBig: "File besar" },
        "zh-CN": { back: "返回", title: "✏️ 图片转素描", subtitle: "将照片转换为素描", clickOrDrag: "点击或拖拽", formatInfo: "图片 (JPG, PNG, WebP — 最大 15MB)", sketchBtn: "转换为素描", downloadBtn: "下载", resetBtn: "换一张", infoTitle: "原理:", infoText: "OpenCV 创建素描效果。", loading: "创建中...", success: "成功!", error: "错误: ", selectImage: "请选择图片", tooBig: "文件太大" }
    };

    let currentLang = localStorage.getItem('lang') || 'en';

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('lang', lang);
        applyTranslations();
    }
    function applyTranslations() {
        const t = translations[currentLang] || translations.en;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.textContent = t[key];
        });
        document.getElementById('languageSelect').value = currentLang;
    }
    function t(key) {
        const tr = translations[currentLang] || translations.en;
        return tr[key] || key;
    }

    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const previewSection = document.getElementById('previewSection');
    const previewImg = document.getElementById('previewImg');
    const controls = document.getElementById('controls');
    const sketchBtn = document.getElementById('sketchBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const status = document.getElementById('status');

    let selectedFile = null;
    let resultBlob = null;

    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('active'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('active'));
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('active');
        if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            showStatus('❌ ' + t('selectImage'), 'error');
            return;
        }
        if (file.size > 15 * 1024 * 1024) {
            showStatus('❌ ' + t('tooBig'), 'error');
            return;
        }
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            previewImg.src = e.target.result;
            previewSection.style.display = 'block';
            controls.style.display = 'block';
            sketchBtn.style.display = 'flex';
            downloadBtn.style.display = 'none';
            resetBtn.style.display = 'none';
            status.style.display = 'none';
        };
        reader.readAsDataURL(file);
    }

    sketchBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        sketchBtn.disabled = true;
        sketchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('loading');
        showStatus('⏳ ' + t('loading'), 'loading');

        try {
            const formData = new FormData();
            formData.append('file', selectedFile);

            const res = await fetch(API_URL + '/image-to-sketch', {
                method: 'POST',
                body: formData
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(errText || 'Server error');
            }

            resultBlob = await res.blob();
            const url = URL.createObjectURL(resultBlob);
            previewImg.src = url;

            showStatus('🎉 ' + t('success'), 'success');
            downloadBtn.style.display = 'flex';
            resetBtn.style.display = 'flex';
            sketchBtn.style.display = 'none';
        } catch (err) {
            console.error(err);
            showStatus('❌ ' + t('error') + err.message, 'error');
        }

        sketchBtn.disabled = false;
        sketchBtn.innerHTML = '<i class="fas fa-magic"></i> ' + t('sketchBtn');
    });

    downloadBtn.addEventListener('click', () => {
        if (!resultBlob) return;
        const url = URL.createObjectURL(resultBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'sketch-' + Date.now() + '.png';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
    });

    resetBtn.addEventListener('click', () => {
        selectedFile = null;
        resultBlob = null;
        fileInput.value = '';
        previewSection.style.display = 'none';
        controls.style.display = 'none';
        status.style.display = 'none';
    });

    function showStatus(msg, type) {
        status.textContent = msg;
        status.className = 'status ' + type;
        status.style.display = 'block';
    }

    applyTranslations();
</script>
