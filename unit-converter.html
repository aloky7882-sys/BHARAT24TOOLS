<body>

<div class="wrapper">
    <div class="page-header">
        <h1><i class="fa-solid fa-right-left"></i> Unit Converter</h1>
        <p>Convert length, weight, temperature, speed and data storage — instantly.</p>
    </div>

    <div class="category-tabs" id="categoryTabs"></div>

    <div class="panel">
        <div class="convert-row">
            <div class="field">
                <label>From</label>
                <input type="number" id="fromValue" value="1">
                <select id="fromUnit"></select>
            </div>

            <button class="swap-btn" id="swapBtn"><i class="fa-solid fa-arrow-right-arrow-left"></i></button>

            <div class="field">
                <label>To</label>
                <input type="number" id="toValue" readonly>
                <select id="toUnit"></select>
            </div>
        </div>

        <div class="result-line" id="resultLine"></div>
    </div>

    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
</div>

<script>
    const categories = {
        length: {
            label: "Length",
            icon: "fa-ruler",
            base: "meter",
            units: {
                millimeter: 0.001,
                centimeter: 0.01,
                meter: 1,
                kilometer: 1000,
                inch: 0.0254,
                foot: 0.3048,
                yard: 0.9144,
                mile: 1609.34
            }
        },
        weight: {
            label: "Weight",
            icon: "fa-weight-hanging",
            base: "kilogram",
            units: {
                milligram: 0.000001,
                gram: 0.001,
                kilogram: 1,
                tonne: 1000,
                ounce: 0.0283495,
                pound: 0.453592
            }
        },
        temperature: {
            label: "Temperature",
            icon: "fa-temperature-half",
            base: "celsius",
            units: {
                celsius: "c",
                fahrenheit: "f",
                kelvin: "k"
            }
        },
        speed: {
            label: "Speed",
            icon: "fa-gauge-high",
            base: "kmh",
            units: {
                kmh: 1,
                mph: 1.60934,
                ms: 3.6,
                knot: 1.852
            }
        },
        data: {
            label: "Data Storage",
            icon: "fa-database",
            base: "megabyte",
            units: {
                bit: 0.000000125,
                byte: 0.000001,
                kilobyte: 0.001,
                megabyte: 1,
                gigabyte: 1000,
                terabyte: 1000000
            }
        }
    };

    const unitLabels = {
        millimeter: "Millimeter (mm)",
        centimeter: "Centimeter (cm)",
        meter: "Meter (m)",
        kilometer: "Kilometer (km)",
        inch: "Inch (in)",
        foot: "Foot (ft)",
        yard: "Yard (yd)",
        mile: "Mile (mi)",
        milligram: "Milligram (mg)",
        gram: "Gram (g)",
        kilogram: "Kilogram (kg)",
        tonne: "Tonne (t)",
        ounce: "Ounce (oz)",
        pound: "Pound (lb)",
        celsius: "Celsius (°C)",
        fahrenheit: "Fahrenheit (°F)",
        kelvin: "Kelvin (K)",
        kmh: "Km/h",
        mph: "Mph",
        ms: "Meter/sec",
        knot: "Knot",
        bit: "Bit",
        byte: "Byte",
        kilobyte: "Kilobyte (KB)",
        megabyte: "Megabyte (MB)",
        gigabyte: "Gigabyte (GB)",
        terabyte: "Terabyte (TB)"
    };

    let currentCategory = "length";

    const categoryTabs = document.getElementById("categoryTabs");
    const fromUnit = document.getElementById("fromUnit");
    const toUnit = document.getElementById("toUnit");
    const fromValue = document.getElementById("fromValue");
    const toValue = document.getElementById("toValue");
    const resultLine = document.getElementById("resultLine");
    const swapBtn = document.getElementById("swapBtn");

    function renderTabs(){
        categoryTabs.innerHTML = "";
        Object.keys(categories).forEach(key => {
            const btn = document.createElement("button");
            btn.innerHTML = `<i class="fa-solid ${categories[key].icon}"></i> ${categories[key].label}`;
            if(key === currentCategory) btn.classList.add("active");

            btn.addEventListener("click", function(){
                currentCategory = key;
                renderTabs();
                renderUnits();
                convert();
            });

            categoryTabs.appendChild(btn);
        });
    }

    function renderUnits(){
        const units = Object.keys(categories[currentCategory].units);
        fromUnit.innerHTML = units.map(u => `<option value="${u}">${unitLabels[u]}</option>`).join("");
        toUnit.innerHTML = units.map(u => `<option value="${u}">${unitLabels[u]}</option>`).join("");
        fromUnit.value = units[0];
        toUnit.value = units.length > 1 ? units[1] : units[0];
    }

    function convertTemperature(value, from, to){
        let celsius;
        if(from === "celsius") celsius = value;
        else if(from === "fahrenheit") celsius = (value - 32) * 5/9;
        else celsius = value - 273.15;

        if(to === "celsius") return celsius;
        if(to === "fahrenheit") return celsius * 9/5 + 32;
        return celsius + 273.15;
    }

    function convert(){
        const val = parseFloat(fromValue.value);
        if(isNaN(val)){
            toValue.value = "";
            resultLine.innerText = "";
            return;
        }

        const from = fromUnit.value;
        const to = toUnit.value;
        let result;

        if(currentCategory === "temperature"){
            result = convertTemperature(val, from, to);
        } else {
            const units = categories[currentCategory].units;
            const baseValue = val * units[from];
            result = baseValue / units[to];
        }

        const rounded = Math.round(result * 100000) / 100000;
        toValue.value = rounded;
        resultLine.innerHTML = `<b>${val} ${unitLabels[from]}</b> = <b>${rounded} ${unitLabels[to]}</b>`;
    }

    swapBtn.addEventListener("click", function(){
        const f = fromUnit.value;
        const t = toUnit.value;
        fromUnit.value = t;
        toUnit.value = f;
        convert();
    });

    fromValue.addEventListener("input", convert);
    fromUnit.addEventListener("change", convert);
    toUnit.addEventListener("change", convert);

    renderTabs();
    renderUnits();
    convert();
</script>
