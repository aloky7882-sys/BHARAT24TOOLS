<body>

<div class="container">

    <h1>
        <i class="fa-solid fa-file-image" style="color:#0d6efd;"></i>
        JPG to PNG Converter
    </h1>

    <div class="upload-zone" id="dropZone">
        <div class="upload-icon">
            <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>

        <div class="upload-title">
            Drag & Drop your JPG here
        </div>

        <div class="upload-subtitle">
            or click to choose an image
        </div>

        <div class="upload-formats">
            JPG / JPEG
        </div>

        <input type="file" id="upload" accept=".jpg,.jpeg,image/jpeg">
    </div>

    <img id="preview" class="preview" alt="Preview">

    <button id="download" style="display:none;">Download PNG</button>

    <div id="status"></div>

</div>

<script>

const upload = document.getElementById("upload");
const preview = document.getElementById("preview");
const download = document.getElementById("download");
const status = document.getElementById("status");
const dropZone = document.getElementById("dropZone");

let pngImage = "";

function processFile(file){

    if(!file) return;

    if(
        file.type !== "image/jpeg" &&
        !file.name.toLowerCase().endsWith(".jpg") &&
        !file.name.toLowerCase().endsWith(".jpeg")
    ){
        status.innerText = "❌ Please select a JPG/JPEG image.";
        status.style.color = "#dc3545";
        return;
    }

    status.innerText = "Converting...";
    status.style.color = "#0d6efd";

    const reader = new FileReader();

    reader.onload = function(e){

        const img = new Image();

        img.onload = function(){

            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = img.width;
            canvas.height = img.height;

            ctx.drawImage(img, 0, 0);

            pngImage = canvas.toDataURL("image/png");

            preview.src = pngImage;
            preview.style.display = "block";
            download.style.display = "block";

            status.innerText = "✅ Ready! Click Download PNG.";
            status.style.color = "#198754";

        };

        img.onerror = function(){
            status.innerText = "❌ Could not process the image.";
            status.style.color = "#dc3545";
        };

        img.src = e.target.result;

    };

    reader.onerror = function(){
        status.innerText = "❌ Could not read the image.";
        status.style.color = "#dc3545";
    };

    reader.readAsDataURL(file);

}

upload.addEventListener("change", function(){
    processFile(this.files[0]);
});

dropZone.addEventListener("dragover", function(e){
    e.preventDefault();
    dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", function(){
    dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", function(e){
    e.preventDefault();
    dropZone.classList.remove("dragover");
    processFile(e.dataTransfer.files[0]);
});

download.addEventListener("click", function(){
    if(!pngImage) return;
    const a = document.createElement("a");
    a.href = pngImage;
    a.download = "converted-image.png";
    a.click();
});

</script>
