        <h1>🔎 Image to Text (OCR)</h1>
        <p class="subtitle">Kisi bhi photo se text nikaalo, seconds me. AI powered, free.</p>

        <div class="card">
            <div class="drop-zone" id="drop-zone">
                <div class="icon">📷</div>
                <p><strong>Click karo</strong> ya photo yahan drag-drop karo</p>
            </div>
            <input type="file" id="file-input" accept="image/*">

                <img id="preview-img" alt="Selected image preview">
            </div>

        </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        (function () {
            var dropZone = document.getElementById('drop-zone');
            var fileInput = document.getElementById('file-input');
            var previewWrap = document.getElementById('preview-wrap');
            var previewImg = document.getElementById('preview-img');
            var extractBtn = document.getElementById('extract-btn');
            var status = document.getElementById('status');
            var resultWrap = document.getElementById('result-wrap');
            var resultText = document.getElementById('result-text');
            var copyBtn = document.getElementById('copy-btn');

            var selectedFile = null;

            dropZone.addEventListener('click', function () { fileInput.click(); });

            dropZone.addEventListener('dragover', function (e) {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
            dropZone.addEventListener('dragleave', function () {
                dropZone.classList.remove('dragover');
            });
            dropZone.addEventListener('drop', function (e) {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            fileInput.addEventListener('change', function () {
                if (fileInput.files && fileInput.files[0]) {
                    handleFile(fileInput.files[0]);
                }
            });

            function handleFile(file) {
                if (!file.type.startsWith('image/')) {
                    status.style.display = 'block';
                    status.textContent = 'Sirf image files allowed hain.';
                    return;
                }
                selectedFile = file;
                var reader = new FileReader();
                reader.onload = function (e) {
                    previewImg.src = e.target.result;
                    previewWrap.style.display = 'block';
                    extractBtn.style.display = 'block';
                    resultWrap.style.display = 'none';
                    status.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }

            extractBtn.addEventListener('click', function () {
                if (!selectedFile) return;
                extractBtn.disabled = true;
                extractBtn.textContent = 'Processing...';
                status.style.display = 'block';
                status.textContent = 'AI photo padh raha hai, thoda wait karo...';
                resultWrap.style.display = 'none';

                Tesseract.recognize(selectedFile, 'eng', {
                    logger: function (m) {
                        if (m.status === 'recognizing text') {
                            var pct = Math.round(m.progress * 100);
                            status.textContent = 'Padh raha hai... ' + pct + '%';
                        }
                    }
                }).then(function (result) {
                    resultText.value = result.data.text.trim() || 'Koi text nahi mila is image me.';
                    resultWrap.style.display = 'block';
                    status.style.display = 'none';
                    extractBtn.disabled = false;
                    extractBtn.textContent = 'Text Nikaalo';
                }).catch(function () {
                    status.textContent = 'Kuch galat ho gaya, dobara try karo.';
                    extractBtn.disabled = false;
                    extractBtn.textContent = 'Text Nikaalo';
                });
            });

            copyBtn.addEventListener('click', function () {
                resultText.select();
                resultText.setSelectionRange(0, 999999);
                navigator.clipboard.writeText(resultText.value).then(function () {
                    copyBtn.textContent = 'Copied!';
                    setTimeout(function () { copyBtn.textContent = 'Copy Text'; }, 1500);
                });
            });
        })();
    </script>
